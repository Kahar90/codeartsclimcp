<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CodeArts Lanes</title>
<style>
:root{--bg:#f5f6f8;--panel:#fff;--ink:#1c2230;--mute:#6a7387;--line:#e2e5eb;--ok:#1d8a4b;--warn:#a96f12;--bad:#c33232;--run:#2563b0;--code:#f1f3f6;--sel:#e9f0fb;--soft:#f7f8fa;--bar:#e7eaf0}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#101318;--panel:#171b22;--ink:#e5e8ee;--mute:#8a93a6;--line:#29303b;--ok:#4cc27e;--warn:#e3b341;--bad:#f07a7a;--run:#5fa8ee;--code:#12151b;--sel:#1c2838;--soft:#1b2029;--bar:#262d38}}
:root[data-theme=dark]{--bg:#101318;--panel:#171b22;--ink:#e5e8ee;--mute:#8a93a6;--line:#29303b;--ok:#4cc27e;--warn:#e3b341;--bad:#f07a7a;--run:#5fa8ee;--code:#12151b;--sel:#1c2838;--soft:#1b2029;--bar:#262d38}
*{box-sizing:border-box}html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 system-ui,"Segoe UI",sans-serif;display:flex;flex-direction:column}
header{display:flex;align-items:center;gap:12px;padding:10px 16px;border-bottom:1px solid var(--line);background:var(--panel)}
header h1{font-size:15px;margin:0}.mute{color:var(--mute)}.small{font-size:12px;color:var(--mute)}
main{flex:1;display:grid;grid-template-columns:300px 1fr;min-height:0}
#side{border-right:1px solid var(--line);overflow:auto;padding:10px}
#side h2{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--mute);margin:10px 4px 6px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:9px 10px;margin-bottom:7px;cursor:pointer}
.card:hover{border-color:var(--run)}.card.sel{background:var(--sel);border-color:var(--run)}
.row{display:flex;justify-content:space-between;gap:8px;align-items:center}
.name{font-weight:600;word-break:break-all}
.badge{font-size:11px;font-weight:600;padding:1px 7px;border-radius:10px;border:1px solid currentColor;white-space:nowrap}
.h-running,.h-running-tool{color:var(--run)}.h-quiet,.h-thinking,.h-needs-review,.h-stopped,.h-killed,.h-attention,.h-partial{color:var(--warn)}
.h-paused{color:var(--warn)}.h-continued{color:var(--mute)}
.h-STALLED,.h-DEAD,.h-failed{color:var(--bad)}.h-done{color:var(--ok)}.h-planned{color:var(--mute)}
.pulse{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--run);margin-right:6px;animation:p 1.2s infinite;vertical-align:1px}@keyframes p{50%{opacity:.25}}
.prog{height:5px;background:var(--bar);border-radius:3px;overflow:hidden;margin:6px 0 3px}.prog>i{display:block;height:100%;background:var(--run)}.prog.ok>i{background:var(--ok)}.prog.bad>i{background:var(--bad)}
#view{overflow:auto;min-height:0;display:flex;flex-direction:column}
.pad{padding:16px 20px}
.empty{padding:40px;color:var(--mute);text-align:center}
.title{font-size:20px;font-weight:650;margin:0 0 4px}
.goal{max-width:900px;margin:6px 0 14px}
.now{display:flex;gap:10px;align-items:flex-start;background:var(--sel);border:1px solid var(--run);border-radius:8px;padding:10px 12px;margin-bottom:16px}
.now b{white-space:nowrap}
.waves{display:flex;gap:10px;align-items:stretch;overflow-x:auto;padding-bottom:6px;margin-bottom:16px}
.wave{flex:0 0 280px;background:var(--soft);border:1px solid var(--line);border-radius:10px;padding:10px}
.wave h3{margin:0 0 2px;font-size:13px}.arrow{align-self:center;color:var(--mute);font-size:18px}
.lane{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:9px 10px;margin-top:8px;cursor:pointer}.lane:hover{border-color:var(--run)}
.cur{font-size:12.5px;margin-top:3px}.cur .lbl{color:var(--run);font-weight:600}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.box{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px;min-width:0}
.box h4{margin:0 0 8px;font-size:12px;letter-spacing:.05em;text-transform:uppercase;color:var(--mute)}
ul.plain{list-style:none;margin:0;padding:0}ul.plain li{padding:4px 0;border-top:1px solid var(--line);display:flex;gap:8px}ul.plain li:first-child{border-top:0}
.ic{width:18px;flex:0 0 18px;text-align:center;font-weight:700}
.st-done .ic{color:var(--ok)}.st-current .ic{color:var(--run)}.st-pending .ic,.st-open .ic{color:var(--mute)}.st-current{font-weight:600}.st-open .txt{color:var(--mute)}
.hash{font:11.5px Consolas,ui-monospace,monospace;color:var(--mute);white-space:nowrap;margin-left:auto}
.pipe{display:flex;gap:0;margin:12px 0 14px;flex-wrap:wrap}
.stage{padding:5px 12px;border:1px solid var(--line);background:var(--panel);font-size:12.5px;margin-right:-1px;color:var(--mute)}
.stage:first-child{border-radius:6px 0 0 6px}.stage:last-child{border-radius:0 6px 6px 0}
.stage.done{color:var(--ok)}.stage.active{color:#fff;background:var(--run);border-color:var(--run);font-weight:600}.stage.fail{color:var(--bad)}
.kv{display:flex;flex-wrap:wrap;gap:4px 16px;font-size:12.5px;color:var(--mute)}.kv b{color:var(--ink);font-weight:600}
.tools{font:12px Consolas,ui-monospace,monospace;margin-top:6px}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-top:16px}
.tab{padding:7px 12px;cursor:pointer;border:1px solid transparent;border-bottom:0;border-radius:6px 6px 0 0;color:var(--mute)}.tab.on{background:var(--panel);border-color:var(--line);color:var(--ink);margin-bottom:-1px}
pre.out{margin:0;padding:12px 14px;background:var(--code);border:1px solid var(--line);border-top:0;font:12.5px/1.5 Consolas,ui-monospace,monospace;white-space:pre-wrap;word-break:break-word;min-height:240px;max-height:60vh;overflow:auto}
pre.out .tool{color:var(--run)}pre.out .err{color:var(--bad)}pre.out .sys{color:var(--warn);font-weight:600}pre.out .think{color:var(--mute)}pre.out .steer{color:var(--ok);font-weight:600}
#bar{display:flex;gap:8px;padding:10px 20px;border-top:1px solid var(--line);background:var(--panel);position:sticky;bottom:0}
#bar input{flex:1;min-width:0;padding:8px 10px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink);font:inherit}
button{padding:7px 12px;border:1px solid var(--line);border-radius:6px;background:var(--panel);color:var(--ink);font:inherit;cursor:pointer}button:hover{border-color:var(--run)}
button.danger{color:var(--bad)}button:disabled{opacity:.45;cursor:default}
a{color:var(--run);text-decoration:none;cursor:pointer}
.card.mini{padding:6px 10px}code{font:12px Consolas,ui-monospace,monospace;background:var(--bar);padding:0 4px;border-radius:3px}
.cmd{display:flex;align-items:center;gap:10px;background:var(--code);border:1px solid var(--line);border-radius:6px;padding:8px 12px;margin:8px 0;cursor:pointer}.cmd:hover{border-color:var(--run)}.cmd code{background:none;padding:0;flex:1;word-break:break-all}
.tag{display:inline-block;max-width:100%;overflow:hidden;text-overflow:ellipsis;vertical-align:bottom;font-size:11px;padding:1px 6px;border-radius:4px;background:var(--bar);color:var(--mute);white-space:nowrap}
@media (max-width:900px){.grid2{grid-template-columns:1fr}}
@media (max-width:760px){main{grid-template-columns:1fr;grid-template-rows:auto 1fr}#side{max-height:34vh;border-right:0;border-bottom:1px solid var(--line)}.pad{padding:12px 16px}#bar{padding:10px 16px;flex-wrap:wrap}}
</style>
</head>
<body>
<header><h1>CodeArts lanes</h1><a href="/office">Office view</a><span class="small" id="meta">loading</span></header>
<main>
  <nav id="side"></nav>
  <section id="view"><div class="empty">Loading</div></section>
</main>
<script src="/assets/workshop.js"></script>
<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const cls = (h) => 'h-' + String(h || '').split('(')[0].trim().replace(/\s+/g, '-');
const ago = (t) => { if (!t) return ''; const s = Math.round((Date.now() - new Date(t).getTime()) / 1000); return s < 60 ? `${s}s ago` : s < 3600 ? `${Math.floor(s / 60)}m ago` : s < 86400 ? `${Math.floor(s / 3600)}h ago` : new Date(t).toLocaleDateString(); };
const md = (s) => esc(s).replace(/`([^`]+)`/g, '<code>$1</code>');
const clock = (t) => new Date(t).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
const short = (m) => String(m || '').replace(/^huaweicloud-maas\//, 'codearts/');
let plans = [], lanes = [], detail = null, route = { kind: '', id: '' }, tab = 'log', logPos = 0, logLane = null;

function prog(p, res) {
  const t = p?.total || 0, d = p?.done || 0; const pct = t ? Math.round((100 * d) / t) : 0;
  const k = res === 'failed' ? 'bad' : res === 'done' ? 'ok' : '';
  return `<div class="prog ${k}"><i style="width:${pct}%"></i></div>`;
}
const stepsLabel = (l) => l.progress?.total ? `${l.progress.done}/${l.progress.total} steps` : 'no numbered steps';
function curLine(l) {
  if (l.health === 'planned') return `<div class="cur mute">${l.plan?.briefExists ? 'brief written, not started' : 'brief not written yet'}</div>`;
  if (l.running && l.progress?.current) return `<div class="cur"><span class="lbl">Step ${l.progress.current.n}</span> ${md(l.progress.current.text)}</div>`;
  if (l.running) return `<div class="cur"><span class="lbl">${esc(l.phase)}</span> ${esc(l.now)}</div>`;
  return `<div class="cur mute">${esc(l.result)}${l.verdict ? ' · review: ' + esc(l.verdict) : ''}${l.reason ? ' · ' + esc(l.reason) : ''}</div>`;
}

function renderSide() {
  const inPlan = new Set(plans.flatMap((p) => p.waves.flatMap((w) => w.lanes.map((l) => l.id))));
  const loose = lanes.filter((l) => !inPlan.has(l.id));
  let h = '<h2>Plans</h2>';
  h += plans.length ? plans.map((p) => {
    const all = p.waves.flatMap((w) => w.lanes); const done = all.filter((l) => ['done', 'needs review'].includes(l.result)).length; const run = all.filter((l) => l.running).length;
    return `<div class="card ${route.kind === 'plan' && route.id === p.id ? 'sel' : ''}" data-go="plan/${esc(p.id)}">
      <div class="row"><span class="name">${run ? '<span class="pulse"></span>' : ''}${esc(p.title)}</span>${p.status ? `<span class="badge h-${esc(p.status)}">${esc(p.status)}</span>` : ''}</div>
      ${prog({ done, total: all.length })}<div class="small">${done}/${all.length} lanes done · ${run} running · ${p.waves.length} wave${p.waves.length === 1 ? '' : 's'}</div></div>`;
  }).join('') : '<div class="small" style="padding:0 4px 6px">No plan registered. The lead writes tasks/plan.json and runs <code>ca plan</code>.</div>';
  const laneCard = (l) => `<div class="card ${route.kind === 'lane' && route.id === l.id ? 'sel' : ''}" data-go="lane/${esc(l.id)}">
      <div class="row"><span class="name">${l.running ? '<span class="pulse"></span>' : ''}${esc(l.task)}</span><span class="badge ${cls(l.health)}">${esc(l.health)}</span></div>
      ${prog(l.progress, l.result)}<div class="small">${stepsLabel(l)} · ${esc(l.elapsed)} · ${esc(short(l.models?.build))}</div>${curLine(l)}</div>`;
  const miniCard = (l) => `<div class="card mini ${route.kind === 'lane' && route.id === l.id ? 'sel' : ''}" data-go="lane/${esc(l.id)}"><div class="row"><span class="name" style="font-weight:500">${esc(l.task)}</span><span class="badge ${cls(l.health)}">${esc(l.health)}</span></div></div>`;
  const act = loose.filter((l) => l.running), fin = loose.filter((l) => !l.running);
  h += `<h2>${plans.length ? 'Other lanes' : 'Lanes'}</h2>` + (act.length ? act.map(laneCard).join('') : '<div class="small" style="padding:0 4px 6px">None running</div>');
  if (fin.length) h += `<h2>Finished</h2>` + fin.map(miniCard).join('');
  $('side').innerHTML = h;
  for (const c of $('side').querySelectorAll('[data-go]')) c.onclick = () => go(c.dataset.go);
}

function renderPlan(p) {
  const laneBox = (l) => `<div class="lane" data-go="lane/${esc(l.id)}">
      <div class="row"><span class="name">${l.running ? '<span class="pulse"></span>' : ''}${esc(l.task)}</span><span class="badge ${cls(l.health)}">${esc(l.health)}</span></div>
      <div class="small">${esc(short(l.models?.build || l.plan?.model || 'default model'))}${l.elapsed ? ' · ' + esc(l.elapsed) : ''}${l.commits ? ' · commits ' + esc(l.commits) : ''}</div>
      ${prog(l.progress, l.result)}<div class="small">${stepsLabel(l)}</div>${curLine(l)}
      ${l.plan?.why ? `<div class="small" style="margin-top:4px">${esc(l.plan.why)}</div>` : ''}
      ${l.plan?.files?.length ? `<div style="margin-top:4px">${l.plan.files.slice(0, 6).map((f) => `<span class="tag">${esc(f)}</span>`).join(' ')}</div>` : ''}</div>`;
  const waves = p.waves.map((w, i) => `${i ? '<div class="arrow">&rarr;</div>' : ''}<div class="wave">
      <div class="row"><h3>${esc(w.name)}</h3><span class="badge ${cls(w.status)}">${esc(w.status)}</span></div>
      ${w.note ? `<div class="small">${esc(w.note)}</div>` : ''}${w.lanes.map(laneBox).join('') || '<div class="small" style="margin-top:8px">no lanes listed</div>'}</div>`).join('');
  const next = p.next.length ? `<ul class="plain">${p.next.map((n) => `<li class="${n.done ? 'st-done' : 'st-pending'}"><span class="ic">${n.done ? '&#10003;' : '&#9675;'}</span><span>${esc(n.text)}</span></li>`).join('')}</ul>` : '<div class="small">Nothing listed</div>';
  const dec = p.decisions.length ? `<ul class="plain">${[...p.decisions].reverse().map((d) => `<li><span class="hash" style="margin:0;min-width:64px">${esc(d.at ? clock(d.at) : '')}</span><span>${esc(d.text)}</span></li>`).join('')}</ul>` : '<div class="small">None yet</div>';
  $('view').innerHTML = `<div class="pad">
    <div class="row" style="justify-content:flex-start;gap:10px"><h2 class="title">${esc(p.title)}</h2>${p.status ? `<span class="badge h-${esc(p.status)}">${esc(p.status)}</span>` : ''}</div>
    <div class="small">plan by ${esc(p.lead)} · updated ${ago(p.updatedAt)} · ${esc(p.file)}</div>
    ${p.goal ? `<p class="goal">${esc(p.goal)}</p>` : ''}
    ${p.now ? `<div class="now"><b>${esc(p.lead)} now:</b><span>${esc(p.now)}</span></div>` : ''}
    <div class="waves">${waves}</div>
    <div class="grid2">
      <div class="box"><h4>Planned next (lead)</h4>${next}${p.risks.length ? `<h4 style="margin-top:14px">Risks</h4><ul class="plain">${p.risks.map((r) => `<li><span class="ic" style="color:var(--warn)">!</span><span>${esc(r)}</span></li>`).join('')}</ul>` : ''}</div>
      <div class="box"><h4>Decisions log</h4>${dec}</div>
    </div></div>`;
  for (const c of $('view').querySelectorAll('[data-go]')) c.onclick = () => go(c.dataset.go);
}

function pipeline(d) {
  const seen = new Set(d.phases.map((x) => x.phase)); const ph = d.result ? 'finished' : d.phase;
  const gateFail = d.gates.some((g) => !g.ok), gateOk = d.gates.length && d.gates[d.gates.length - 1].ok;
  const st = [
    ['Build', ph === 'build' || ph === 'starting' || ph === 'restart' || ph === 'backoff' ? 'active' : seen.has('build') ? 'done' : ''],
    ['Gates', ph === 'gate' ? 'active' : gateOk ? 'done' : gateFail ? 'fail' : ''],
    [`Fix${d.fixes ? ' ×' + d.fixes : ''}`, ph === 'fix' ? 'active' : seen.has('fix') ? 'done' : ''],
    ['Review', ph === 'review' ? 'active' : d.verdict ? (d.verdict === 'ready' ? 'done' : 'fail') : ''],
    [d.result ? d.result : 'Result', d.result ? (d.result === 'done' ? 'done' : 'fail') : ''],
  ];
  return `<div class="pipe">${st.map(([n, c]) => `<span class="stage ${c}">${esc(n)}</span>`).join('')}</div>`;
}
function renderLane(d, keep) {
  const t = d.tokens || {}; const plan = plans.find((p) => p.waves.some((w) => w.lanes.some((l) => l.id === d.id)));
  const steps = d.steps.length ? `<ul class="plain">${d.steps.map((s) => `<li class="st-${s.state}"><span class="ic">${s.state === 'done' ? '&#10003;' : s.state === 'current' ? '&#9654;' : '&#9675;'}</span><span class="txt">${s.n}. ${md(s.text)}</span>${s.commit ? `<span class="hash">${esc(s.commit)}</span>` : s.state === 'open' ? '<span class="hash">no commit</span>' : ''}</li>`).join('')}</ul>` : '<div class="small">The brief has no numbered steps.</div>';
  const extraCommits = d.commits.filter((c) => !d.steps.some((s) => s.commit === c.hash));
  const todos = d.todos.length ? `<ul class="plain">${d.todos.map((x) => `<li class="st-${x.status === 'completed' ? 'done' : x.status === 'in_progress' ? 'current' : 'pending'}"><span class="ic">${x.status === 'completed' ? '&#10003;' : x.status === 'in_progress' ? '&#9654;' : '&#9675;'}</span><span>${esc(x.text)}</span></li>`).join('')}</ul>` : '';
  const gates = d.gates.length ? `<ul class="plain">${d.gates.map((g) => `<li class="${g.ok ? 'st-done' : ''}"><span class="ic" style="color:${g.ok ? 'var(--ok)' : 'var(--bad)'}">${g.ok ? '&#10003;' : '&#10007;'}</span><span style="font-family:Consolas,monospace;font-size:12px">${esc(g.gate)}</span><span class="hash">${g.ms ? Math.round(g.ms / 1000) + 's' : ''}</span></li>`).join('')}</ul>` : `<div class="small">${d.checks.length ? d.checks.length + ' CHECK line(s), run when the builder finishes' : 'No CHECK lines; only the git-clean gate'}</div>`;
  const evts = [...d.steers.map((x) => ({ at: x.at, k: 'steer', t: `[${x.by}] ${x.text}` })), ...d.interruptions.map((x) => ({ at: x.at, k: 'int', t: `${x.phase}/${x.kind}: ${x.what}` })), ...d.errors.map((x) => ({ at: x.at, k: 'err', t: x.msg })), ...d.outside.map((x) => ({ at: x.at, k: 'out', t: `outside repo: ${x.tool} ${x.path}` }))].sort((a, b) => b.at - a.at);
  const tools = d.running && d.tools.length ? `<div class="tools">${d.tools.map((x) => `&gt; ${esc(x.tool)} ${esc(x.input)} <span class="mute">(${Math.round((Date.now() - x.since) / 1000)}s)</span>`).join('<br>')}</div>` : '';
  $('view').innerHTML = `<div class="pad" style="flex:1">
    ${plan ? `<div class="small"><a data-go="plan/${esc(plan.id)}">&larr; ${esc(plan.title)}</a></div>` : ''}
    <div class="row" style="justify-content:flex-start;gap:10px;margin-top:4px"><h2 class="title">${d.running ? '<span class="pulse"></span>' : ''}${esc(d.task)}</h2><span class="badge ${cls(d.health)}">${esc(d.health)}</span>${d.verdict ? `<span class="badge ${d.verdict === 'ready' ? 'h-done' : 'h-needs-review'}">review: ${esc(d.verdict)}</span>` : ''}</div>
    <div class="kv"><span>build <b>${esc(short(d.models?.build))}</b></span><span>review <b>${esc(short(d.models?.review))}</b></span><span>elapsed <b>${esc(d.elapsed)}</b></span><span>idle <b>${esc(d.idle)}</b></span><span>tokens <b>${t.input ?? 0}</b> in / <b>${t.output ?? 0}</b> out</span><span>steers <b>${d.steers.length}</b></span><span>interruptions <b>${d.interruptions.length}</b></span></div>
    <div class="small">${esc(d.repo)}</div>
    ${pipeline(d)}
    <div class="now"><b>${d.running ? 'Now:' : 'Result:'}</b><div style="min-width:0"><div>${d.running ? (d.progress?.current ? `Step ${d.progress.current.n} &middot; ` : '') + esc(d.now) : esc(d.result) + (d.reason ? ' &middot; ' + esc(d.reason) : '')}</div>${tools}</div></div>
    <div class="grid2">
      <div class="box"><h4>Plan steps (brief) &middot; ${d.progress.done}/${d.progress.total}</h4>${steps}
        ${extraCommits.length ? `<h4 style="margin-top:14px">Other commits</h4><ul class="plain">${extraCommits.map((c) => `<li><span class="hash" style="margin:0">${esc(c.hash)}</span><span>${esc(c.subject)}</span></li>`).join('')}</ul>` : ''}
        ${todos ? `<h4 style="margin-top:14px">Worker's own todo list</h4>${todos}` : ''}</div>
      <div class="box"><h4>Gates</h4>${gates}
        <h4 style="margin-top:14px">Files touched (${d.files.length})</h4>${d.files.length ? d.files.slice(-30).map((f) => `<span class="tag">${esc(f)}</span>`).join(' ') : '<div class="small">none yet</div>'}
        <h4 style="margin-top:14px">Steering and incidents</h4>${evts.length ? `<ul class="plain">${evts.slice(0, 20).map((e) => `<li><span class="hash" style="margin:0;min-width:48px">${clock(e.at)}</span><span style="color:${e.k === 'steer' ? 'var(--ok)' : e.k === 'err' ? 'var(--bad)' : 'var(--warn)'}">${esc(e.t)}</span></li>`).join('')}</ul>` : '<div class="small">none</div>'}</div>
    </div>
    <div class="tabs">${[['log', 'Transcript'], ['review', 'Review'], ['summary', 'Summary'], ['brief', 'Brief']].map(([k, n]) => `<span class="tab ${tab === k ? 'on' : ''}" data-tab="${k}">${n}</span>`).join('')}<span style="flex:1"></span>${tab === 'log' ? '<label class="small" style="align-self:center"><input type="checkbox" id="follow" checked> follow</label>' : ''}</div>
    <pre class="out" id="out"></pre></div>
    <div id="bar"><input id="msg" placeholder="Steer the builder: queued into its session within 2 s" ${d.running ? '' : 'disabled'}><button id="send" ${d.running ? '' : 'disabled'}>Steer</button><button id="attach" ${d.running ? '' : 'disabled'} title="Open the CodeArts TUI on this session in a new window">Open TUI</button><button id="stop" class="danger" ${d.running ? '' : 'disabled'}>Stop</button></div>`;
  for (const c of $('view').querySelectorAll('[data-go]')) c.onclick = () => go(c.dataset.go);
  for (const c of $('view').querySelectorAll('[data-tab]')) c.onclick = () => { tab = c.dataset.tab; logPos = 0; renderLane(detail); };
  if (tab === 'log') { if (!keep) { logPos = 0; logLane = d.id; pollLog(); } } else $('out').textContent = (tab === 'review' ? d.review : tab === 'summary' ? d.summary : d.brief) || '(nothing yet)';
  $('send').onclick = async () => { const text = $('msg').value.trim(); if (!text) return; const r = await post('steer', { text }); if (r.ok) $('msg').value = ''; else alert(r.error); };
  $('msg').onkeydown = (e) => { if (e.key === 'Enter') $('send').click(); };
  $('stop').onclick = async () => { if (confirm(`Stop lane ${d.task}?`)) await post('stop'); };
  $('attach').onclick = async () => { const r = await post('attach'); if (!r.ok) alert(r.error); };
}
// Re-render the lane view without losing typed steering text, scroll or the transcript.
function patchLane(d) {
  const msg = $('msg')?.value, focus = document.activeElement?.id === 'msg', out = $('out'), outHTML = out?.innerHTML, top = out?.scrollTop, vtop = $('view').scrollTop;
  const follow = $('follow')?.checked ?? true;
  renderLane(d, true);
  if (tab === 'log' && outHTML != null) { $('out').innerHTML = outHTML; logPos = savedPos; $('out').scrollTop = top; }
  if ($('follow')) $('follow').checked = follow;
  if (msg) $('msg').value = msg; if (focus) $('msg').focus(); $('view').scrollTop = vtop;
}
let savedPos = 0;
function lineClass(l) {
  if (/^\d\d:\d\d:\d\d ==/.test(l)) return 'sys';
  if (/^\d\d:\d\d:\d\d >> |^ {9}» /.test(l)) return 'steer';
  if (/^\d\d:\d\d:\d\d +! /.test(l)) return 'err';
  if (/^\d\d:\d\d:\d\d +[<>?] /.test(l)) return 'tool';
  if (/^\d\d:\d\d:\d\d +~ /.test(l)) return 'think';
  return '';
}
async function pollLog() {
  if (route.kind !== 'lane' || tab !== 'log' || !$('out')) return; const id = route.id;
  try {
    const r = await (await fetch(`/api/lane/${encodeURIComponent(id)}/log?from=${logPos}`)).json();
    if (id !== route.id || tab !== 'log' || !$('out')) return;
    if (r.reset || logPos === 0) $('out').innerHTML = '';
    if (r.text) {
      $('out').insertAdjacentHTML('beforeend', r.text.split('\n').map((l) => { const c = lineClass(l); return c ? `<span class="${c}">${esc(l)}</span>` : esc(l); }).join('\n'));
      if ($('follow')?.checked) $('out').scrollTop = $('out').scrollHeight;
    }
    logPos = savedPos = r.size;
  } catch {}
}
async function post(what, body) { const r = await fetch(`/api/lane/${encodeURIComponent(route.id)}/${what}`, { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(body || {}) }); return r.json(); }

// First-run onboarding panel: shown only while there are no plans and no lanes yet.
// /api/doctor is cached for 30 s (the poll runs every 2.5 s) and concurrent calls share one request.
let doctorCache = null, doctorAt = 0, doctorPromise = null;
async function fetchDoctor() {
  if (doctorCache && Date.now() - doctorAt < 30000) return doctorCache;
  if (!doctorPromise) doctorPromise = (async () => {
    try { doctorCache = await (await fetch('/api/doctor')).json(); } catch {}
    doctorAt = Date.now(); doctorPromise = null;
  })();
  await doctorPromise;
  return doctorCache;
}
async function copyText(t) {
  try { await navigator.clipboard.writeText(t); return true; } catch {}
  try { const ta = document.createElement('textarea'); ta.value = t; document.body.appendChild(ta); ta.select(); const ok = document.execCommand('copy'); ta.remove(); return ok; } catch { return false; }
}
async function renderOnboard() {
  const d = await fetchDoctor();
  const rows = Array.isArray(d?.checks) ? d.checks : [];
  const chip = (s) => `<span class="badge ${s === 'ok' ? 'h-done' : s === 'warn' ? 'h-needs-review' : 'h-failed'}">${esc(s)}</span>`;
  const mark = (s) => `<span class="ic" style="color:${s === 'ok' ? 'var(--ok)' : s === 'warn' ? 'var(--warn)' : 'var(--bad)'}">${s === 'ok' ? '&#10003;' : s === 'warn' ? '!' : '&#10007;'}</span>`;
  const doctorRows = rows.length ? `<ul class="plain">${rows.map((c) => `<li>${mark(c.status)}<span style="min-width:0"><span class="row" style="justify-content:flex-start;gap:8px"><b>${esc(c.name)}</b>${chip(c.status)}</span>${c.detail ? `<div class="small">${esc(c.detail)}</div>` : ''}${c.fix ? `<div class="small" style="white-space:pre-wrap;margin-top:2px">${esc(c.fix)}</div>` : ''}</span></li>`).join('')}</ul>` : '<div class="small">doctor not reachable yet; it retries automatically</div>';
  const harnesses = [['kiro', 'Kiro'], ['cursor', 'Cursor'], ['claude', 'Claude Code'], ['codex', 'Codex'], ['vscode', 'VS Code'], ['opencode', 'opencode']];
  $('view').innerHTML = `<section id="onboard"><div class="pad">
    <h2 class="title">Set up CodeArts lanes</h2>
    <p class="goal">One-time setup: CodeArts credentials, a git repo, a trusted folder and your harness (Kiro, Cursor, Claude Code, Codex or VS Code). <code>ca onboard</code> checks everything and applies the fixes.</p>
    <div class="box"><h4>Environment (doctor)</h4>${doctorRows}</div>
    <div class="box"><h4>Fix everything in one go</h4>
      <div class="cmd" id="onboard-cmd" title="click to copy"><code>ca onboard --yes</code><button id="onboard-copy">Copy</button></div>
      <div class="small">Run it in the repo you want to use. Without --yes it asks before each fix.</div></div>
    <div class="grid2">
      <div class="box"><h4>Or set up one harness</h4><ul class="plain">${harnesses.map(([h, n]) => `<li><span style="min-width:0"><code>ca setup ${h} .</code></span><span class="small">${n}</span></li>`).join('')}</ul></div>
      <div class="box"><h4>Your first lane</h4><ul class="plain">
        <li><span class="ic" style="color:var(--run)">1</span><span style="min-width:0"><code>ca init . my-task --goal "one sentence outcome"</code><div class="small">writes tasks/my-task.md</div></span></li>
        <li><span class="ic" style="color:var(--run)">2</span><span style="min-width:0">edit the brief: numbered steps and CHECK lines</span></li>
        <li><span class="ic" style="color:var(--run)">3</span><span style="min-width:0"><code>ca lane . my-task --detach</code><div class="small">starts the builder in the background</div></span></li>
        <li><span class="ic" style="color:var(--run)">4</span><span style="min-width:0"><code>ca wait &lt;lane&gt;</code><div class="small">blocks until it ends and prints CA_RESULT</div></span></li>
      </ul></div>
    </div></div></section>`;
  const copy = async () => { const b = $('onboard-copy'); if (!b) return; b.textContent = (await copyText('ca onboard --yes')) ? 'Copied' : 'Copy failed'; setTimeout(() => { const b2 = $('onboard-copy'); if (b2) b2.textContent = 'Copy'; }, 1500); };
  $('onboard-cmd').onclick = copy;
  $('onboard-copy').onclick = (e) => { e.stopPropagation(); copy(); };
}

function go(h) { location.hash = h; }
function parseRoute() { const [k, ...r] = location.hash.slice(1).split('/'); return { kind: k, id: decodeURIComponent(r.join('/')) }; }
async function refresh(full) {
  try { [plans, lanes] = await Promise.all([(await fetch('/api/plans')).json(), (await fetch('/api/lanes')).json()]); }
  catch { $('meta').textContent = 'dashboard server not reachable'; return; }
  const run = lanes.filter((l) => l.running).length;
  $('meta').textContent = `${plans.length} plan${plans.length === 1 ? '' : 's'} · ${run} running · ${lanes.length} lanes · ${new Date().toLocaleTimeString()}`;
  if (!route.kind) { const p = plans[0], l = lanes.find((x) => x.running) || lanes[0]; if (p) return go('plan/' + p.id); if (l) return go('lane/' + l.id); }
  renderSide();
  if (route.kind === 'plan') { const p = plans.find((x) => x.id === route.id); if (p) renderPlan(p); else $('view').innerHTML = '<div class="empty">Plan not found</div>'; }
  else if (route.kind === 'lane') {
    try { const d = await (await fetch(`/api/lane/${encodeURIComponent(route.id)}/detail`)).json(); if (d.error) throw new Error(d.error); const first = full || !detail || detail.id !== d.id; detail = d; first ? renderLane(d) : patchLane(d); }
    catch (e) { $('view').innerHTML = `<div class="empty">${esc(e.message)}</div>`; }
  }   else if (!plans.length && !lanes.length) await renderOnboard();
}
window.onhashchange = () => { route = parseRoute(); tab = 'log'; detail = null; refresh(true); };
route = parseRoute(); refresh(true); setInterval(() => refresh(false), 2500); setInterval(pollLog, 1500);
</script>
