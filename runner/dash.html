<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CodeArts Lanes</title>
<link rel="stylesheet" href="/assets/workshop.css">
<script src="/assets/workshop.js"></script>
<style>
/* Pixel Workshop Lanes page styles on top of the shared workshop.css tokens.
   Badge colours come from CAUI.status: running/done mint, quiet/thinking/stopped/needs review amber,
   STALLED/DEAD/failed coral. */
* { box-sizing: border-box }
html, body { height: 100% }
body { margin: 0; overflow: hidden; display: flex; flex-direction: column; }
#shell { flex: 1; display: grid; grid-template-columns: 280px minmax(0, 1fr); min-height: 0 }

/* ---------- rail ---------- */
#rail { border-right: 1px solid var(--border); background: var(--top); overflow-y: auto; padding: 12px 12px 24px; min-height: 0 }
#rail summary { display: none; }
#railBody { min-width: 0 }
.rail-h { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--faint); margin: 14px 2px 8px; font-weight: 700 }
.rail-card { border: 2px solid var(--border); background: var(--panel); border-radius: var(--radius-sm); padding: 10px 12px; margin-bottom: 8px; cursor: pointer }
.rail-card:hover { border-color: var(--border-2) }
.rail-card.sel { border-color: var(--sel); background: var(--sel-bg) }
.rail-card.closed:not(.sel) { opacity: .62 }
.rail-card.closed:not(.sel):hover { opacity: 1 }
.rail-row { display: flex; align-items: center; gap: 8px; min-width: 0 }
.rail-title { font-weight: 650; font-size: 13.5px; flex: 1; min-width: 0; overflow-wrap: anywhere }
.rail-sub { color: var(--muted); font-size: 12px; margin-top: 5px }
.rail-fin { display: flex; align-items: center; gap: 8px; padding: 7px 10px; border: 1px solid transparent; border-radius: var(--radius-sm); cursor: pointer; margin: 2px 0; min-width: 0 }
.rail-fin:hover { background: var(--panel) }
.rail-fin.sel { background: var(--sel-bg); border-color: var(--sel) }
.rail-fin .nm { flex: 1; min-width: 0; font-size: 13px; overflow-wrap: anywhere }
.rail-none { display: flex; align-items: center; gap: 8px; color: var(--faint); font-size: 12.5px; padding: 6px 2px }
.rail-div { border-top: 1px solid var(--border); margin: 14px 0 2px }

/* ---------- main column ---------- */
#view { overflow-y: auto; min-height: 0; display: flex; flex-direction: column; background: var(--bg) }
.pad { padding: 22px 28px 24px; flex: 1 0 auto; min-width: 0 }
.pad.has-bar { padding-bottom: 80px }
.empty { padding: 60px 20px; color: var(--faint); text-align: center }
code { font: 12px var(--mono); background: var(--raise); padding: 0 4px; border-radius: 3px; color: var(--sel-ink) }
a { text-decoration: none }

/* ---------- plan home ---------- */
.plan-head h1 { font: 700 28px/1.2 var(--font-display); margin: 0; letter-spacing: .005em }
.plan-sub { color: var(--muted); margin: 7px 0 0; font-size: 13.5px }
.goal { max-width: 900px; margin: 12px 0 0; font-size: 14.5px; color: var(--fg) }
.plan-path { color: var(--faint); font: 12px var(--mono); margin: 9px 0 0; overflow-wrap: anywhere }
.plan-tok { color: var(--muted); font: 12px var(--mono); margin: 6px 0 0 }
.lane-tok { color: var(--faint); font: 12px var(--mono); margin-top: 3px }
.leadband { display: flex; align-items: center; gap: 14px; border: 1.5px solid var(--sel); background: var(--panel); border-radius: var(--radius); padding: 12px 16px; margin: 18px 0 4px }
.leadband .who { font-weight: 700; color: var(--sel-ink); white-space: nowrap }
.leadband .vdiv { width: 1px; align-self: stretch; background: var(--border-2); flex: none }
.leadband .txt { min-width: 0; color: var(--fg) }
.spot { flex: none; line-height: 0 }

.wave { background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius); margin-top: 16px }
.wave-head { display: flex; align-items: center; gap: 12px; padding: 12px 16px }
.wave-head h3 { margin: 0; font-size: 15.5px; font-weight: 700 }
.wave-head .cnt { color: var(--faint); font-size: 12.5px; margin-left: auto; white-space: nowrap }
.chev { flex: none; width: 28px; height: 28px; display: inline-flex; align-items: center; justify-content: center; background: none; border: 1px solid var(--border-2); border-radius: 7px; color: var(--muted); cursor: pointer; font-size: 10px; padding: 0 }
.chev:hover { border-color: var(--sel); color: var(--fg) }
.chev .tri { display: inline-block; transition: transform .15s }
.chev[aria-expanded="false"] .tri { transform: rotate(-90deg) }
.wave-body { padding: 0 16px 16px; display: grid; gap: 12px }

.lane-card { border: 1px solid var(--border); background: var(--panel-2); border-radius: var(--radius-sm); padding: 14px 16px; display: flex; gap: 14px; min-width: 0 }
.lane-main { flex: 1; min-width: 0 }
.lane-name { font: 700 18px/1.3 var(--font-display); color: var(--sel-ink); overflow-wrap: anywhere }
.lane-name:hover { text-decoration: underline }
.lane-meta { color: var(--muted); font-size: 12.5px; margin-top: 3px }
.cont-line { color: var(--muted); font-size: 12px; margin-top: 3px; overflow-wrap: anywhere }
.lane-steps { display: flex; align-items: center; gap: 10px; margin-top: 10px; font-size: 12.5px; color: var(--muted) }
.prog { height: 6px; flex: 1; background: var(--raise); border-radius: 3px; overflow: hidden; min-width: 60px }
.prog > i { display: block; height: 100%; background: var(--run) }
.prog.bad > i { background: var(--bad) }
.curband { margin-top: 12px; border: 1px solid var(--border); background: var(--code-bg); border-radius: var(--radius-sm); padding: 10px 12px }
.curband .lbl { display: inline-block; font-size: 10.5px; letter-spacing: .1em; font-weight: 700; color: var(--sel-ink); background: var(--sel-bg); border-radius: 4px; padding: 2px 7px; text-transform: uppercase }
.curband .t1 { font-weight: 700; margin-top: 7px; font-size: 13.5px; overflow-wrap: anywhere }
.curband .t2 { color: var(--muted); font-size: 12.5px; margin-top: 2px; overflow-wrap: anywhere }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 9px }
.chip { font: 11.5px var(--mono); color: var(--muted); background: var(--raise); border: 1px solid var(--border); border-radius: 5px; padding: 2px 7px; overflow-wrap: anywhere }
.quick { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 14px }
.qchip { cursor: pointer; color: var(--sel-ink); background: var(--raise); border: 1px solid var(--border-2); font: 600 11.5px var(--font); border-radius: 5px; padding: 4px 9px }
.qchip:hover { border-color: var(--sel) }
.stepsdisc > button { display: inline-flex; align-items: center; gap: 7px; background: none; border: 0; color: var(--sel-ink); font: 600 12.5px var(--font); cursor: pointer; padding: 4px 2px }
.stepsdisc > button:hover { text-decoration: underline }
.stepsdisc .tri { display: inline-block; transition: transform .15s; font-size: 10px }
.stepsdisc > button[aria-expanded="false"] .tri { transform: rotate(-90deg) }
.steplist { list-style: none; margin: 8px 0 0; padding: 10px 12px; background: var(--code-bg); border: 1px solid var(--border); border-radius: var(--radius-sm) }
.steplist li { display: flex; gap: 9px; padding: 4px 0; font-size: 12.5px; align-items: flex-start }
.steplist .n { font: 11.5px var(--mono); color: var(--faint); flex: none; width: 20px; text-align: right; margin-top: 1px }
.steplist .ic { flex: none; width: 15px; text-align: center; font-size: 11px }
.steplist .st-done .ic { color: var(--run) } .steplist .st-current .ic { color: var(--sel) }
.steplist .st-pending .ic, .steplist .st-open .ic { color: var(--faint) }
.steplist .st-done .txt { color: var(--muted) } .steplist .st-current .txt { color: var(--fg); font-weight: 600 }
.steplist .txt { min-width: 0; overflow-wrap: anywhere }
.steplist .txt code, .steprow .txt code { font: 11.5px var(--mono); background: var(--raise); padding: 0 4px; border-radius: 3px; color: var(--sel-ink) }

.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-top: 16px }
.box { background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px 16px; min-width: 0 }
.box h4 { margin: 0 0 8px; font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--faint); font-weight: 700 }
ul.plain { list-style: none; margin: 0; padding: 0 }
ul.plain li { padding: 6px 0; border-top: 1px solid var(--border); display: flex; gap: 9px; align-items: flex-start }
ul.plain li:first-child { border-top: 0 }
.ic { width: 16px; flex: none; text-align: center; font-weight: 700; font-size: 12px }
.st-done .ic { color: var(--run) } .st-pending .ic { color: var(--faint) }
.risk .ic { color: var(--amber) }
.dec li { display: flex; gap: 10px; align-items: flex-start }
.dec .at { font: 11.5px var(--mono); color: var(--faint); flex: none; padding-top: 2px }
.dec .dv { width: 1px; align-self: stretch; background: var(--border); flex: none }
.dec .tx { min-width: 0; overflow-wrap: anywhere; color: var(--fg); font-size: 13px }

/* ---------- lane detail ---------- */
.backlink { display: inline-flex; align-items: center; gap: 6px; color: var(--muted); font-size: 13px; font-weight: 600 }
.backlink:hover { color: var(--sel-ink) }
.idrow { display: flex; align-items: center; gap: 14px; margin-top: 10px; flex-wrap: wrap }
.idrow h1 { font: 700 30px/1.15 var(--font-display); margin: 0; overflow-wrap: anywhere }
.metrics { display: flex; flex-wrap: wrap; row-gap: 6px; margin-top: 14px; font-size: 13px; min-width: 0 }
.metrics .m { display: flex; gap: 6px; padding: 2px 14px; border-left: 1px solid var(--border); align-items: baseline; min-width: 0 }
.metrics .m:first-child { border-left: 0; padding-left: 0 }
.metrics .lb { color: var(--muted); white-space: nowrap }
.metrics b { color: var(--fg); font-weight: 650; overflow-wrap: anywhere }
.tokbox { margin-top: 16px }
.tokby { display: grid; gap: 9px }
.tokrow { display: grid; grid-template-columns: minmax(96px, 140px) 60px minmax(0, 1fr); align-items: center; gap: 10px; font-size: 12.5px }
.tokrow .tk-lb { color: var(--muted); overflow-wrap: anywhere }
.tokrow .tk-n { font: 12px var(--mono); color: var(--fg); text-align: right }
.tokrow .tk-bar { height: 8px; background: var(--raise); border-radius: 4px; overflow: hidden; min-width: 40px }
.tokrow .tk-bar > i { display: block; height: 100%; background: var(--run) }
.tokrow .tk-bar > i.review { background: var(--sel) }
.tokrow .tk-bar > i.other { background: var(--amber) }
.wt { font: 12px var(--mono); color: var(--faint); margin-top: 10px; overflow-wrap: anywhere; user-select: all }
.pipe { display: flex; margin-top: 16px; flex-wrap: wrap }
.seg { padding: 6px 16px; border: 1px solid var(--border-2); background: var(--panel); color: var(--muted); font-size: 12.5px; font-weight: 600; margin-right: -1px; white-space: nowrap }
.seg:first-child { border-radius: var(--radius-sm) 0 0 var(--radius-sm) }
.seg:last-child { border-radius: 0 var(--radius-sm) var(--radius-sm) 0; margin-right: 0 }
.seg.done { color: var(--run) }
.seg.fail { color: var(--bad) }
.seg.live { background: var(--sel); border-color: var(--sel); color: #171320; font-weight: 700 }
.nowband { display: flex; gap: 12px; align-items: flex-start; border: 1.5px solid var(--sel); background: var(--panel); border-radius: var(--radius); padding: 12px 16px; margin-top: 16px }
.nowband .lb { color: var(--sel-ink); font-weight: 700; white-space: nowrap }
.nowband .bd { min-width: 0 }

.grid21 { display: grid; grid-template-columns: 2fr 1fr; gap: 16px; margin-top: 16px; align-items: start }
.steprow { display: flex; gap: 10px; padding: 8px 10px; border: 1px solid transparent; border-radius: var(--radius-sm); align-items: flex-start; cursor: pointer }
.steprow .n { font: 11.5px var(--mono); color: var(--faint); flex: none; width: 22px; text-align: right; margin-top: 2px }
.steprow .ic { flex: none; width: 15px; text-align: center; margin-top: 2px; font-size: 11px }
.steprow .txt { flex: 1; min-width: 0; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis }
.steprow.x .txt { white-space: normal; overflow-wrap: anywhere }
.steprow .hash { font: 11px var(--mono); color: var(--faint); flex: none; margin-top: 2px }
.steprow.s-current { border-color: var(--sel); background: var(--sel-bg) }
.steprow.s-current .ic { color: var(--sel) }
.steprow.s-done .ic { color: var(--run) }
.steprow.s-pending .ic, .steprow.s-open .ic { color: var(--faint) }

.ctxrow { border-top: 1px solid var(--border); padding: 10px 2px }
.ctxrow > button { display: flex; width: 100%; align-items: center; gap: 10px; background: none; border: 0; color: var(--fg); font: 600 13px var(--font); cursor: pointer; padding: 0; text-align: left }
.ctxrow .ci { color: var(--sel-ink); flex: none; width: 16px; text-align: center; font-size: 10px; transition: transform .15s }
.ctxrow .sum { color: var(--muted); font-weight: 400; margin-left: auto; font-size: 12.5px; text-align: right; overflow-wrap: anywhere }
.ctxrow > button[aria-expanded="false"] .ci { transform: rotate(-90deg) }
.ctxbody { margin-top: 8px; display: flex; flex-direction: column; gap: 4px; min-width: 0 }
.ctxbody .small { color: var(--muted); font-size: 12.5px }

/* ---------- evidence ---------- */
.evidence { margin-top: 18px; background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden }
.tabstrip { display: flex; align-items: center; gap: 2px; padding: 8px 10px 0; border-bottom: 1px solid var(--border); background: var(--panel-2); flex-wrap: wrap }
.etab { padding: 8px 14px; font: 600 13px var(--font); color: var(--muted); background: none; border: 0; border-radius: var(--radius-sm) var(--radius-sm) 0 0; cursor: pointer }
.etab:hover { color: var(--fg) }
.etab[aria-selected="true"] { color: var(--fg); background: var(--panel); box-shadow: inset 0 -2px 0 var(--sel) }
.follow { margin-left: auto; display: flex; align-items: center; gap: 7px; color: var(--muted); font-size: 12.5px; padding: 0 10px 8px; cursor: pointer; user-select: none; white-space: nowrap }
.ebody { margin: 0; padding: 12px 16px; background: var(--code-bg); font: 12.5px/1.55 var(--mono); white-space: pre-wrap; word-break: break-word; height: min(60vh, 520px); overflow: auto; color: var(--fg) }
.ebody .t { color: var(--faint) }
.ebody .tool { color: var(--sel) }
.ebody .err { color: var(--bad) }
.ebody .steer { color: var(--run); font-weight: 600 }
.ebody .think { color: var(--muted) }
.ebody .sys { color: var(--amber) }

/* ---------- actions ---------- */
#bar { position: sticky; bottom: 0; display: flex; gap: 8px; padding: 12px 28px; background: var(--bg); border-top: 1px solid var(--border); align-items: center }
#bar input { flex: 1; min-width: 120px; background: var(--panel); border: 1px solid var(--border-2); color: var(--fg); font: 13.5px var(--font); border-radius: var(--radius-sm); padding: 9px 12px }
#bar input:focus { outline: none; border-color: var(--sel) }
#bar input::placeholder { color: var(--faint) }
button.btn { background: var(--panel-2); border: 1px solid var(--border-2); color: var(--fg); font: 600 13px var(--font); border-radius: var(--radius-sm); padding: 9px 14px; cursor: pointer; white-space: nowrap }
button.btn:hover { border-color: var(--sel) }
button.btn:disabled { opacity: .45; cursor: default }
button.btn.primary { background: var(--sel); border-color: var(--sel); color: #171320 }
button.btn.danger { color: var(--bad); border-color: var(--bad); background: transparent }
#steerErr { color: var(--bad); font-size: 12.5px; flex: none; max-width: 300px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap }
.ctlbar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; min-width: 0 }
.ctlbar .why { color: var(--muted); font-size: 12px; max-width: 220px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap }
.notebox { display: flex; gap: 8px; align-items: center; flex-basis: 100%; min-width: 0; margin-top: 8px }
.notebox textarea { flex: 1; min-width: 140px; min-height: 34px; max-height: 96px; resize: vertical; background: var(--panel); border: 1px solid var(--border-2); color: var(--fg); font: 13px var(--font); border-radius: var(--radius-sm); padding: 8px 10px }
.notebox textarea:focus { outline: none; border-color: var(--sel) }
#toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); z-index: 60; background: var(--panel); border: 1.5px solid var(--sel); color: var(--fg); border-radius: var(--radius-sm); padding: 9px 15px; font-size: 13px; max-width: 80vw; box-shadow: 0 8px 26px rgba(0,0,0,.4) }
#toast.err { border-color: var(--bad); color: var(--bad) }

/* ---------- onboarding ---------- */
.cmd { display: flex; align-items: center; gap: 10px; background: var(--code-bg); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 10px 12px; margin: 8px 0; cursor: pointer }
.cmd:hover { border-color: var(--sel) }
.cmd code { background: none; padding: 0; flex: 1; overflow-wrap: anywhere }
.small { color: var(--muted); font-size: 12.5px }
.mute { color: var(--muted) }

/* ---------- control room ---------- */
.cr-head { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap }
.cr-head h1 { font: 700 28px/1.2 var(--font-display); margin: 0 }
.cr-sub { color: var(--muted); font-size: 13.5px }
.crtiles { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; margin-top: 16px }
.crtile { display: flex; align-items: center; gap: 10px; background: var(--panel); border: 2px solid var(--border); border-radius: var(--radius); padding: 12px 14px; cursor: pointer; color: var(--muted); font: inherit; text-align: left }
.crtile:hover { border-color: var(--border-2) }
.crtile.on { border-color: var(--sel); background: var(--sel-bg) }
.crtile .buk-ico { width: 20px; height: 20px; flex: none }
.crtile .crn { font: 700 22px/1 var(--font-display); margin-left: auto }
.crtile .crw { font-size: 12.5px; font-weight: 650 }
.crtile.s-bad { color: var(--bad) } .crtile.s-run, .crtile.s-done { color: var(--run) } .crtile.s-idle { color: var(--muted) }
.cr-list { margin-top: 18px; display: grid; gap: 12px }
.cr-sec { border: 1px solid var(--border); background: var(--panel); border-radius: var(--radius); overflow: hidden }
.cr-sec-h { display: flex; align-items: center; gap: 9px; padding: 11px 14px; font-weight: 700; color: var(--fg) }
.cr-sec-h .buk-ico { width: 16px; height: 16px; flex: none }
.cr-sec-h .cnt { margin-left: auto; color: var(--faint); font-size: 12.5px }
.cr-name { padding: 10px 14px; border-top: 1px solid var(--border); cursor: pointer; font-size: 13.5px }
.cr-name.eye { cursor: pointer }
.cr-name.eye:hover { border-color: var(--sel) }
.cr-name:hover { background: var(--panel-2) }
@media (max-width: 640px) { .crtiles { grid-template-columns: repeat(2, minmax(0, 1fr)) } }

/* ---------- motion ---------- */
@keyframes rowflash { 0% { background: var(--sel-bg); box-shadow: inset 0 0 0 1px var(--sel) } 100% { background: transparent; box-shadow: none } }
.flash { animation: rowflash 1.6s ease-out 1 }
@media (prefers-reduced-motion: reduce) { .flash { animation: none } }
[hidden] { display: none !important }

/* ---------- narrow ---------- */
@media (max-width: 1024px) { .grid21 { grid-template-columns: 1fr } }
@media (max-width: 900px) {
  .grid2 { grid-template-columns: 1fr }
  .pad { padding: 16px 18px 20px }
  #bar { padding: 10px 18px; flex-wrap: wrap }
  #bar input { flex-basis: 100% }
}
@media (max-width: 759px) {
  #shell { grid-template-columns: 1fr; grid-template-rows: auto minmax(0, 1fr) }
  #rail { overflow: visible; border-right: 0; border-bottom: 1px solid var(--border); padding: 0 }
  #rail summary { display: flex; align-items: center; gap: 8px; padding: 12px 16px; cursor: pointer; color: var(--fg); font: 650 14px var(--font); list-style: none }
  #rail summary::-webkit-details-marker { display: none }
  #rail summary .tri { color: var(--faint); font-size: 10px; transition: transform .15s }
  #rail[open] summary .tri { transform: rotate(90deg) }
  #rail:not([open]) #railBody { display: none }
  #railBody { padding: 0 12px 12px }
  .pad { padding: 14px 14px 16px }
  .pad.has-bar { padding-bottom: calc(var(--bar-h, 0px) + 16px) }
  #bar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; padding: 10px 14px; border-left: 0; border-right: 0 }
  .metrics .m { padding: 2px 10px }
}
@media (max-width: 420px) {
  .ca-top { gap: 8px; padding: 0 10px }
  .ca-brand { font-size: 15px }
  .ca-tab { padding: 0 8px; font-size: 13px; gap: 6px }
  .ca-counts { font-size: 11px }
}
</style>
</head>
<body>
<header class="ca-top">
  <a class="ca-brand" href="/">CodeArts</a><span class="ca-sep"></span>
  <nav class="ca-tabs" aria-label="Views">
    <a class="ca-tab" href="/office"><svg class="ca-ico" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><rect x="2" y="2" width="6" height="6" rx="1"/><rect x="10" y="2" width="6" height="6" rx="1"/><rect x="2" y="10" width="6" height="6" rx="1"/><rect x="10" y="10" width="6" height="6" rx="1"/></svg>Office</a>
    <a class="ca-tab" href="/" aria-current="page"><svg class="ca-ico" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" aria-hidden="true"><path d="M9 1.5 16.5 5.5 9 9.5 1.5 5.5Z"/><path d="M1.5 9 9 13 16.5 9"/><path d="M1.5 12.5 9 16.5 16.5 12.5"/></svg>Lanes</a>
  </nav>
  <span class="ca-top-fill"></span><span class="ca-counts" id="counts">loading</span>
</header>
<div id="shell">
  <details id="rail" open>
    <summary><span class="tri">&#9654;</span>Plans and lanes</summary>
    <div id="railBody"></div>
  </details>
  <main id="view"><div class="empty">Loading</div></main>
</div>
<script>
