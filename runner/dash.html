<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CodeArts Lanes</title>
<style>
:root{--bg:#f5f6f8;--panel:#fff;--ink:#1c2230;--mute:#6a7387;--line:#e2e5eb;--ok:#1d8a4b;--warn:#a96f12;--bad:#c33232;--run:#2563b0;--code:#f1f3f6;--sel:#e9f0fb;--soft:#f7f8fa;--bar:#e7eaf0}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#101318;--panel:#171b22;--ink:#e5e8ee;--mute:#8a93a6;--line:#29303b;--ok:#4cc27e;--warn:#e3b341;--bad:#f07a7a;--run:#5fa8ee;--code:#12151b;--sel:#1c2838;--soft:#1b2029;--bar:#262d38}}
:root[data-theme=dark]{--bg:#101318;--panel:#171b22;--ink:#e5e8ee;--mute:#8a93a6;--line:#29303b;--ok:#4cc27e;--warn:#e3b341;--bad:#f07a7a;--run:#5fa8ee;--code:#12151b;--sel:#1c2838;--soft:#1b2029;--bar:#262d38}
*{box-sizing:border-box}html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 system-ui,"Segoe UI",sans-serif;display:flex;flex-direction:column}
header{display:flex;align-items:center;gap:12px;padding:10px 16px;border-bottom:1px solid var(--line);background:var(--panel)}
header h1{font-size:15px;margin:0}.mute{color:var(--mute)}.small{font-size:12px;color:var(--mute)}
main{flex:1;display:grid;grid-template-columns:300px 1fr;min-height:0}
#side{border-right:1px solid var(--line);overflow:auto;padding:10px}
#side h2{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--mute);margin:10px 4px 6px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:9px 10px;margin-bottom:7px;cursor:pointer}
.card:hover{border-color:var(--run)}.card.sel{background:var(--sel);border-color:var(--run)}
.row{display:flex;justify-content:space-between;gap:8px;align-items:center}
.name{font-weight:600;word-break:break-all}
.badge{font-size:11px;font-weight:600;padding:1px 7px;border-radius:10px;border:1px solid currentColor;white-space:nowrap}
.h-running,.h-running-tool{color:var(--run)}.h-quiet,.h-thinking,.h-needs-review,.h-stopped,.h-killed,.h-attention,.h-partial{color:var(--warn)}
.h-STALLED,.h-DEAD,.h-failed{color:var(--bad)}.h-done{color:var(--ok)}.h-planned{color:var(--mute)}
.pulse{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--run);margin-right:6px;animation:p 1.2s infinite;vertical-align:1px}@keyframes p{50%{opacity:.25}}
.prog{height:5px;background:var(--bar);border-radius:3px;overflow:hidden;margin:6px 0 3px}.prog>i{display:block;height:100%;background:var(--run)}.prog.ok>i{background:var(--ok)}.prog.bad>i{background:var(--bad)}
#view{overflow:auto;min-height:0;display:flex;flex-direction:column}
.pad{padding:16px 20px}
.empty{padding:40px;color:var(--mute);text-align:center}
.title{font-size:20px;font-weight:650;margin:0 0 4px}
.goal{max-width:900px;margin:6px 0 14px}
.now{display:flex;gap:10px;align-items:flex-start;background:var(--sel);border:1px solid var(--run);border-radius:8px;padding:10px 12px;margin-bottom:16px}
.now b{white-space:nowrap}
.waves{display:flex;gap:10px;align-items:stretch;overflow-x:auto;padding-bottom:6px;margin-bottom:16px}
.wave{flex:0 0 280px;background:var(--soft);border:1px solid var(--line);border-radius:10px;padding:10px}
.wave h3{margin:0 0 2px;font-size:13px}.arrow{align-self:center;color:var(--mute);font-size:18px}
.lane{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:9px 10px;margin-top:8px;cursor:pointer}.lane:hover{border-color:var(--run)}
.cur{font-size:12.5px;margin-top:3px}.cur .lbl{color:var(--run);font-weight:600}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.box{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px;min-width:0}
.box h4{margin:0 0 8px;font-size:12px;letter-spacing:.05em;text-transform:uppercase;color:var(--mute)}

.ic{width:18px;flex:0 0 18px;text-align:center;font-weight:700}

.pipe{display:flex;gap:0;margin:12px 0 14px;flex-wrap:wrap}
.stage{padding:5px 12px;border:1px solid var(--line);background:var(--panel);font-size:12.5px;margin-right:-1px;color:var(--mute)}
.stage:first-child{border-radius:6px 0 0 6px}.stage:last-child{border-radius:0 6px 6px 0}
.stage.done{color:var(--ok)}.stage.active{color:#fff;background:var(--run);border-color:var(--run);font-weight:600}.stage.fail{color:var(--bad)}
.kv{display:flex;flex-wrap:wrap;gap:4px 16px;font-size:12.5px;color:var(--mute)}.kv b{color:var(--ink);font-weight:600}
.tools{font:12px Consolas,ui-monospace,monospace;margin-top:6px}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-top:16px}
.tab{padding:7px 12px;cursor:pointer;border:1px solid transparent;border-bottom:0;border-radius:6px 6px 0 0;color:var(--mute)}.tab.on{background:var(--panel);border-color:var(--line);color:var(--ink);margin-bottom:-1px}
pre.out{margin:0;padding:12px 14px;background:var(--code);border:1px solid var(--line);border-top:0;font:12.5px/1.5 Consolas,ui-monospace,monospace;white-space:pre-wrap;word-break:break-word;min-height:240px;max-height:60vh;overflow:auto}
pre.out .tool{color:var(--run)}pre.out .err{color:var(--bad)}pre.out .sys{color:var(--warn);font-weight:600}pre.out .think{color:var(--mute)}pre.out .steer{color:var(--ok);font-weight:600}
#bar{display:flex;gap:8px;padding:10px 20px;border-top:1px solid var(--line);background:var(--panel);position:sticky;bottom:0}
#bar input{flex:1;min-width:0;padding:8px 10px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink);font:inherit}
button{padding:7px 12px;border:1px solid var(--line);border-radius:6px;background:var(--panel);color:var(--ink);font:inherit;cursor:pointer}button:hover{border-color:var(--run)}
button.danger{color:var(--bad)}button:disabled{opacity:.45;cursor:default}
a{color:var(--run);text-decoration:none;cursor:pointer}
.card.mini{padding:6px 10px}code{font:12px Consolas,ui-monospace,monospace;background:var(--bar);padding:0 4px;border-radius:3px}
.cmd{display:flex;align-items:center;gap:10px;background:var(--code);border:1px solid var(--line);border-radius:6px;padding:8px 12px;margin:8px 0;cursor:pointer}.cmd:hover{border-color:var(--run)}.cmd code{background:none;padding:0;flex:1;word-break:break-all}
.tag{display:inline-block;max-width:100%;overflow:hidden;text-overflow:ellipsis;vertical-align:bottom;font-size:11px;padding:1px 6px;border-radius:4px;background:var(--bar);color:var(--mute);white-space:nowrap}
@media (max-width:900px){.grid2{grid-template-columns:1fr}}
@media (max-width:760px){main{grid-template-columns:1fr;grid-template-rows:auto 1fr}#side{max-height:34vh;border-right:0;border-bottom:1px solid var(--line)}.pad{padding:12px 16px}#bar{padding:10px 16px;flex-wrap:wrap}}
</style>
</head>

  const d = await fetchDoctor();

  const chip = (s) => `<span class="badge ${s === 'ok' ? 'h-done' : s === 'warn' ? 'h-needs-review' : 'h-failed'}">${esc(s)}</span>`;
  const mark = (s) => `<span class="ic" style="color:${s === 'ok' ? 'var(--ok)' : s === 'warn' ? 'var(--warn)' : 'var(--bad)'}">${s === 'ok' ? '&#10003;' : s === 'warn' ? '!' : '&#10007;'}</span>`;
  const doctorRows = rows.length ? `<ul class="plain">${rows.map((c) => `<li>${mark(c.status)}<span style="min-width:0"><span class="row" style="justify-content:flex-start;gap:8px"><b>${esc(c.name)}</b>${chip(c.status)}</span>${c.detail ? `<div class="small">${esc(c.detail)}</div>` : ''}${c.fix ? `<div class="small" style="white-space:pre-wrap;margin-top:2px">${esc(c.fix)}</div>` : ''}</span></li>`).join('')}</ul>` : '<div class="small">doctor not reachable yet; it retries automatically</div>';
  const harnesses = [['kiro', 'Kiro'], ['cursor', 'Cursor'], ['claude', 'Claude Code'], ['codex', 'Codex'], ['vscode', 'VS Code'], ['opencode', 'opencode']];
  $('view').innerHTML = `<section id="onboard"><div class="pad">
    <h2 class="title">Set up CodeArts lanes</h2>
    <p class="goal">One-time setup: CodeArts credentials, a git repo, a trusted folder and your harness (Kiro, Cursor, Claude Code, Codex or VS Code). <code>ca onboard</code> checks everything and applies the fixes.</p>
    <div class="box"><h4>Environment (doctor)</h4>${doctorRows}</div>
    <div class="box"><h4>Fix everything in one go</h4>
      <div class="cmd" id="onboard-cmd" title="click to copy"><code>ca onboard --yes</code><button id="onboard-copy">Copy</button></div>
      <div class="small">Run it in the repo you want to use. Without --yes it asks before each fix.</div></div>
    <div class="grid2">
      <div class="box"><h4>Or set up one harness</h4><ul class="plain">${harnesses.map(([h, n]) => `<li><span style="min-width:0"><code>ca setup ${h} .</code></span><span class="small">${n}</span></li>`).join('')}</ul></div>
      <div class="box"><h4>Your first lane</h4><ul class="plain">
        <li><span class="ic" style="color:var(--run)">1</span><span style="min-width:0"><code>ca init . my-task --goal "one sentence outcome"</code><div class="small">writes tasks/my-task.md</div></span></li>
        <li><span class="ic" style="color:var(--run)">2</span><span style="min-width:0">edit the brief: numbered steps and CHECK lines</span></li>
        <li><span class="ic" style="color:var(--run)">3</span><span style="min-width:0"><code>ca lane . my-task --detach</code><div class="small">starts the builder in the background</div></span></li>
        <li><span class="ic" style="color:var(--run)">4</span><span style="min-width:0"><code>ca wait &lt;lane&gt;</code><div class="small">blocks until it ends and prints CA_RESULT</div></span></li>
      </ul></div>
    </div></div></section>`;
  const copy = async () => { const b = $('onboard-copy'); if (!b) return; b.textContent = (await copyText('ca onboard --yes')) ? 'Copied' : 'Copy failed'; setTimeout(() => { const b2 = $('onboard-copy'); if (b2) b2.textContent = 'Copy'; }, 1500); };
  $('onboard-cmd').onclick = copy;
  $('onboard-copy').onclick = (e) => { e.stopPropagation(); copy(); };
}

function go(h) { location.hash = h; }
function parseRoute() { const [k, ...r] = location.hash.slice(1).split('/'); return { kind: k, id: decodeURIComponent(r.join('/')) }; }
async function refresh(full) {
  try { [plans, lanes] = await Promise.all([api('/api/plans'), api('/api/lanes')]); }
  catch { $('meta').textContent = 'dashboard server not reachable'; return; }
  const run = lanes.filter((l) => l.running).length;
  $('meta').textContent = `${plans.length} plan${plans.length === 1 ? '' : 's'} · ${run} running · ${lanes.length} lanes · ${new Date().toLocaleTimeString()}`;
  if (!route.kind) { const p = plans[0], l = lanes.find((x) => x.running) || lanes[0]; if (p) return go('plan/' + p.id); if (l) return go('lane/' + l.id); }
  renderSide();
  if (route.kind === 'plan') { const p = plans.find((x) => x.id === route.id); if (p) renderPlan(p); else $('view').innerHTML = '<div class="empty">Plan not found</div>'; }
  else if (route.kind === 'lane') {
    try { const d = await api(`/api/lane/${encodeURIComponent(route.id)}/detail`); if (d.error) throw new Error(d.error); const first = full || !detail || detail.id !== d.id; detail = d; first ? renderLane(d) : patchLane(d); }
    catch (e) { $('view').innerHTML = `<div class="empty">${esc(e.message)}</div>`; }
  }   else if (!plans.length && !lanes.length) await renderOnboard();
}
window.onhashchange = () => { route = parseRoute(); tab = 'log'; detail = null; refresh(true); };
route = parseRoute(); refresh(true); setInterval(() => refresh(false), 2500); setInterval(pollLog, 1500);
</script>
</body>
</html>
