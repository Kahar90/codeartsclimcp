<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CodeArts Lanes</title>
<link rel="stylesheet" href="/assets/workshop.css">
<script src="/assets/workshop.js"></script>
<style>
/* Pixel Workshop Lanes page styles on top of the shared workshop.css tokens.
   Badge colours come from CAUI.status: running/done mint, quiet/thinking/stopped/needs review amber,
   STALLED/DEAD/failed coral. */
* { box-sizing: border-box }
html, body { height: 100% }
body { margin: 0; overflow: hidden; display: flex; flex-direction: column; }
#shell { flex: 1; display: grid; grid-template-columns: 280px minmax(0, 1fr); min-height: 0 }

/* ---------- rail ---------- */
#rail { border-right: 1px solid var(--border); background: var(--top); overflow-y: auto; padding: 12px 12px 24px; min-height: 0 }
#rail summary { display: none; }
#railBody { min-width: 0 }
.rail-h { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--faint); margin: 14px 2px 8px; font-weight: 700 }
.rail-card { border: 2px solid var(--border); background: var(--panel); border-radius: var(--radius-sm); padding: 10px 12px; margin-bottom: 8px; cursor: pointer }
.rail-card:hover { border-color: var(--border-2) }
.rail-card.sel { border-color: var(--sel); background: var(--sel-bg) }
.rail-card.closed:not(.sel) { opacity: .62 }
.rail-card.closed:not(.sel):hover { opacity: 1 }
.rail-row { display: flex; align-items: center; gap: 8px; min-width: 0 }
.rail-title { font-weight: 650; font-size: 13.5px; flex: 1; min-width: 0; overflow-wrap: anywhere }
.rail-sub { color: var(--muted); font-size: 12px; margin-top: 5px }
.rail-fin { display: flex; align-items: center; gap: 8px; padding: 7px 10px; border: 1px solid transparent; border-radius: var(--radius-sm); cursor: pointer; margin: 2px 0; min-width: 0 }
.rail-fin:hover { background: var(--panel) }
.rail-fin.sel { background: var(--sel-bg); border-color: var(--sel) }
.rail-fin .nm { flex: 1; min-width: 0; font-size: 13px; overflow-wrap: anywhere }
.rail-none { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; min-width: 0; color: var(--faint); font-size: 12.5px; padding: 6px 2px }
.rail-none code { overflow-wrap: anywhere }
.rail-div { border-top: 1px solid var(--border); margin: 14px 0 2px }

/* ---------- main column ---------- */
#view { overflow-y: auto; min-height: 0; display: flex; flex-direction: column; background: var(--bg) }
.pad { padding: 22px 28px 24px; flex: 1 0 auto; min-width: 0 }
.pad.has-bar { padding-bottom: 80px }
.empty { padding: 60px 20px; color: var(--faint); text-align: center }
code { font: 12px var(--mono); background: var(--raise); padding: 0 4px; border-radius: 3px; color: var(--sel-ink) }
a { text-decoration: none }

/* ---------- plan home ---------- */
.plan-head h1 { font: 700 28px/1.2 var(--font-display); margin: 0; letter-spacing: .005em }
.plan-sub { color: var(--muted); margin: 7px 0 0; font-size: 13.5px }
.goal { max-width: 900px; margin: 12px 0 0; font-size: 14.5px; color: var(--fg) }
.plan-path { color: var(--faint); font: 12px var(--mono); margin: 9px 0 0; overflow-wrap: anywhere }
.plan-tok { color: var(--muted); font: 12.5px var(--font); font-variant-numeric: tabular-nums; margin: 6px 0 0 }
.lane-tok { color: var(--faint); font: 12px var(--font); font-variant-numeric: tabular-nums; margin-top: 3px }
.leadband { display: flex; align-items: center; gap: 14px; border: 1.5px solid var(--sel); background: var(--panel); border-radius: var(--radius); padding: 12px 16px; margin: 18px 0 4px }
.leadband .who { font-weight: 700; color: var(--sel-ink); white-space: nowrap }
.leadband .vdiv { width: 1px; align-self: stretch; background: var(--border-2); flex: none }
.leadband .txt { min-width: 0; color: var(--fg) }
.leadstatus { border: 1px solid var(--border-2); background: var(--panel); border-radius: var(--radius); padding: 10px 16px; margin: 14px 0 2px }
.leadstatus .lps-head { display: flex; align-items: center; gap: 10px }
.leadstatus .who { font-weight: 700; color: var(--lead, var(--run)); white-space: nowrap }
.leadstatus .lps-phase { font: 600 11px var(--font); text-transform: uppercase; letter-spacing: .05em; color: var(--sel-ink); border: 1px solid var(--sel); border-radius: 999px; padding: 1px 8px; white-space: nowrap }
.leadstatus .lps-age { margin-left: auto; color: var(--muted); font: 12px var(--font); font-variant-numeric: tabular-nums; white-space: nowrap }
.leadstatus .lps-age[data-stale="1"] { color: var(--amber) }
.leadstatus .lps-act { margin-top: 6px; color: var(--fg); font-size: 13.5px; overflow-wrap: anywhere }
.leadstatus .leadact { margin-top: 6px; color: var(--muted) }
@media (max-width: 640px) {
  .leadband { display: grid; grid-template-columns: auto 1fr; gap: 6px 12px }
  .leadband .vdiv { display: none }
  .leadband .txt { grid-column: 1 / -1 }
}
.spot { flex: none; line-height: 0 }

.wave { background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius); margin-top: 16px }
.wave-head { display: flex; align-items: center; gap: 12px; padding: 12px 16px }
.wave-head h3 { margin: 0; font-size: 15.5px; font-weight: 700 }
.wave-head .cnt { color: var(--faint); font-size: 12.5px; margin-left: auto; white-space: nowrap }
.chev { flex: none; width: 28px; height: 28px; display: inline-flex; align-items: center; justify-content: center; background: none; border: 1px solid var(--border-2); border-radius: 7px; color: var(--muted); cursor: pointer; font-size: 10px; padding: 0 }
.chev:hover { border-color: var(--sel); color: var(--fg) }
.chev .tri { display: inline-block; transition: transform var(--dur-2) var(--ease-out) }
.chev[aria-expanded="true"] .tri { transform: rotate(90deg) }
.wave-body { padding: 0 16px 16px; display: grid; gap: 12px }

.lane-card { border: 1px solid var(--border); background: var(--panel-2); border-radius: var(--radius-sm); padding: 14px 16px; display: flex; gap: 14px; min-width: 0 }
.lane-main { flex: 1; min-width: 0 }
.lane-name { font: 700 18px/1.3 var(--font-display); color: var(--sel-ink); overflow-wrap: anywhere }
.lane-name:hover { text-decoration: underline }
.lane-meta { color: var(--muted); font-size: 12.5px; margin-top: 3px }
.cont-line { color: var(--muted); font-size: 12px; margin-top: 3px; overflow-wrap: anywhere }
.lane-steps { display: flex; align-items: center; gap: 10px; margin-top: 10px; font-size: 12.5px; color: var(--muted) }
.prog { height: 6px; flex: 1; background: var(--raise); border-radius: 3px; overflow: hidden; min-width: 60px }
.prog > i { display: block; height: 100%; background: var(--run); transition: width var(--dur-3) var(--ease-out) }
.prog.bad > i { background: var(--bad) }
.curband { margin-top: 12px; border: 1px solid var(--border); background: var(--code-bg); border-radius: var(--radius-sm); padding: 10px 12px }
.curband .lbl { display: inline-block; font-size: 10.5px; letter-spacing: .1em; font-weight: 700; color: var(--sel-ink); background: var(--sel-bg); border-radius: 4px; padding: 2px 7px; text-transform: uppercase }
.curband .t1 { font-weight: 700; margin-top: 7px; font-size: 13.5px; overflow-wrap: anywhere }
.curband .t2 { color: var(--muted); font-size: 12.5px; margin-top: 2px; overflow-wrap: anywhere }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 9px }
.chip { font: 11.5px var(--mono); color: var(--muted); background: var(--raise); border: 1px solid var(--border); border-radius: 5px; padding: 2px 7px; overflow-wrap: anywhere }
.quick { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 14px }
.qchip { cursor: pointer; color: var(--sel-ink); background: var(--raise); border: 1px solid var(--border-2); font: 600 11.5px var(--font); border-radius: 5px; padding: 4px 9px }
.qchip:hover { border-color: var(--sel) }
.stepsdisc > button { display: inline-flex; align-items: center; gap: 7px; background: none; border: 0; color: var(--sel-ink); font: 600 12.5px var(--font); cursor: pointer; padding: 4px 2px }
.stepsdisc > button:hover { text-decoration: underline }
.stepsdisc .tri { display: inline-block; transition: transform var(--dur-2) var(--ease-out); font-size: 10px }
.stepsdisc > button[aria-expanded="true"] .tri { transform: rotate(90deg) }
.steplist { list-style: none; margin: 8px 0 0; padding: 10px 12px; background: var(--code-bg); border: 1px solid var(--border); border-radius: var(--radius-sm) }
.steplist li { display: flex; gap: 9px; padding: 4px 0; font-size: 12.5px; align-items: flex-start }
.steplist .n { font: 11.5px var(--mono); color: var(--faint); flex: none; width: 20px; text-align: right; margin-top: 1px }
.steplist .ic { flex: none; width: 15px; text-align: center; font-size: 11px }
/* Bug C: a running lane's current step shows a CSS-only spinning ring where its mark sat, so the list
   looks alive; a paused/failed/stopped lane keeps its static mark, and reduced motion freezes the ring. */
.steplist .ic .step-spin, .steprow .ic .step-spin { display: inline-block; width: 10px; height: 10px; box-sizing: border-box; border-radius: 50%; border: 2px solid var(--sel); border-top-color: transparent; vertical-align: middle; animation: spin 0.9s linear infinite }
@keyframes spin { to { transform: rotate(360deg) } }
@media (prefers-reduced-motion: reduce) { .steplist .ic .step-spin, .steprow .ic .step-spin { animation: none } }
.steplist .st-done .ic { color: var(--run) } .steplist .st-current .ic { color: var(--sel) }
.steplist .st-pending .ic, .steplist .st-open .ic { color: var(--faint) }
.steplist .st-done .txt { color: var(--muted) } .steplist .st-current .txt { color: var(--fg); font-weight: 600 }
.steplist .txt { min-width: 0; overflow-wrap: anywhere }
.steplist .txt code, .steprow .txt code { font: 11.5px var(--mono); background: var(--raise); padding: 0 4px; border-radius: 3px; color: var(--sel-ink) }

.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-top: 16px }
.box { background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px 16px; min-width: 0 }
.box h4 { margin: 0 0 8px; font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--faint); font-weight: 700 }
ul.plain { list-style: none; margin: 0; padding: 0 }
ul.plain li { padding: 6px 0; border-top: 1px solid var(--border); display: flex; gap: 9px; align-items: flex-start }
ul.plain li:first-child { border-top: 0 }
.ic { width: 16px; flex: none; text-align: center; font-weight: 700; font-size: 12px }
.st-done .ic { color: var(--run) } .st-pending .ic { color: var(--faint) }
.risk .ic { color: var(--amber) }
.dec li { display: flex; gap: 10px; align-items: flex-start }
.dec .at { font: 11.5px var(--mono); color: var(--faint); flex: none; padding-top: 2px }
.dec .dv { width: 1px; align-self: stretch; background: var(--border); flex: none }
.dec .tx { min-width: 0; overflow-wrap: anywhere; color: var(--fg); font-size: 13px }

/* ---------- lane detail ---------- */
.backlink { display: inline-flex; align-items: center; gap: 6px; color: var(--muted); font-size: 13px; font-weight: 600 }
.backlink:hover { color: var(--sel-ink) }
.idrow { display: flex; align-items: center; gap: 14px; margin-top: 10px; flex-wrap: wrap }
.idrow h1 { font: 700 30px/1.15 var(--font-display); margin: 0; overflow-wrap: anywhere }
.metrics { display: flex; flex-wrap: wrap; row-gap: 6px; margin-top: 14px; font-size: 13px; min-width: 0 }
.metrics .m { display: flex; gap: 6px; padding: 2px 14px; border-left: 1px solid var(--border); align-items: baseline; min-width: 0 }
.metrics .m:first-child { border-left: 0; padding-left: 0 }
.metrics .lb { color: var(--muted); white-space: nowrap }
.metrics b { color: var(--fg); font-weight: 650; overflow-wrap: anywhere }
.tokbox { margin-top: 16px }
.tokby { display: grid; gap: 9px }
.tokrow { display: grid; grid-template-columns: minmax(96px, 140px) 60px minmax(0, 1fr); align-items: center; gap: 10px; font-size: 12.5px }
.tokrow .tk-lb { color: var(--muted); overflow-wrap: anywhere }
.tokrow .tk-n { font: 12px var(--mono); color: var(--fg); text-align: right }
.tokrow .tk-bar { height: 8px; background: var(--raise); border-radius: 4px; overflow: hidden; min-width: 40px }
.tokrow .tk-bar > i { display: block; height: 100%; background: var(--run) }
.tokrow .tk-bar > i.review { background: var(--sel) }
.tokrow .tk-bar > i.other { background: var(--amber) }
.modeltable { display: grid; gap: 7px; margin-top: 4px }
.mtrow { display: grid; grid-template-columns: minmax(0, 1.4fr) 62px minmax(72px, auto) minmax(0, 1.6fr); align-items: baseline; gap: 10px; font-size: 12.5px }
.mtrow.mt-h { color: var(--faint); font-size: 11px; text-transform: uppercase; letter-spacing: .04em }
.mt-model { color: var(--fg); font: 12px var(--mono); overflow-wrap: anywhere; min-width: 0 }
.mt-who { font-size: 11px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted) }
.mt-who.lead { color: var(--lead, var(--run)); font-weight: 700 }
.mt-n { font: 12px var(--mono); color: var(--fg); text-align: right; white-space: nowrap }
.mt-split { color: var(--faint); font-size: 11.5px; overflow-wrap: anywhere; min-width: 0 }
.mt-none { color: var(--amber); font-size: 11.5px; white-space: nowrap }
.wt { font: 12px var(--mono); color: var(--faint); margin-top: 10px; overflow-wrap: anywhere; user-select: all }
.pipe { display: flex; align-items: center; margin-top: 16px; flex-wrap: wrap }
.seg { display: inline-flex; align-items: center; gap: 7px; padding: 5px 12px; color: var(--muted); font-size: 12.5px; font-weight: 600; white-space: nowrap }
.seg:not(:last-child)::after { content: ""; width: 16px; height: 2px; margin: 0 4px; border-radius: 2px; background: var(--border); display: inline-block }
.seg .sg-ic { flex: none; font-size: 12px }
.seg .sg-future { color: var(--faint) }
.seg .sg-dot { width: 8px; height: 8px; flex: none; border-radius: 50%; background: var(--sel); animation: ca-pulse 1.8s var(--ease-out) infinite }
.seg.done { color: var(--run) }
.seg.fail { color: var(--bad) }
.seg.live { color: var(--sel-ink) }
.nowband { display: flex; gap: 12px; align-items: flex-start; border: 1.5px solid var(--sel); background: var(--panel); border-radius: var(--radius); padding: 12px 16px; margin-top: 16px }
.nowband .lb { color: var(--sel-ink); font-weight: 700; white-space: nowrap }
.nowband .bd { min-width: 0 }

.grid21 { display: grid; grid-template-columns: 2fr 1fr; gap: 16px; margin-top: 16px; align-items: start }
.steprow { display: flex; gap: 10px; padding: 8px 10px; border: 1px solid transparent; border-radius: var(--radius-sm); align-items: flex-start; cursor: pointer }
.steprow .n { font: 11.5px var(--mono); color: var(--faint); flex: none; width: 22px; text-align: right; margin-top: 2px }
.steprow .ic { flex: none; width: 15px; text-align: center; margin-top: 2px; font-size: 11px }
.steprow .txt { flex: 1; min-width: 0; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis }
.steprow.x .txt { white-space: normal; overflow-wrap: anywhere }
.steprow .hash { font: 11px var(--mono); color: var(--faint); flex: none; margin-top: 2px }
.steprow.s-current { border-color: var(--sel); background: var(--sel-bg) }
.steprow.s-current .ic { color: var(--sel) }
.steprow.s-done .ic { color: var(--run) }
.steprow.s-pending .ic, .steprow.s-open .ic { color: var(--faint) }

.ctxrow { border-top: 1px solid var(--border); padding: 10px 2px }
.ctxrow > button { display: flex; width: 100%; align-items: center; gap: 10px; background: none; border: 0; color: var(--fg); font: 600 13px var(--font); cursor: pointer; padding: 0; text-align: left }
.ctxrow .ci { color: var(--sel-ink); flex: none; width: 16px; text-align: center; font-size: 10px; transition: transform var(--dur-2) var(--ease-out) }
.ctxrow .sum { color: var(--muted); font-weight: 400; margin-left: auto; font-size: 12.5px; text-align: right; overflow-wrap: anywhere }
.ctxrow > button[aria-expanded="true"] .ci { transform: rotate(90deg) }
.ctxbody { display: grid; grid-template-rows: 0fr; transition: grid-template-rows var(--dur-2) var(--ease-out) }
.ctxrow.open .ctxbody { grid-template-rows: 1fr }
.ctx-inner { min-height: 0; overflow: hidden; display: flex; flex-direction: column; gap: 4px; min-width: 0; margin-top: 8px }
.ctxbody .small { color: var(--muted); font-size: 12.5px }

/* ---------- evidence ---------- */
.evidence { margin-top: 18px; background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden }
.tabstrip { display: flex; align-items: center; gap: 2px; padding: 8px 10px 0; border-bottom: 1px solid var(--border); background: var(--panel-2); flex-wrap: wrap }
.etab { padding: 8px 14px; font: 600 13px var(--font); color: var(--muted); background: none; border: 0; border-radius: var(--radius-sm) var(--radius-sm) 0 0; cursor: pointer }
.etab:hover { color: var(--fg) }
.etab[aria-selected="true"] { color: var(--fg); background: var(--panel); box-shadow: inset 0 -2px 0 var(--sel) }
.follow { margin-left: auto; display: flex; align-items: center; gap: 7px; color: var(--muted); font-size: 12.5px; padding: 0 10px 8px; cursor: pointer; user-select: none; white-space: nowrap }
.ebody { margin: 0; padding: 12px 16px; background: var(--code-bg); font: 12.5px/1.55 var(--mono); white-space: pre-wrap; word-break: break-word; height: min(60vh, 520px); overflow: auto; color: var(--fg) }
.ebody .t { color: var(--faint) }
.ebody .tool { color: var(--sel) }
.ebody .err { color: var(--bad) }
.ebody .steer { color: var(--run); font-weight: 600 }
.ebody .think { color: var(--muted) }
.ebody .sys { color: var(--amber) }

/* ---------- actions ---------- */
#bar { position: sticky; bottom: 0; display: flex; gap: 8px; padding: 12px 28px; background: var(--bg); border-top: 1px solid var(--border); align-items: center }
#bar input { flex: 1; min-width: 120px; background: var(--panel); border: 1px solid var(--border-2); color: var(--fg); font: 13.5px var(--font); border-radius: var(--radius-sm); padding: 9px 12px }
#bar input:focus { outline: none; border-color: var(--sel) }
#bar input::placeholder { color: var(--faint) }
button.btn { background: var(--panel-2); border: 1px solid var(--border-2); color: var(--fg); font: 600 13px var(--font); border-radius: var(--radius-sm); padding: 9px 14px; cursor: pointer; white-space: nowrap }
button.btn:hover { border-color: var(--sel) }
button.btn:disabled { opacity: .45; cursor: default }
button.btn.primary { background: var(--sel); border-color: var(--sel); color: #171320 }
button.btn.danger { color: var(--bad); border-color: var(--bad); background: transparent }
#steerErr { color: var(--bad); font-size: 12.5px; flex: none; max-width: 300px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap }
.ctlbar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; min-width: 0 }
.ctlbar .why { color: var(--muted); font-size: 12px; max-width: 220px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap }
.notebox { display: flex; gap: 8px; align-items: center; flex-basis: 100%; min-width: 0; margin-top: 8px }
.notebox textarea { flex: 1; min-width: 140px; min-height: 34px; max-height: 96px; resize: vertical; background: var(--panel); border: 1px solid var(--border-2); color: var(--fg); font: 13px var(--font); border-radius: var(--radius-sm); padding: 8px 10px }
.notebox textarea:focus { outline: none; border-color: var(--sel) }
#toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); z-index: 60; background: var(--panel); border: 1.5px solid var(--sel); color: var(--fg); border-radius: var(--radius-sm); padding: 9px 15px; font-size: 13px; max-width: 80vw; box-shadow: 0 8px 26px rgba(0,0,0,.4) }
#toast.err { border-color: var(--bad); color: var(--bad) }
/* ---------- delete control ---------- */
.del { display: inline-flex; align-items: center; gap: 5px; flex: none }
.del .ca-ico { width: 13px; height: 13px }
.rail-row .del, .rail-fin .del { padding: 4px 8px }
/* In the narrow plans rail the Delete control is icon only and quiet until the card is hovered or
   focused, so the plan title keeps the row width (aria-label and title still name it). */
.rail-row .del { padding: 3px 5px; min-height: 0; opacity: .45; transition: opacity .15s }
.rail-row .del > span { display: none }
.rail-card:hover .rail-row .del, .rail-card:focus-within .rail-row .del, .rail-row .del:focus-visible { opacity: 1 }
@media (hover: none) { .rail-row .del { opacity: 1 } }
.plan-head-row, .lane-title-row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; justify-content: space-between }

/* ---------- onboarding ---------- */
.cmd { display: flex; align-items: center; gap: 10px; background: var(--code-bg); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 10px 12px; margin: 8px 0; cursor: pointer }
.cmd:hover { border-color: var(--sel) }
.cmd code { background: none; padding: 0; flex: 1; min-width: 0; overflow-wrap: anywhere }
.small { color: var(--muted); font-size: 12.5px }
.mute { color: var(--muted) }
.onb-chip { display: inline-flex; align-items: center; height: 20px; padding: 0 9px; border-radius: 999px; border: 1.5px solid currentColor; font-size: 11.5px; font-weight: 650; line-height: 1; white-space: nowrap }
.onb-chip.ok { color: var(--run) } .onb-chip.warn { color: var(--amber) } .onb-chip.fail { color: var(--bad) }
.onb-summary { font-size: 13px; font-weight: 650; margin: 0 0 8px }
.onb-summary.ok { color: var(--run) } .onb-summary.bad { color: var(--bad) }
.onb-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; min-width: 0 }
.onb-name { font-weight: 650; flex: 1; min-width: 0; overflow-wrap: anywhere }
.onb-detail { color: var(--muted); font-size: 12.5px; margin-top: 3px; overflow-wrap: anywhere }
.onb-fix { display: flex; align-items: flex-start; gap: 8px; flex-wrap: wrap; margin-top: 4px; min-width: 0 }
.onb-fix code { flex: 1; min-width: 0; font: 11.5px var(--mono); background: var(--code-bg); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 7px 9px; color: var(--sel-ink); white-space: pre-wrap; overflow-wrap: anywhere }
.onb-tbl { border-collapse: collapse; width: 100%; margin-top: 8px; font-size: 12.5px }
.onb-tbl th, .onb-tbl td { text-align: left; padding: 6px 8px; border-top: 1px solid var(--border); vertical-align: top; overflow-wrap: anywhere }
.onb-tbl th { color: var(--faint); font-size: 11px; letter-spacing: .06em; text-transform: uppercase }
.onb-tbl tr:first-child th { border-top: 0 }
.onb-tbl td:first-child { font-weight: 650 }
.onb-harness { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0 }
.onb-hchip { font: inherit; font-size: 12.5px; padding: 4px 11px; border-radius: 999px; border: 1.5px solid var(--border-2); background: transparent; color: var(--muted); cursor: pointer }
.onb-hchip:hover { border-color: var(--sel); color: var(--fg) }
.onb-hchip.on { border-color: var(--sel); background: var(--sel-bg); color: var(--fg) }
#onb-byhand > summary { cursor: pointer; font-weight: 650; font-size: 13px }
#onb-byhand[open] > summary { margin-bottom: 8px }
#onboard code { overflow-wrap: anywhere }
#onboard .box, #onboard ul.plain li > span, #onboard .cmd > *, #onboard .onb-row > * { min-width: 0 }

/* ---------- control room ---------- */
.cr-head { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap }
.cr-head h1 { font: 700 28px/1.2 var(--font-display); margin: 0 }
.cr-sub { color: var(--muted); font-size: 13.5px }
.crtiles { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; margin-top: 16px }
.crtile { display: flex; align-items: center; gap: 12px; background: var(--panel); border: 1.5px solid var(--border); border-radius: var(--radius); padding: 11px 13px; cursor: pointer; color: var(--fg); font: inherit; text-align: left }
.crtile .cr-ic { display: inline-flex; align-items: center; justify-content: center; width: 34px; height: 34px; flex: none; border-radius: 10px; background: color-mix(in srgb, currentColor 14%, transparent) }
.crtile .cr-ic .buk-ico { width: 20px; height: 20px }
.crtile .cr-col { display: flex; flex-direction: column; min-width: 0 }
.crtile .crn { font: 700 26px/1.05 var(--font-display); font-variant-numeric: tabular-nums }
.crtile .crw { font-size: 13px; font-weight: 600; color: var(--muted) }
.crtile:hover { transform: translateY(-1px); border-color: currentColor }
.crtile.on { border-color: currentColor; background: color-mix(in srgb, currentColor 12%, var(--panel)) }
.crtile.s-bad { color: var(--bad) } .crtile.s-run, .crtile.s-done { color: var(--run) } .crtile.s-idle { color: var(--muted) }
.cr-list { margin-top: 18px; display: grid; gap: 12px }
.cr-sec { border: 1px solid var(--border); background: var(--panel); border-radius: var(--radius); overflow: hidden }
.cr-sec-h { display: flex; align-items: center; gap: 9px; width: 100%; padding: 11px 14px; background: none; border: 0; color: var(--fg); font: 700 13.5px var(--font); cursor: pointer; text-align: left }
.cr-sec-h:hover { background: var(--panel-2) }
.cr-sec-h .buk-ico { width: 16px; height: 16px; flex: none }
.cr-sec-h .cnt { margin-left: auto; color: var(--faint); font-size: 12.5px; font-weight: 400 }
.cr-sec-h .tri, .cr-seen-h .tri { color: var(--faint); font-size: 10px; transition: transform var(--dur-2) var(--ease-out) }
.cr-sec-h[aria-expanded="true"] .tri, .cr-seen-h[aria-expanded="true"] .tri { transform: rotate(90deg) }
.cr-sec-body { display: grid; grid-template-rows: 0fr; transition: grid-template-rows var(--dur-2) var(--ease-out) }
.cr-sec.open .cr-sec-body { grid-template-rows: 1fr }
.cr-sec-inner { min-height: 0; overflow: hidden }
.cr-row { padding: 12px 14px; border-top: 1px solid var(--border); min-width: 0; transition: background-color var(--dur-1) var(--ease-out) }
.cr-row:first-child { border-top: 0 }
.cr-row:hover { background: var(--panel-2) }
.cr-row-top { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; min-width: 0 }
.cr-task { font: 700 15px/1.2 var(--font-display); color: var(--sel-ink); overflow-wrap: anywhere }
.cr-task:hover { text-decoration: underline }
.cr-time { color: var(--muted); font-size: 12.5px }
.cr-open { margin-left: auto; display: inline-flex; align-items: center; justify-content: center; width: 30px; height: 30px; flex: none; border-radius: var(--radius-sm); color: var(--muted); transition: background-color var(--dur-1) var(--ease-out), color var(--dur-1) var(--ease-out) }
.cr-open:hover { background: var(--raise); color: var(--sel-ink) }
.cr-why { color: var(--muted); font-size: 12.5px; margin-top: 4px; overflow-wrap: anywhere }
.cr-row-foot { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-top: 8px; min-width: 0 }
.cr-row-foot .prog { width: 150px; max-width: 40vw; flex: none }
.cr-meta { color: var(--muted); font: 12px var(--font); font-variant-numeric: tabular-nums }
.cr-row-foot .ctlbar { flex: none }
.cr-seen-h { display: flex; align-items: center; gap: 8px; width: 100%; padding: 9px 14px; background: var(--panel-2); border: 0; border-top: 1px solid var(--border); color: var(--muted); font: 650 12.5px var(--font); cursor: pointer; text-align: left }
.cr-seen-h .cnt { margin-left: auto; color: var(--faint); font-weight: 400 }
.cr-old-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; padding: 6px 14px; background: var(--panel-2); border-top: 1px solid var(--border) }
.cr-old-h { display: flex; align-items: center; gap: 8px; flex: 1; min-width: 0; background: none; border: 0; color: var(--muted); font: 650 12.5px var(--font); cursor: pointer; text-align: left; padding: 3px 0 }
.cr-old-h .cnt { margin-left: auto; color: var(--faint); font-weight: 400 }
.cr-old-h .tri { color: var(--faint); font-size: 10px; transition: transform var(--dur-2) var(--ease-out) }
.cr-old-h[aria-expanded="true"] .tri { transform: rotate(90deg) }
.cr-old-body { display: grid; grid-template-rows: 0fr; transition: grid-template-rows var(--dur-2) var(--ease-out) }
.cr-old.open .cr-old-body { grid-template-rows: 1fr }
.cr-old-inner { min-height: 0; overflow: hidden }
.ca-badge.buk { gap: 5px }
.ca-badge.buk .buk-ico { width: 13px; height: 13px }
button.btn.tiny { padding: 5px 10px; font-size: 12px }
.cr-controls { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-top: 14px }
.cr-group { display: inline-flex; border: 1px solid var(--border-2); border-radius: var(--radius-sm); overflow: hidden }
.cr-gbtn { background: var(--panel); border: 0; color: var(--muted); font: 600 12.5px var(--font); padding: 7px 12px; cursor: pointer }
.cr-gbtn + .cr-gbtn { border-left: 1px solid var(--border-2) }
.cr-gbtn.on { background: var(--sel); color: #171320 }
.cr-chips { display: flex; flex-wrap: wrap; gap: 6px }
.cr-chip { display: inline-flex; align-items: center; gap: 6px; background: var(--panel); border: 1px solid var(--border-2); border-radius: 999px; color: var(--muted); font: 600 12px var(--font); padding: 5px 11px; cursor: pointer }
.cr-chip:hover { border-color: var(--sel) }
.cr-chip.on { border-color: var(--sel); background: var(--sel-bg); color: var(--sel-ink) }
.cr-chip .ca-badge { height: 18px; padding: 0 7px; font-size: 11px }
.cr-proj-h { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; padding: 11px 14px; border-bottom: 1px solid var(--border); background: var(--panel-2) }
.cr-proj-nm { font-weight: 700 }
.cr-proj-cnt { display: flex; gap: 6px; flex-wrap: wrap; margin-left: auto }
.cr-proj-cnt .ca-badge { height: 20px; font-size: 11.5px }
.crumb { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 6px; align-items: center }
.crumb-sep { color: var(--faint) }
.lane-bucket { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin: 6px 0 2px }
.lane-bucket .cr-why-big { color: var(--muted); font-size: 14px; overflow-wrap: anywhere }
/* four tiles need about 640 px of main column: below that (tablet with the rail, phone) they go 2 x 2 */
@media (max-width: 1100px) { .crtiles { grid-template-columns: repeat(2, minmax(0, 1fr)) } }
@media (max-width: 759px) and (min-width: 641px) { .crtiles { grid-template-columns: repeat(4, minmax(0, 1fr)) } }

/* ---------- freshness, stale banner, notifications ---------- */
.ca-fresh { color: var(--faint); font-size: 12.5px; white-space: nowrap }
.ca-fresh.bad { color: var(--bad); font-weight: 650 }
.ca-notify { display: inline-flex; align-items: center; gap: 7px; height: 32px; padding: 0 11px; border-radius: var(--radius-sm); border: 1px solid var(--border-2); background: var(--panel); color: var(--muted); font: 600 12.5px var(--font); cursor: pointer }
.ca-notify:hover { border-color: var(--sel); color: var(--fg) }
.ca-notify.on { border-color: var(--sel); background: var(--sel-bg); color: var(--sel-ink) }
.ca-notify .ca-ico { width: 15px; height: 15px }
.ca-stale { display: flex; align-items: center; justify-content: center; gap: 8px; background: rgba(255, 156, 156, 0.14); border-bottom: 1px solid var(--bad); color: var(--bad); font: 650 13px var(--font); padding: 8px 14px }
@media (max-width: 640px) { .ca-fresh, .ca-notify #notify-l { display: none } }

/* ---------- glance: banner, rail dot, tab title and favicon ---------- */
/* One state per plan (plan.glance), shown at a glance. Colours and breathing come from --glance,
   the state colour set inline from the contract's table. */
.glance-banner { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; width: 100%; box-sizing: border-box; margin: 0 0 6px; padding: 6px 16px; border-left: 6px solid var(--glance, var(--sel)); background: color-mix(in srgb, var(--glance, var(--sel)) 14%, var(--panel)); border-radius: var(--radius-sm) }
.pad.has-glance { padding-top: 10px }
.glance-banner .glance-glyph { font: 700 28px/1 var(--font-display); color: var(--glance, var(--sel)); flex: none }
.glance-banner .glance-word { font: 700 28px/1.1 var(--font-display); color: var(--fg); flex: none }
.glance-banner .glance-detail { color: var(--muted); font-size: 13.5px; min-width: 0; overflow-wrap: anywhere }
.glance-banner .glance-track { flex: 1 1 120px; min-width: 80px; height: 6px; background: var(--raise); border-radius: 3px; overflow: hidden }
.glance-banner .glance-track > i { display: block; height: 100%; background: var(--glance, var(--sel)) }
.glance-banner .glance-link { margin-left: auto; color: var(--sel-ink); font: 700 13.5px var(--font); white-space: nowrap }
.glance-banner .glance-link:hover { text-decoration: underline }
.glance-dot { width: 9px; height: 9px; flex: none; border-radius: 50%; background: var(--glance, var(--faint)); display: inline-block }
@keyframes glanceBreathe { 0%, 100% { opacity: 1 } 50% { opacity: .5 } }
.glance-banner[data-state="needs-you"], .glance-banner[data-state="failed"] { animation: glanceBreathe 2.4s var(--ease-out) infinite }
@media (prefers-reduced-motion: reduce) { .glance-banner[data-state="needs-you"], .glance-banner[data-state="failed"] { animation: none } }
@media (max-width: 640px) { .glance-banner { gap: 8px; padding: 9px 12px } .glance-banner .glance-glyph, .glance-banner .glance-word { font-size: 22px } }

/* ---------- button feel ---------- */
button.btn, .chip, .crtile, .ca-tab, .rail-card, .rail-fin, .etab, .cr-gbtn, .cr-chip, .ca-notify, .qchip {
  transition: background-color var(--dur-1) var(--ease-out), border-color var(--dur-1) var(--ease-out), color var(--dur-1) var(--ease-out), transform var(--dur-1) var(--ease-out), box-shadow var(--dur-1) var(--ease-out);
}
button.btn:hover, .chip:hover, .crtile:hover, .ca-tab:hover, .rail-card:hover, .rail-fin:hover, .etab:hover, .cr-gbtn:hover, .cr-chip:hover, .ca-notify:hover, .qchip:hover {
  background: var(--raise);
}
button.btn:active, .chip:active, .crtile:active, .ca-tab:active, .rail-card:active, .rail-fin:active, .etab:active, .cr-gbtn:active, .cr-chip:active, .ca-notify:active, .qchip:active {
  transform: translateY(1px) scale(0.98);
}
button.btn:disabled, .crtile:disabled, .etab:disabled, .cr-gbtn:disabled, .cr-chip:disabled, .ca-notify:disabled, .qchip:disabled {
  opacity: 0.5; cursor: not-allowed;
}
.ca-tab[aria-current="page"]:hover { background: #7a4fae; border-color: #9b6dd0; color: #fff; }
.rail-card.sel:hover { background: var(--sel-bg); border-color: var(--sel); }
.rail-fin.sel:hover { background: var(--sel-bg); border-color: var(--sel); }
.crtile.on:hover { background: var(--sel-bg); border-color: var(--sel); }
.cr-gbtn.on:hover { background: var(--sel); color: #171320; }
.cr-chip.on:hover { background: var(--sel-bg); border-color: var(--sel); color: var(--sel-ink); }
.ca-notify.on:hover { background: var(--sel-bg); border-color: var(--sel); color: var(--sel-ink); }
.etab[aria-selected="true"]:hover { background: var(--panel); }
@media (max-width: 640px) {
  button.btn, button.btn.tiny, .crtile { min-height: 32px; }
}

/* ---------- motion ---------- */
@keyframes rowflash { 0% { background: var(--sel-bg); box-shadow: inset 0 0 0 1px var(--sel) } 100% { background: transparent; box-shadow: none } }
.flash { animation: rowflash 1.6s ease-out 1 }
.ca-rise { animation: ca-rise var(--dur-2) var(--ease-out) }
@media (prefers-reduced-motion: reduce) { .flash { animation: none } }
[hidden] { display: none !important }

/* ---------- first-load skeleton ---------- */
.skeleton { display: grid; gap: 12px; max-width: 720px }
.skel-row { height: 66px; border-radius: var(--radius); background: var(--panel); border: 1px solid var(--border); animation: ca-pulse 1.4s var(--ease-out) infinite }
@media (prefers-reduced-motion: reduce) { .skel-row { animation: none; opacity: 0.7 } }

/* ---------- narrow ---------- */
@media (max-width: 1024px) { .grid21 { grid-template-columns: 1fr } }
@media (max-width: 900px) {
  .grid2 { grid-template-columns: 1fr }
  .pad { padding: 16px 18px 20px }
  #bar { padding: 10px 18px; flex-wrap: wrap }
  #bar input { flex-basis: 100% }
}
@media (max-width: 759px) {
  #shell { grid-template-columns: 1fr; grid-template-rows: auto minmax(0, 1fr) }
  #rail { overflow: visible; border-right: 0; border-bottom: 1px solid var(--border); padding: 0 }
  #rail summary { display: flex; align-items: center; gap: 8px; padding: 12px 16px; cursor: pointer; color: var(--fg); font: 650 14px var(--font); list-style: none }
  #rail summary::-webkit-details-marker { display: none }
  #rail summary .tri { color: var(--faint); font-size: 10px; transition: transform var(--dur-2) var(--ease-out) }
  #rail[open] summary .tri { transform: rotate(90deg) }
  #rail:not([open]) #railBody { display: none }
  #railBody { padding: 0 12px 12px }
  .pad { padding: 14px 14px 16px }
  .pad.has-bar { padding-bottom: calc(var(--bar-h, 0px) + 16px) }
  #bar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; padding: 10px 14px calc(10px + env(safe-area-inset-bottom)); border-left: 0; border-right: 0; flex-wrap: wrap; row-gap: 8px; box-shadow: 0 -10px 28px rgba(0, 0, 0, .35) }
  #bar input { flex: 1 1 0; flex-basis: 0; min-width: 0 }
  #bar #send { flex: none }
  #bar #steerErr:empty { display: none }
  /* one swipeable row of controls instead of three wrapped rows */
  #bar .ctlbar { flex: 1 0 100%; flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; -webkit-mask-image: linear-gradient(90deg, #000 88%, transparent); mask-image: linear-gradient(90deg, #000 88%, transparent); padding-right: 24px }
  #bar .ctlbar::-webkit-scrollbar { display: none }
  #bar .ctlbar > * { flex: none }
  .metrics { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 12px }
  .metrics .m { padding: 0; border-left: 0 }
  .pipe { flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; -webkit-mask-image: linear-gradient(90deg, #000 90%, transparent); mask-image: linear-gradient(90deg, #000 90%, transparent) }
  .seg { padding: 5px 6px }
  .seg:not(:last-child)::after { width: 10px }
}
@media (max-width: 420px) {
  .ca-top { gap: 8px; padding: 0 10px }
  .ca-brand { font-size: 15px }
  .ca-tab { padding: 0 8px; font-size: 13px; gap: 6px }
  .ca-counts { display: none } /* the Control room tiles carry the counts; the phone top bar has no room */
}
</style>
</head>
<body>
<header class="ca-top">
  <a class="ca-brand" href="/">CodeArts</a><span class="ca-sep"></span>
  <nav class="ca-tabs" aria-label="Views">
    <a class="ca-tab" href="/office"><svg class="ca-ico" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><rect x="2" y="2" width="6" height="6" rx="1"/><rect x="10" y="2" width="6" height="6" rx="1"/><rect x="2" y="10" width="6" height="6" rx="1"/><rect x="10" y="10" width="6" height="6" rx="1"/></svg>Office</a>
    <a class="ca-tab" href="/" aria-current="page"><svg class="ca-ico" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" aria-hidden="true"><path d="M9 1.5 16.5 5.5 9 9.5 1.5 5.5Z"/><path d="M1.5 9 9 13 16.5 9"/><path d="M1.5 12.5 9 16.5 16.5 12.5"/></svg>Lanes</a>
  </nav>
  <span class="ca-top-fill"></span><span class="ca-fresh" id="fresh" aria-live="polite"></span><span class="ca-counts" id="counts">loading</span>
  <button type="button" class="ca-notify" id="notify" aria-pressed="false" title="Notify me when a lane needs me or finishes"><svg class="ca-ico" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" aria-hidden="true"><path d="M9 2.2a4.3 4.3 0 0 0-4.3 4.3c0 3.1-1.2 4.2-1.2 4.2h11S13.3 9.6 13.3 6.5A4.3 4.3 0 0 0 9 2.2Z"/><path d="M7.4 14.2a1.7 1.7 0 0 0 3.2 0"/></svg><span id="notify-l">Notify off</span></button>
</header>
<div class="ca-stale" id="stale" role="alert" hidden></div>
<div id="shell">
  <details id="rail" open>
    <summary><span class="tri">&#9654;</span>Plans and lanes</summary>
    <div id="railBody"></div>
  </details>
  <main id="view"><div class="pad"><div class="skeleton" aria-hidden="true"><div class="skel-row"></div><div class="skel-row"></div><div class="skel-row"></div></div></div></main>
</div>
<script>
const $ = (id) => document.getElementById(id);
// Narrow shell: the rail disclosure defaults closed under 760 px and open above it.
// The action bar turns into a fixed footer there, so the scroll content pads by its measured height plus 16 px.
const wideMq = matchMedia('(min-width: 760px)');
const syncRail = () => { $('rail').open = wideMq.matches; };
wideMq.addEventListener('change', syncRail);
function syncBarPad() { const bar = $('bar'); document.documentElement.style.setProperty('--bar-h', (bar ? bar.offsetHeight : 0) + 'px'); }
addEventListener('resize', syncBarPad);
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const ago = (t) => { if (!t) return ''; const s = Math.round((Date.now() - new Date(t).getTime()) / 1000); return s < 60 ? `${s}s ago` : s < 3600 ? `${Math.floor(s / 60)}m ago` : s < 86400 ? `${Math.floor(s / 3600)}h ago` : `${Math.floor(s / 86400)}d ago`; };
// A duration in ms as a short label, used for the lead update age: a delta, not a wall clock.
const fmtAge = (ms) => ms < 60000 ? `${Math.max(0, Math.round(ms / 1000))}s` : ms < 3600000 ? `${Math.floor(ms / 60000)}m` : ms < 86400000 ? `${Math.floor(ms / 3600000)}h` : `${Math.floor(ms / 86400000)}d`;
const md = (s) => esc(s).replace(/`([^`]+)`/g, '<code>$1</code>');
const clock = (t) => new Date(t).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
// Delete control: one trash + label button on the plans rail, the plan and lane headers and every
// lane row/card. The click is delegated (see the document listener); confirm and POST live below.
const DEL_ICO = '<svg class="ca-ico" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3.5 5h11M7 5V3.2h4V5M5.2 5l.7 9.3h6.2L12.8 5M7.6 7.6v4.4M10.4 7.6v4.4"/></svg>';
function delBtn(kind, id, label, running) {
  return `<button type="button" class="btn tiny danger del" data-del="${kind}:${esc(id)}"${running ? ' data-running="1"' : ''} aria-label="${esc(label)}" title="${esc(label)}">${DEL_ICO}<span>Delete</span></button>`;
}
const short = (m) => String(m || '').replace(/^huaweicloud-maas\//, 'codearts/');
const leadName = (p) => (p && (p.leadName || (typeof p.lead === 'string' ? p.lead : ''))) || 'Lead';
// Tokens by model: one row per model, sorted by total, lead and worker tagged; unknown is never shown as a zero.
const mtWho = (e) => (e && e.who === 'lead' ? 'lead' : 'worker');
function mtRows(byModel) {
  return Object.entries(byModel || {}).map(([m, e]) => ({ m, e: e || {} })).sort((a, b) => {
    const at = typeof a.e.total === 'number' ? a.e.total : -1, bt = typeof b.e.total === 'number' ? b.e.total : -1;
    return bt - at || a.m.localeCompare(b.m);
  });
}
function mtSplit(e) {
  const cache = (e.cacheRead || 0) + (e.cacheWrite || 0);
  const bits = [`${CAUI.fmtTokens(e.input || 0)} in`, `${CAUI.fmtTokens(e.output || 0)} out`];
  if (cache) bits.push(`${CAUI.fmtTokens(cache)} cache`);
  return bits.join(' / ');
}
