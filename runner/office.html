<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CodeArts Office</title>
<style>
*{box-sizing:border-box}
html,body{margin:0}
body{min-height:100vh;background:linear-gradient(155deg,#2a1650 0%,#4a2a86 55%,#6b46b8 100%);color:#e8eaf2;font:14px/1.45 system-ui,"Segoe UI",sans-serif;display:flex;flex-direction:column;align-items:center;padding:16px;overflow-x:hidden}
.wrap{width:min(1240px,100%);display:flex;flex-direction:column;gap:14px}
.panel{background:#161618;border:1px solid #2b2b33;border-radius:16px;box-shadow:0 24px 70px rgba(0,0,0,.5);overflow:hidden}
.topbar{padding:12px 16px 14px;display:flex;flex-direction:column;gap:10px;border-bottom:1px solid #26262e}
.toprow{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.seg{display:inline-flex;border:1px solid #3a3a46;border-radius:9px;overflow:hidden}
.seg span,.seg a{padding:5px 14px;font-size:13px;color:#a6abbd;text-decoration:none;display:inline-block}
.seg .on{background:#33334a;color:#fff;font-weight:600}
.seg a:hover{background:#23232e;color:#fff}
#planSel{background:#22222b;color:#e8eaf2;border:1px solid #3a3a46;border-radius:8px;padding:5px 8px;font:12.5px system-ui,"Segoe UI",sans-serif;max-width:280px}
.goalbox{background:#222;border:1px solid #333;border-radius:10px;padding:10px 12px}
.goalline{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.pmark{color:#8f7bd8;font-weight:700;flex:0 0 auto}
.goaltext{flex:1 1 240px;min-width:0;font-weight:600;overflow-wrap:anywhere}
.chip{font-size:11.5px;padding:2px 10px;border-radius:999px;background:#2c2c38;border:1px solid #454553;color:#cfd3e0;white-space:nowrap}
.nowline{margin-top:7px;color:#9aa0b4;font-size:12.5px}
.nowline b{color:#c6cad8;font-weight:600}
.stage{position:relative;height:clamp(420px,calc(100vh - 320px),640px);overflow:hidden}
#floor{position:absolute;inset:0;width:100%;height:100%;display:block}
#actors{position:absolute;inset:0;pointer-events:none}
.char{position:absolute;pointer-events:none}
.char svg{width:100%;height:100%;display:block;overflow:visible}
.char.working svg{animation:bob 1.7s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-3px)}}
#floor .link{stroke:#98a0b4;stroke-opacity:.38;stroke-width:1.6;fill:none;stroke-linejoin:round;stroke-linecap:round}
#floor .node{cursor:pointer}
#floor .node .rim{stroke-width:4}
#floor .h-plan .rim{stroke-dasharray:9 7}
#floor .h-run .rim{animation:rimpulse 2.8s ease-in-out infinite}
@keyframes rimpulse{50%{stroke-opacity:.35}}
#floor .node .spot{opacity:0;transition:opacity .25s}
#floor .node.sel .spot{opacity:1}
#floor .node:focus{outline:none}
#floor .node:focus .rim{filter:drop-shadow(0 0 3px rgba(255,255,255,.55))}
.platetxt{fill:#c6cad8;font-size:12px;font-variant:small-caps;letter-spacing:.05em}
.card{position:absolute;width:300px;max-width:calc(100% - 12px);max-height:calc(100% - 12px);overflow:auto;background:#1d1d24;border:1px solid #3d3d49;border-radius:12px;box-shadow:0 18px 50px rgba(0,0,0,.55);padding:12px;z-index:6}
.card.tail-left::before,.card.tail-right::before{content:"";position:absolute;top:22px;width:12px;height:12px;background:#1d1d24;border-left:1px solid #3d3d49;border-bottom:1px solid #3d3d49}
.card.tail-left::before{left:-7px;transform:rotate(45deg)}
.card.tail-right::before{right:-7px;transform:rotate(225deg)}
.chead{display:flex;gap:10px;align-items:center}
.avatar{width:38px;height:38px;flex:0 0 38px;background:#141419;border:1px solid #33333f;border-radius:9px;padding:3px}
.avatar svg{width:100%;height:100%;display:block;overflow:visible}
.ctitle{font-weight:650;font-size:14.5px;overflow-wrap:anywhere}
.csub{color:#98a0b4;font-size:12px;margin-top:1px}
.cdiv{border:0;border-top:1px solid #32323e;margin:10px 0}
.clabel{font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;color:#8a90a4;margin:8px 0 3px}
.cnow{background:#232330;border:1px solid #363644;border-radius:8px;padding:7px 9px;font-size:12.5px;color:#c6cad8;margin:2px 0 4px}
.cnow b{color:#fff}
.steps{list-style:none;margin:0;padding:0}
.steps li{display:flex;gap:9px;align-items:flex-start;padding:4px 0;font-size:12.5px}
.stepic{width:16px;height:16px;flex:0 0 16px;border-radius:50%;margin-top:1px;display:inline-flex;align-items:center;justify-content:center;font-size:10px;border:1.5px solid #4a4a58;color:transparent}
.s-done .stepic{border-color:#4cc27e;color:#4cc27e}
.s-current .stepic{border-color:#33333f;border-top-color:#2dd4a0;animation:spin 1s linear infinite}
.s-pending .stepic{border-color:#4a4a58}
@keyframes spin{to{transform:rotate(360deg)}}
.s-done .txt{color:#7f8698}
.s-current .txt{color:#fff;font-weight:600}
.s-pending .txt,.s-open .txt{color:#a8aeba}
.cempty{color:#8a90a4;font-size:12.5px;padding:4px 0}
.dec{list-style:none;margin:0;padding:0}
.dec li{padding:3px 0;font-size:12px;color:#b6bbc9;border-top:1px solid #2a2a34}
.dec li:first-child{border-top:0}
.cfoot{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:10px;font-size:12.5px;color:#c6cad8}
.ctok{color:#98a0b4}
.badge{font-size:11px;font-weight:600;padding:1px 8px;border-radius:10px;border:1px solid currentColor;white-space:nowrap}
.h-run{color:#2dd4a0}.h-warn{color:#e3b341}.h-bad{color:#f07a7a}.h-done{color:#4cc27e}.h-plan{color:#9aa0b4}.h-lead{color:#b18cf8}
.laneslink{display:inline-block;margin-top:10px;color:#8f9dff;text-decoration:none;font-size:12.5px}
.laneslink:hover{text-decoration:underline}
.steer{display:flex;gap:6px;margin-top:9px;align-items:center}
.steer input{flex:1;min-width:0;background:#141419;border:1px solid #363644;border-radius:7px;color:#e8eaf2;font:12.5px system-ui,"Segoe UI",sans-serif;padding:6px 8px}
.steer input:focus{outline:none;border-color:#5a5af0}
.steer button{background:#33334a;border:1px solid #4a4a5c;border-radius:7px;color:#fff;font:12.5px system-ui,"Segoe UI",sans-serif;padding:6px 10px;cursor:pointer}
.steer button:hover{background:#41415c}
.steer button:disabled{opacity:.5;cursor:default}
#steerMsg{font-size:11px;color:#8a90a4;flex:0 0 auto}
#complete{background:#161618;border:1px solid #2b2b33;border-radius:16px;padding:16px 18px}
#complete h2{display:flex;align-items:center;gap:10px;color:#4cc27e;margin:0 0 6px;font-size:18px}
.okball{width:26px;height:26px;flex:0 0 26px;border-radius:50%;background:#4cc27e;color:#0b2a17;display:inline-flex;align-items:center;justify-content:center;font-weight:800;font-size:15px}
.csum{color:#b6bbc9;margin:0 0 4px;font-size:13.5px}
#complete table{width:100%;border-collapse:collapse;margin-top:12px;font-size:13px}
#complete th,#complete td{padding:7px 10px;text-align:left;border-bottom:1px solid #26262e}
#complete th{color:#8a90a4;font-size:10.5px;text-transform:uppercase;letter-spacing:.07em}
#complete td{color:#d6dae6}
@media (max-width:700px){
  body{padding:10px}
  .wrap{gap:10px}
  .stage{height:clamp(380px,calc(100vh - 280px),560px)}
  #planSel{max-width:170px}
  .goaltext{flex-basis:100%}
  #complete{padding:12px}
  #complete th,#complete td{padding:5px 6px;font-size:12px}
}
</style>
</head>
<body>
<main class="wrap">
  <section class="panel">
    <header class="topbar">
      <div class="toprow">
        <nav class="seg" aria-label="views"><span class="on">Office</span><a href="/">Lanes</a></nav>
        <select id="planSel" hidden aria-label="plan"></select>
      </div>
      <div class="goalbox">
        <div class="goalline"><span class="pmark">&#10095;</span><span class="goaltext" id="goal"></span><span class="chip" id="leadChip" hidden></span><span class="chip" id="statusChip" hidden></span></div>
        <div class="nowline" id="nowline" hidden><b>now:</b> <span id="nowText"></span></div>
      </div>
    </header>
    <div class="stage" id="stage">
      <svg id="floor" preserveAspectRatio="xMidYMid meet"></svg>
      <div id="actors"></div>
      <div id="card" class="card tail-left" hidden></div>
    </div>
  </section>
  <section id="complete" hidden></section>
</main>
<script src="/office-sprites.js"></script>
</body>
</html>
