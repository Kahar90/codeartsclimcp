<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CodeArts Office</title>
<style>
*{box-sizing:border-box}
html,body{margin:0}
body{min-height:100vh;background:linear-gradient(155deg,#2a1650 0%,#4a2a86 55%,#6b46b8 100%);color:#e8eaf2;font:14px/1.45 system-ui,"Segoe UI",sans-serif;display:flex;flex-direction:column;align-items:center;padding:16px;overflow-x:hidden}
.wrap{width:min(1240px,100%);display:flex;flex-direction:column;gap:14px}
.panel{background:#161618;border:1px solid #2b2b33;border-radius:16px;box-shadow:0 24px 70px rgba(0,0,0,.5);overflow:hidden}
.topbar{padding:12px 16px 14px;display:flex;flex-direction:column;gap:10px;border-bottom:1px solid #26262e}
.toprow{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.seg{display:inline-flex;border:1px solid #3a3a46;border-radius:9px;overflow:hidden}
.seg span,.seg a{padding:5px 14px;font-size:13px;color:#a6abbd;text-decoration:none;display:inline-block}
.seg .on{background:#33334a;color:#fff;font-weight:600}
.seg a:hover{background:#23232e;color:#fff}
#planSel{background:#22222b;color:#e8eaf2;border:1px solid #3a3a46;border-radius:8px;padding:5px 8px;font:12.5px system-ui,"Segoe UI",sans-serif;max-width:280px}
.goalbox{background:#222;border:1px solid #333;border-radius:10px;padding:10px 12px}
.goalline{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.pmark{color:#8f7bd8;font-weight:700;flex:0 0 auto}
.goaltext{flex:1 1 240px;min-width:0;font-weight:600;overflow-wrap:anywhere}
.chip{font-size:11.5px;padding:2px 10px;border-radius:999px;background:#2c2c38;border:1px solid #454553;color:#cfd3e0;white-space:nowrap}
.nowline{margin-top:7px;color:#9aa0b4;font-size:12.5px}
.nowline b{color:#c6cad8;font-weight:600}
.stage{position:relative;height:clamp(420px,calc(100vh - 320px),640px);overflow:hidden}
#floor{position:absolute;inset:0;width:100%;height:100%;display:block}
#actors{position:absolute;inset:0;pointer-events:none}
.char{position:absolute;pointer-events:none}
.char svg{width:100%;height:100%;display:block;overflow:visible}
.char.working svg{animation:bob 1.7s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-3px)}}
#floor .link{stroke:#98a0b4;stroke-opacity:.38;stroke-width:1.6;fill:none;stroke-linejoin:round;stroke-linecap:round}
#floor .node{cursor:pointer}
#floor .node .rim{stroke-width:4}
#floor .h-plan .rim{stroke-dasharray:9 7}
#floor .h-run .rim{animation:rimpulse 2.8s ease-in-out infinite}
@keyframes rimpulse{50%{stroke-opacity:.35}}
#floor .node .spot{opacity:0;transition:opacity .25s}
#floor .node.sel .spot{opacity:1}
#floor .node:focus{outline:none}
#floor .node:focus .rim{filter:drop-shadow(0 0 3px rgba(255,255,255,.55))}
.platetxt{fill:#c6cad8;font-size:12px;font-variant:small-caps;letter-spacing:.05em}
.card{position:absolute;width:300px;max-width:calc(100% - 12px);max-height:calc(100% - 12px);overflow:auto;background:#1d1d24;border:1px solid #3d3d49;border-radius:12px;box-shadow:0 18px 50px rgba(0,0,0,.55);padding:12px;z-index:6}
.card.tail-left::before,.card.tail-right::before{content:"";position:absolute;top:22px;width:12px;height:12px;background:#1d1d24;border-left:1px solid #3d3d49;border-bottom:1px solid #3d3d49}
.card.tail-left::before{left:-7px;transform:rotate(45deg)}
.card.tail-right::before{right:-7px;transform:rotate(225deg)}
.chead{display:flex;gap:10px;align-items:center}
.avatar{width:38px;height:38px;flex:0 0 38px;background:#141419;border:1px solid #33333f;border-radius:9px;padding:3px}
.avatar svg{width:100%;height:100%;display:block;overflow:visible}
.ctitle{font-weight:650;font-size:14.5px;overflow-wrap:anywhere}
.csub{color:#98a0b4;font-size:12px;margin-top:1px}
.cdiv{border:0;border-top:1px solid #32323e;margin:10px 0}
.clabel{font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;color:#8a90a4;margin:8px 0 3px}
.cnow{background:#232330;border:1px solid #363644;border-radius:8px;padding:7px 9px;font-size:12.5px;color:#c6cad8;margin:2px 0 4px}
.cnow b{color:#fff}
.steps{list-style:none;margin:0;padding:0}
.steps li{display:flex;gap:9px;align-items:flex-start;padding:4px 0;font-size:12.5px}
.stepic{width:16px;height:16px;flex:0 0 16px;border-radius:50%;margin-top:1px;display:inline-flex;align-items:center;justify-content:center;font-size:10px;border:1.5px solid #4a4a58;color:transparent}
.s-done .stepic{border-color:#4cc27e;color:#4cc27e}
.s-current .stepic{border-color:#33333f;border-top-color:#2dd4a0;animation:spin 1s linear infinite}
.s-pending .stepic{border-color:#4a4a58}
@keyframes spin{to{transform:rotate(360deg)}}
.s-done .txt{color:#7f8698}
.s-current .txt{color:#fff;font-weight:600}
.s-pending .txt,.s-open .txt{color:#a8aeba}
.cempty{color:#8a90a4;font-size:12.5px;padding:4px 0}
.dec{list-style:none;margin:0;padding:0}
.dec li{padding:3px 0;font-size:12px;color:#b6bbc9;border-top:1px solid #2a2a34}
.dec li:first-child{border-top:0}
.cfoot{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:10px;font-size:12.5px;color:#c6cad8}
.ctok{color:#98a0b4}
.badge{font-size:11px;font-weight:600;padding:1px 8px;border-radius:10px;border:1px solid currentColor;white-space:nowrap}
.h-run{color:#2dd4a0}.h-warn{color:#e3b341}.h-bad{color:#f07a7a}.h-done{color:#4cc27e}.h-plan{color:#9aa0b4}.h-lead{color:#b18cf8}
.laneslink{display:inline-block;margin-top:10px;color:#8f9dff;text-decoration:none;font-size:12.5px}
.laneslink:hover{text-decoration:underline}
.steer{display:flex;gap:6px;margin-top:9px;align-items:center}
.steer input{flex:1;min-width:0;background:#141419;border:1px solid #363644;border-radius:7px;color:#e8eaf2;font:12.5px system-ui,"Segoe UI",sans-serif;padding:6px 8px}
.steer input:focus{outline:none;border-color:#5a5af0}
.steer button{background:#33334a;border:1px solid #4a4a5c;border-radius:7px;color:#fff;font:12.5px system-ui,"Segoe UI",sans-serif;padding:6px 10px;cursor:pointer}
.steer button:hover{background:#41415c}
.steer button:disabled{opacity:.5;cursor:default}
#steerMsg{font-size:11px;color:#8a90a4;flex:0 0 auto}
#complete{background:#161618;border:1px solid #2b2b33;border-radius:16px;padding:16px 18px}
#complete h2{display:flex;align-items:center;gap:10px;color:#4cc27e;margin:0 0 6px;font-size:18px}
.okball{width:26px;height:26px;flex:0 0 26px;border-radius:50%;background:#4cc27e;color:#0b2a17;display:inline-flex;align-items:center;justify-content:center;font-weight:800;font-size:15px}
.csum{color:#b6bbc9;margin:0 0 4px;font-size:13.5px}
#complete table{width:100%;border-collapse:collapse;margin-top:12px;font-size:13px}
#complete th,#complete td{padding:7px 10px;text-align:left;border-bottom:1px solid #26262e}
#complete th{color:#8a90a4;font-size:10.5px;text-transform:uppercase;letter-spacing:.07em}
#complete td{color:#d6dae6}
@media (max-width:700px){
  body{padding:10px}
  .wrap{gap:10px}
  .stage{height:clamp(380px,calc(100vh - 280px),560px)}
  #planSel{max-width:170px}
  .goaltext{flex-basis:100%}
  #complete{padding:12px}
  #complete th,#complete td{padding:5px 6px;font-size:12px}
}
</style>
</head>
<body>
<main class="wrap">
  <section class="panel">
    <header class="topbar">
      <div class="toprow">
        <nav class="seg" aria-label="views"><span class="on">Office</span><a href="/">Lanes</a></nav>
        <select id="planSel" hidden aria-label="plan"></select>
      </div>
      <div class="goalbox">
        <div class="goalline"><span class="pmark">&#10095;</span><span class="goaltext" id="goal"></span><span class="chip" id="leadChip" hidden></span><span class="chip" id="statusChip" hidden></span></div>
        <div class="nowline" id="nowline" hidden><b>now:</b> <span id="nowText"></span></div>
      </div>
    </header>
    <div class="stage" id="stage">
      <svg id="floor" preserveAspectRatio="xMidYMid meet"></svg>
      <div id="actors"></div>
      <div id="card" class="card tail-left" hidden></div>
    </div>
  </section>
  <section id="complete" hidden></section>
</main>
<script src="/office-sprites.js"></script>
<script>
"use strict";
(() => {
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const q = new URLSearchParams(location.search);
const demoDone = q.get("demo") === "done";
const mode = q.has("demo") ? "demo" : "live";

const HUES = { lead: 265, builder: 160, reviewer: 42, fixer: 16, idle: 222 };
const healthKey = (h) => {
  const k = String(h || "").split("(")[0].trim();
  if (k === "running" || k === "running tool") return "run";
  if (["quiet", "needs review", "stopped", "killed", "attention", "partial"].includes(k)) return "warn";
  if (["STALLED", "DEAD", "failed"].includes(k)) return "bad";
  if (k === "done") return "done";
  if (k === "planned") return "plan";
  return "run";
};
const healthText = (h) => String(h || "").split("(")[0].trim() || "planned";
const isWorking = (n) => n.kind === "lane" && healthKey(n.health) === "run";
const roleOf = (n) => n.kind === "lead" ? "lead" : (n.health === "planned" || n.phase === "planned") ? "idle" : n.phase === "review" ? "reviewer" : n.phase === "fix" ? "fixer" : "builder";
const tokStr = (t) => { const n = t ? (t.input || 0) + (t.output || 0) + (t.reasoning || 0) : 0; return n >= 1000 ? (n / 1000).toFixed(1).replace(/\.0$/, "") + "K tok" : n + " tok"; };
const commitsOf = (l) => parseInt(String(l.commits || "0").split("/")[0], 10) || 0;
const shortModel = (m) => String(m || "").replace(/^huaweicloud-maas\//, "codearts/");
function fmtDur(ms) {
  const s = Math.max(0, Math.round(ms / 1000));
  if (s < 60) return s + "s";
  const m = Math.floor(s / 60);
  if (m < 60) return m + "m";
  return Math.floor(m / 60) + "h" + String(m % 60).padStart(2, "0") + "m";
}

let plansArr = [], lanesArr = [], planSel = null, plansSig = "";
let model = null, nodes = [], layout = null, linkCount = 0;
let selected = null, cardSig = "", cardInfo = { title: "", steps: [], progress: "" };
let sceneSig = "", fetchErr = "";
const detailCache = new Map();

function demoModel() {
  const t0 = Date.now();
  const done = demoDone;
  const mkSteps = (texts, dn, cur) => texts.map((tx, i) => ({ text: tx, state: done || i < dn ? "done" : cur === i + 1 ? "current" : "pending" }));
  const mk = (id, o) => {
    const started = t0 - (o.dur + 6) * 60000;
    return {
      id, task: id, health: done ? "done" : o.health, phase: o.phase, running: !done && !!o.running,
      result: done ? "done" : (o.result || ""), verdict: done ? "ok" : (o.verdict || ""),
      commits: `${done ? o.texts.length : o.dn}/${o.texts.length}`,
      models: { build: o.model }, tokens: o.tokens,
      progress: { done: done ? o.texts.length : o.dn, total: o.texts.length, current: !done && o.cur ? { n: o.cur, text: o.texts[o.cur - 1] } : null },
      steps: mkSteps(o.texts, o.dn, o.cur), startedAt: started, finishedAt: done ? started + o.dur * 60000 : null,
    };
  };
  const scene = mk("office-scene", { health: "running", running: true, phase: "build", model: "maas/glm-5.3",
    texts: ["Routes in ca.mjs", "Page shell with the goal box", "Data layer with demo mode", "Scene, cards and completion"],
    dn: 2, cur: 3, dur: 46, tokens: { input: 12100, output: 21400, reasoning: 4800 } });
  const sprites = mk("office-sprites", { health: "quiet", running: false, phase: "build", model: "maas/glm-5.3",
    texts: ["Sprite contract check", "Draw the five roles", "Polish the animations"],
    dn: 1, cur: 2, dur: 32, tokens: { input: 3900, output: 7100, reasoning: 1400 } });
  const review = mk("review-pass", { health: "done", running: false, phase: "review", model: "maas/glm-5.3",
    texts: ["Read the diffs", "Run the checks", "Review the sprites", "Write the verdict"],
    dn: 4, cur: 0, dur: 8, tokens: { input: 1700, output: 3200, reasoning: 700 }, result: "done", verdict: "ok" });
  const at = (m) => new Date(t0 - m * 60000).toISOString();
  return {
    plan: {
      id: "demo", title: "Office view for codearts-build", goal: "Build the Office view for codearts-build lanes",
      lead: "Claude Opus 5.5", status: done ? "done" : "running",
      now: done ? "All lanes finished; reviewing the screenshots." : "Waiting for the scene and sprites lanes to finish.",
      next: [{ text: "Merge the sprites worktree into main", done: true }, { text: "Run both checks on main and look at the screenshots", done: false }, { text: "Copy the office files into the live skill runner", done: false }],
      decisions: [
        { at: at(52), text: "Sprites lane works in a separate worktree so both lanes run in parallel." },
        { at: at(41), text: "The scene page polls the runner API directly; the server stays stateless." },
        { at: at(12), text: "Fallback characters keep the page working before the sprites land." },
      ],
    },
    lanes: [scene, sprites, review],
    waves: [{ name: "Wave 1", lanes: [scene, sprites] }, { name: "Wave 2", lanes: [review] }],
  };
}

function liveModel() {
  const plan = (planSel && plansArr.find((p) => p.id === planSel)) || plansArr[0] || null;
  if (plan) return { plan, lanes: plan.waves.flatMap((w) => w.lanes || []), waves: plan.waves };
  const recent = lanesArr.filter((l) => l.startedAt && Date.now() - l.startedAt < 86400e3);
  return {
    plan: { id: "", title: "Recent lanes", goal: "Recent lanes", lead: "Claude", status: "", now: "", next: [], decisions: [] },
    lanes: recent, waves: [{ name: "Recent lanes", lanes: recent }],
  };
}

function buildNodes(m) {
  const p = m.plan;
  const lead = { id: "lead", kind: "lead", task: p.lead || "Lead", health: "lead", phase: "", running: false, lane: null, wave: -1, row: -1,
    steps: { done: (p.next || []).filter((x) => x.done).length, total: (p.next || []).length } };
  const lanes = [];
  (m.waves || []).forEach((w, wi) => (w.lanes || []).forEach((l, li) => lanes.push({
    id: l.id, kind: "lane", task: l.task || l.id, health: l.health || "planned", phase: l.phase || "", running: !!l.running, lane: l, wave: wi, row: li,
    steps: { done: (l.progress && l.progress.done) || 0, total: (l.progress && l.progress.total) || 0 },
  })));
  return [lead, ...lanes];
}

function computeLayout() {
  const w = $("stage").clientWidth || 800;
  const small = w < 700;
  const RX = small ? 92 : 148, RY = small ? 34 : 54;
  const CW = small ? 56 : 88, CH = small ? 80 : 124;
  const PLATE = small ? 30 : 44;
  const colP = RX * 2 + (small ? 56 : 64);
  const rowP = RY * 2 + (small ? 90 : 118);
  const leadX = RX + 34, leadY = CH + RY + 26;
  for (const n of nodes) {
    if (n.kind === "lead") { n.x = leadX; n.y = leadY; }
    else { n.x = leadX + colP * (n.wave + 1); n.y = leadY + rowP * n.row; }
  }
  let x0 = 1e9, x1 = -1e9, y0 = 1e9, y1 = -1e9;
  for (const n of nodes) { x0 = Math.min(x0, n.x - RX); x1 = Math.max(x1, n.x + RX); y0 = Math.min(y0, n.y - CH); y1 = Math.max(y1, n.y + RY + PLATE); }
  const pad = 28;
  return { small, RX, RY, CW, CH, PLATE, trunkX: leadX + RX + 26, vb: { x: x0 - pad, y: y0 - pad, w: x1 - x0 + pad * 2, h: y1 - y0 + pad * 2 } };
}

function nodeSvg(n) {
  const L = layout;
  const hk = n.kind === "lead" ? "lead" : healthKey(n.health);
  const name = n.task.length > 24 ? n.task.slice(0, 23) + "\u2026" : n.task;
  const pw = Math.min(L.RX * 1.9, Math.max(84, name.length * 7.8 + 20));
  const ph = L.small ? 22 : 26;
  return `<g class="node h-${hk}" data-id="${esc(n.id)}" transform="translate(${n.x} ${n.y})" tabindex="0" role="button" aria-label="${esc(n.task)}">
    <ellipse class="spot" rx="${L.RX * 1.5}" ry="${L.RY * 1.9}" fill="url(#spotg)"/>
    <ellipse rx="${L.RX - 2}" ry="${L.RY - 2}" fill="url(#topg)"/>
    <ellipse rx="${Math.round(L.RX * 0.55)}" ry="${Math.round(L.RY * 0.55)}" fill="none" stroke="#ffffff" stroke-opacity=".06"/>
    <ellipse class="rim" rx="${L.RX}" ry="${L.RY}" fill="none" stroke="url(#rim-${hk})"/>
    <g transform="translate(0 ${L.RY + 8})"><g transform="skewX(-16)"><rect x="${-pw / 2}" y="0" width="${pw}" height="${ph}" rx="5" fill="#101015" stroke="#34343f"/><text x="0" y="${ph - 8}" text-anchor="middle" class="platetxt">${esc(name)}</text></g></g>
  </g>`;
}

function renderScene() {
  const L = layout, svg = $("floor");
  svg.setAttribute("viewBox", `${L.vb.x} ${L.vb.y} ${L.vb.w} ${L.vb.h}`);
  const defs = `<defs>
    <linearGradient id="rim-run" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2dd4a0"/><stop offset="1" stop-color="#157a58"/></linearGradient>
    <linearGradient id="rim-warn" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e6b95c"/><stop offset="1" stop-color="#8a6317"/></linearGradient>
    <linearGradient id="rim-bad" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f2706c"/><stop offset="1" stop-color="#8e211b"/></linearGradient>
    <linearGradient id="rim-done" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4cc27e"/><stop offset="1" stop-color="#1d7a45"/></linearGradient>
    <linearGradient id="rim-plan" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#9298a6"/><stop offset="1" stop-color="#4b5160"/></linearGradient>
    <linearGradient id="rim-lead" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#b18cf8"/><stop offset="1" stop-color="#5b3aa8"/></linearGradient>
    <radialGradient id="topg"><stop offset="0" stop-color="#1d1d25"/><stop offset="1" stop-color="#0a0a0e"/></radialGradient>
    <radialGradient id="spotg"><stop offset="0" stop-color="#5fa8ff" stop-opacity=".4"/><stop offset="1" stop-color="#5fa8ff" stop-opacity="0"/></radialGradient>
    <radialGradient id="floorglow" cx=".5" cy=".42" r=".75"><stop offset="0" stop-color="#7c5cbf" stop-opacity=".12"/><stop offset="1" stop-color="#7c5cbf" stop-opacity="0"/></radialGradient>
    <pattern id="isogrid" width="76" height="38" patternUnits="userSpaceOnUse"><path d="M0 19 L38 0 L76 19 L38 38 Z" fill="none" stroke="#ffffff" stroke-opacity=".05" stroke-width="1"/></pattern>
  </defs>`;
  const fr = `<rect x="${L.vb.x}" y="${L.vb.y}" width="${L.vb.w}" height="${L.vb.h}" fill="#0d0d12"/>` +
    `<rect x="${L.vb.x}" y="${L.vb.y}" width="${L.vb.w}" height="${L.vb.h}" fill="url(#floorglow)"/>` +
    `<rect x="${L.vb.x}" y="${L.vb.y}" width="${L.vb.w}" height="${L.vb.h}" fill="url(#isogrid)"/>`;
  const lead = nodes[0];
  linkCount = 0;
  let links = "";
  for (const n of nodes) {
    if (n.kind !== "lane") continue;
    linkCount++;
    const d = `M ${lead.x + L.RX - 8} ${lead.y} L ${L.trunkX} ${lead.y} L ${L.trunkX} ${n.y} L ${n.x - L.RX + 8} ${n.y}`;
    links += `<path class="link" d="${d}"/>`;
    if (isWorking(n)) links += `<g><circle r="${L.small ? 5 : 8}" fill="#2dd4a0" opacity=".18"/><circle r="${L.small ? 2.2 : 3.4}" fill="#8df3d2"/><animateMotion dur="${(2.6 + n.row * 0.45 + n.wave * 0.3).toFixed(2)}s" repeatCount="indefinite" path="${d}"/></g>`;
  }
  svg.innerHTML = defs + fr + links + nodes.map(nodeSvg).join("");
  renderActors();
}

function fallbackSprite(hue) {
  return `<svg viewBox="0 0 60 84" xmlns="http://www.w3.org/2000/svg"><ellipse cx="30" cy="79" rx="15" ry="4" fill="rgba(0,0,0,.45)"/><circle cx="30" cy="17" r="11" fill="hsl(${hue},42%,74%)"/><rect x="15" y="28" width="30" height="46" rx="13" fill="hsl(${hue},48%,58%)"/></svg>`;
}
function spriteSvg(role, st, hue) {
  try { if (window.OfficeSprites && window.OfficeSprites.draw) return window.OfficeSprites.draw(role, { state: st, hue }); } catch (e) {}
  return fallbackSprite(hue);
}

function renderActors() {
  const L = layout;
  $("actors").innerHTML = nodes.map((n) => {
    const role = roleOf(n), st = isWorking(n) ? "working" : "idle";
    return `<div class="char${st === "working" ? " working" : ""}" data-id="${esc(n.id)}" style="width:${L.CW}px;height:${L.CH}px">${spriteSvg(role, st, HUES[role])}</div>`;
  }).join("");
  positionActors();
}

function sceneToClient(x, y) {
  const svg = $("floor");
  try {
    const pt = svg.createSVGPoint(); pt.x = x; pt.y = y;
    const m = pt.matrixTransform(svg.getScreenCTM());
    return { x: m.x, y: m.y };
  } catch (e) { return { x: 0, y: 0 }; }
}

function positionActors() {
  if (!layout) return;
  const L = layout, r = $("stage").getBoundingClientRect();
  for (const el of $("actors").children) {
    const n = nodes.find((x) => x.id === el.dataset.id);
    if (!n) continue;
    const p = sceneToClient(n.x, n.y);
    el.style.left = Math.round(p.x - r.left - L.CW / 2) + "px";
    el.style.top = Math.round(p.y - r.top - L.CH + (L.small ? 2 : 6)) + "px";
  }
}

function syncSel() {
  for (const g of $("floor").querySelectorAll("g.node")) g.classList.toggle("sel", g.dataset.id === selected);
}

function stepList(steps, numbered) {
  if (!steps.length) return `<div class="cempty">No steps yet</div>`;
  return `<ol class="steps">${steps.map((s, i) => `<li class="s-${esc(s.state)}"><span class="stepic">${s.state === "done" ? "\u2713" : ""}</span><span class="txt">${numbered ? i + 1 + ". " : ""}${esc(s.text)}</span></li>`).join("")}</ol>`;
}

function cardHead(role, st, title, sub) {
  return `<div class="chead"><div class="avatar">${spriteSvg(role, st, HUES[role])}</div><div><div class="ctitle">${esc(title)}</div><div class="csub">${esc(sub)}</div></div></div><hr class="cdiv">`;
}

async function laneSteps(n) {
  if (mode === "demo") return (n.lane && n.lane.steps) || [];
  if (!n.lane || !n.lane.models) return null;
  const c = detailCache.get(n.id);
  if (c && Date.now() - c.t < 2000) return c.steps;
  try {
    const d = await (await fetch(`/api/lane/${encodeURIComponent(n.id)}/detail`)).json();
    if (!d || d.error || !Array.isArray(d.steps)) throw new Error("bad detail");
    const steps = d.steps.map((s) => ({ text: s.text, state: s.state }));
    detailCache.set(n.id, { t: Date.now(), steps });
    return steps;
  } catch (e) { return c ? c.steps : null; }
}

function positionCard() {
  const card = $("card");
  const n = nodes.find((x) => x.id === selected);
  if (!n || !layout) { card.hidden = true; return; }
  card.hidden = false;
  const L = layout, r = $("stage").getBoundingClientRect();
  const p = sceneToClient(n.x, n.y);
  const scale = Math.min(r.width / L.vb.w, r.height / L.vb.h);
  const cw = card.offsetWidth, chh = card.offsetHeight;
  let left = p.x - r.left + L.RX * scale + 16;
  let tail = "tail-left";
  if (left + cw > r.width - 6) { left = p.x - r.left - L.RX * scale - 16 - cw; tail = "tail-right"; }
  left = Math.max(6, Math.min(left, Math.max(6, r.width - cw - 6)));
  let top = p.y - r.top - 34;
  top = Math.max(6, Math.min(top, Math.max(6, r.height - chh - 6)));
  card.style.left = Math.round(left) + "px";
  card.style.top = Math.round(top) + "px";
  card.className = "card " + tail;
}

async function renderCard(force) {
  const id = selected;
  if (!id) return;
  const n = nodes.find((x) => x.id === id);
  if (!n) return;
  let html = "", info = { title: "", steps: [], progress: "" };
  if (n.kind === "lead") {
    const p = model.plan;
    const steps = (p.next || []).map((x) => ({ text: x.text, state: x.done ? "done" : "pending" }));
    const dn = steps.filter((s) => s.state === "done").length;
    info = { title: p.title || "Plan", steps, progress: `${dn} / ${steps.length}` };
    const dec = (p.decisions || []).slice(-3).reverse();
    html = cardHead("lead", "idle", p.title || "Plan", `team leader \u00b7 ${p.lead || ""}`) +
      (p.now ? `<div class="cnow"><b>now:</b> ${esc(p.now)}</div>` : "") +
      `<div class="clabel">Planned next</div>` + stepList(steps, false) +
      (dec.length ? `<div class="clabel">Recent decisions</div><ul class="dec">${dec.map((d) => `<li>${esc(d.text)}</li>`).join("")}</ul>` : "") +
      `<div class="cfoot"><span>Progress: ${dn} / ${steps.length}</span><a class="laneslink" href="/">Open in Lanes</a></div>`;
  } else {
    const l = n.lane || {};
    const steps = (await laneSteps(n)) || [];
    if (selected !== id) return;
    const total = (l.progress && l.progress.total) || steps.length;
    const dn = steps.length ? steps.filter((s) => s.state === "done").length : ((l.progress && l.progress.done) || 0);
    info = { title: n.task, steps, progress: `${dn} / ${total}` };
    const sub = `team mate \u00b7 ${shortModel((l.models && l.models.build) || (l.plan && l.plan.model) || "unknown model")}`;
    html = cardHead(roleOf(n), isWorking(n) ? "working" : "idle", n.task, sub) +
      stepList(steps, true) +
      `<div class="cfoot"><span>Progress: ${dn} / ${total}</span><span class="ctok">${tokStr(l.tokens)}</span><span class="badge h-${healthKey(n.health)}">${esc(healthText(n.health))}</span></div>` +
      `<a class="laneslink" href="${mode === "demo" ? "/" : "/#/lane/" + encodeURIComponent(id)}">Open in Lanes</a>` +
      (mode === "live" && l.running ? `<div class="steer"><input id="steerText" placeholder="Steer this lane..." maxlength="500"><button id="steerBtn">Send</button><span id="steerMsg"></span></div>` : "");
  }
  const sig = JSON.stringify([id, html]);
  if (!force && sig === cardSig) { positionCard(); return; }
  cardSig = sig;
  cardInfo = info;
  const sv = $("steerText") ? $("steerText").value : "";
  const sf = document.activeElement === $("steerText");
  $("card").innerHTML = html;
  positionCard();
  const btn = $("steerBtn");
  if (btn) {
    $("steerText").addEventListener("keydown", (e) => { if (e.key === "Enter") btn.click(); });
    if (sv) { $("steerText").value = sv; if (sf) $("steerText").focus(); }
    btn.onclick = async () => {
      const text = $("steerText").value.trim();
      if (!text) return;
      btn.disabled = true;
      try {
        const r = await fetch(`/api/lane/${encodeURIComponent(id)}/steer`, { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ text }) });
        const j = await r.json();
        $("steerMsg").textContent = j && j.ok ? "queued" : ((j && j.error) || "failed");
        if (j && j.ok) $("steerText").value = "";
      } catch (e) { $("steerMsg").textContent = "failed"; }
      btn.disabled = false;
    };
  }
}

function openCard(id) {
  if (!nodes.some((n) => n.id === id)) return;
  selected = id;
  syncSel();
  renderCard(true);
}

function closeCard() {
  selected = null;
  cardSig = "";
  cardInfo = { title: "", steps: [], progress: "" };
  $("card").hidden = true;
  syncSel();
}

function renderTop() {
  const p = model.plan;
  $("goal").textContent = p.goal || p.title || "(no goal)";
  $("leadChip").textContent = p.lead || "";
  $("leadChip").hidden = !p.lead;
  $("statusChip").textContent = p.status || "";
  $("statusChip").hidden = !p.status;
  $("nowText").textContent = fetchErr ? fetchErr + " (retrying every 2 s)" : (p.now || "");
  $("nowline").hidden = !$("nowText").textContent;
  const sel = $("planSel");
  const sig = JSON.stringify(plansArr.map((x) => x.id));
  if (mode === "live" && plansArr.length > 1) {
    sel.hidden = false;
    if (sig !== plansSig) { plansSig = sig; sel.innerHTML = plansArr.map((x) => `<option value="${esc(x.id)}">${esc(x.title)}</option>`).join(""); }
    sel.value = (planSel && plansArr.some((x) => x.id === planSel)) ? planSel : plansArr[0].id;
  } else { sel.hidden = true; plansSig = ""; }
}

function isComplete() {
  const ls = model ? model.lanes : [];
  return ls.length > 0 && ls.every((l) => l.result === "done" || l.result === "needs review");
}

function renderComplete() {
  const sec = $("complete");
  if (!isComplete()) { sec.hidden = true; return; }
  const ls = model.lanes;
  const commits = ls.reduce((a, l) => a + commitsOf(l), 0);
  const ms = ls.reduce((a, l) => a + (l.startedAt ? ((l.finishedAt || Date.now()) - l.startedAt) : 0), 0);
  sec.innerHTML = `<h2><span class="okball">\u2713</span>All tasks complete</h2>
    <p class="csum">${ls.length} lane${ls.length === 1 ? "" : "s"} delivered ${commits} commit${commits === 1 ? "" : "s"} in ${fmtDur(ms)} of lane time.</p>
    <table><thead><tr><th>Lane</th><th>Steps</th><th>Commits</th><th>Tokens</th><th>Verdict</th></tr></thead><tbody>
    ${ls.map((l) => `<tr><td>${esc(l.task || l.id)}</td><td>${(l.progress && l.progress.done) || 0} / ${(l.progress && l.progress.total) || 0}</td><td>${commitsOf(l)}</td><td>${tokStr(l.tokens)}</td><td>${esc(l.verdict || "")}</td></tr>`).join("")}
    </tbody></table>`;
  sec.hidden = false;
}

function render() {
  model = mode === "demo" ? demoModel() : liveModel();
  nodes = buildNodes(model);
  renderTop();
  layout = computeLayout();
  const sig = JSON.stringify([layout.small, Math.round(layout.vb.w), Math.round(layout.vb.h), nodes.map((n) => [n.id, n.health, n.phase, n.running, roleOf(n), isWorking(n)])]);
  if (sig !== sceneSig) { sceneSig = sig; renderScene(); syncSel(); }
  else positionActors();
  if (selected) {
    if (!nodes.some((n) => n.id === selected)) closeCard();
    else renderCard(false);
  }
  renderComplete();
}

async function tick() {
  if (mode === "demo") return;
  try {
    const [pr, lr] = await Promise.all([fetch("/api/plans"), fetch("/api/lanes")]);
    plansArr = await pr.json();
    lanesArr = await lr.json();
    if (!planSel) planSel = (plansArr[0] && plansArr[0].id) || null;
    fetchErr = "";
  } catch (e) { fetchErr = "dashboard server not reachable"; }
  render();
}

$("planSel").addEventListener("change", () => { planSel = $("planSel").value; render(); });
$("floor").addEventListener("click", (e) => {
  const g = e.target && e.target.closest ? e.target.closest("g.node") : null;
  if (g) openCard(g.dataset.id); else closeCard();
});
$("floor").addEventListener("keydown", (e) => {
  if (e.key !== "Enter" && e.key !== " ") return;
  const g = e.target && e.target.closest ? e.target.closest("g.node") : null;
  if (g) { e.preventDefault(); openCard(g.dataset.id); }
});
document.addEventListener("keydown", (e) => { if (e.key === "Escape") closeCard(); });
new ResizeObserver(() => {
  if (!layout) return;
  const small = ($("stage").clientWidth || 800) < 700;
  if (small !== layout.small) render(); else positionActors();
}).observe($("stage"));
render();
if (mode !== "demo") { tick(); setInterval(tick, 2000); }
})();
</script>
</body>
</html>
