<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CodeArts Office</title>
<link rel="stylesheet" href="/assets/workshop.css">
<style>
html, body { height: 100%; }
* { box-sizing: border-box; }
body { margin: 0; display: flex; flex-direction: column; overflow: hidden; }
.runstrip { flex: none; height: 24px; padding: 0 20px; display: flex; align-items: center; gap: 12px; font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; background: var(--bg); border-bottom: 1px solid var(--border); }
body.narrow .runstrip { height: auto; min-height: 25px; flex-wrap: wrap; align-content: center; white-space: normal; overflow: visible; padding: 5px 12px; row-gap: 3px; }
body.narrow .runstrip .ptitle { flex: 1 1 100%; white-space: normal; overflow: visible; text-overflow: clip; }
body.narrow .runstrip .pnow { flex: 1 1 100%; white-space: normal; overflow: visible; text-overflow: clip; }
.runstrip .ptitle { font-weight: 700; color: var(--fg); font-size: 12.5px; overflow: hidden; text-overflow: ellipsis; }
.runstrip .pnow { overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.runstrip .topfill { flex: 1; }
.chip { font-size: 11px; padding: 1px 8px; border-radius: 999px; background: var(--panel-2); border: 1px solid var(--border-2); color: var(--muted); white-space: nowrap; }
#planSel { height: 20px; background: var(--panel); color: var(--fg); border: 1px solid var(--border-2); border-radius: 6px; font: 11px var(--font); max-width: 200px; }
#motionBtn { flex: none; height: 20px; padding: 0 9px; border-radius: 6px; border: 1px solid var(--border-2); background: var(--panel); color: var(--muted); font: 600 11px var(--font); cursor: pointer; }
#motionBtn[aria-pressed="true"] { color: var(--fg); border-color: var(--sel); }
#motionBtn:focus-visible { outline: 2px solid var(--sel); outline-offset: 1px; }
#stagewrap { flex: 1; min-height: 420px; background: var(--stage); display: flex; align-items: center; justify-content: center; }
#stage { position: relative; overflow: hidden; background: var(--stage); }
#room { position: absolute; left: 0; top: 0; image-rendering: pixelated; pointer-events: none; }
#links { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
#links path { fill: none; stroke: var(--sel); stroke-opacity: 0.75; }
#sprites { position: absolute; inset: 0; pointer-events: none; }
#sprites .px-sprite { position: absolute; }
#plates { position: absolute; inset: 0; pointer-events: none; }
.plate { position: absolute; transform: translate(-50%, -50%); pointer-events: auto; display: flex; flex-direction: column; align-items: center; gap: 1px; padding: 4px 10px; background: var(--panel-2); border: 2px solid var(--border-2); border-radius: 8px; font: 11px/1.3 var(--font); color: var(--fg); cursor: pointer; text-align: center; white-space: nowrap; }
.plate .p-name { font-weight: 700; }
.plate .p-sub { color: var(--muted); font-size: 10px; }
#plate-lead { border-color: var(--lead); }
#plate-builder { border-color: var(--builder); }
#plate-artist { border-color: var(--artist); }
#plate-reviewer { border-color: var(--reviewer); }
#overflow { position: absolute; right: 10px; bottom: 10px; z-index: 6; display: flex; flex-direction: column; gap: 4px; max-width: 250px; padding: 8px; background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius-sm); }
#overflow[hidden] { display: none; }
.ov-title { padding: 0 2px 3px; color: var(--muted); font-size: 11px; font-weight: 600; }
.ov-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 4px 8px; background: var(--panel-2); border: 1px solid var(--border-2); border-radius: 6px; font: 11px/1.3 var(--font); color: var(--fg); cursor: pointer; text-align: left; white-space: nowrap; }
.ov-row .ov-st { color: var(--muted); font-size: 10px; }
.hit { position: absolute; pointer-events: auto; cursor: pointer; }
#win { position: absolute; left: 0; top: 0; width: 320px; z-index: 10; background: var(--panel); border: 1px solid var(--border-2); border-radius: var(--radius); box-shadow: 0 8px 24px rgba(0, 0, 0, 0.45); }
#win[hidden] { display: none; }
#winTail { position: absolute; width: 10px; height: 10px; background: var(--panel); transform: rotate(45deg); }
#winTail.t-left { border-left: 1px solid var(--border-2); border-bottom: 1px solid var(--border-2); }
#winTail.t-right { border-top: 1px solid var(--border-2); border-right: 1px solid var(--border-2); }
#winTail.t-up { border-left: 1px solid var(--border-2); border-top: 1px solid var(--border-2); }
#winTail.t-down { border-bottom: 1px solid var(--border-2); border-right: 1px solid var(--border-2); }
body.narrow #winTail { display: none; }
#win [hidden] { display: none !important; }
.win-head { display: flex; align-items: center; gap: 8px; padding: 10px 12px 8px; }
#winTitle { font-weight: 700; font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
#winBadge { flex: none; }
#winX { margin-left: auto; flex: none; width: 22px; height: 22px; border-radius: 6px; border: 1px solid var(--border-2); background: var(--panel-2); color: var(--muted); font: 600 12px var(--font); cursor: pointer; padding: 0; }
#winBody { padding: 0 12px 10px; display: flex; flex-direction: column; gap: 8px; font-size: 12px; }
#winMeta { color: var(--muted); }
#winCont { color: var(--muted); font-size: 11px; }
#winGoal { color: var(--fg); }
#winNow { color: var(--muted); }
#winSteps { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 3px; }
#winSteps li { display: flex; gap: 7px; align-items: baseline; min-width: 0; }
#winSteps .st-text { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
#winSteps .mark { flex: none; width: 12px; text-align: center; font-size: 10px; }
#winSteps .st-done { color: var(--muted); }
#winSteps .st-done .mark { color: var(--run); }
#winSteps .st-current { font-weight: 700; }
#winSteps .st-current .mark { color: var(--sel); }
#winSteps .st-pending .mark { color: var(--faint); }
#winLink { font-size: 12px; }
#winForm { display: flex; gap: 6px; padding: 0 12px 12px; }
#winInput { flex: 1; min-width: 0; height: 26px; padding: 0 8px; border-radius: 6px; border: 1px solid var(--border-2); background: var(--code-bg); color: var(--fg); font: 12px var(--font); }
#winSend { flex: none; height: 26px; padding: 0 12px; border-radius: 6px; border: 1px solid var(--border-2); background: var(--panel-2); color: var(--fg); font: 600 12px var(--font); cursor: pointer; }
#winSend:disabled, #winInput:disabled { opacity: 0.55; cursor: default; }
#winErr { padding: 0 12px 10px; color: var(--bad); font-size: 11px; }
@keyframes win-in { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
@keyframes win-out { from { opacity: 1; } to { opacity: 0; transform: translateY(-4px); } }
#win.win-in { animation: win-in 140ms ease-out; }
#win.win-out { animation: win-out 100ms ease-in forwards; }
#fx { position: absolute; inset: 0; pointer-events: none; }
.packet { position: absolute; width: 8px; height: 8px; margin: -4px 0 0 -4px; border-radius: 50%; background: var(--sel-ink); box-shadow: 0 0 8px var(--sel); }
.checkmark { position: absolute; width: 16px; height: 16px; }
.checkmark path { stroke: var(--run); }
#lamp { position: absolute; transform: translate(-50%, -50%); border-radius: 50%; background: radial-gradient(ellipse at center, rgba(255, 220, 150, 0.2), rgba(255, 220, 150, 0.07) 45%, transparent 70%); animation: lamp 4s ease-in-out infinite; }
@keyframes lamp { 0%, 100% { opacity: 0.55; } 50% { opacity: 1; } }
body.no-motion #lamp { display: none; }
#stlist { display: flex; flex-direction: column; gap: 6px; padding: 12px 14px 20px; background: var(--bg); }
#stlist[hidden] { display: none; }
.st-row { display: flex; align-items: center; gap: 10px; width: 100%; padding: 8px 10px; background: var(--panel); border: 1px solid var(--border); border-left: 3px solid var(--border-2); border-radius: 8px; font: 12px/1.3 var(--font); color: var(--fg); cursor: pointer; text-align: left; }
.st-row .st-name { font-weight: 700; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.st-row .st-sub { color: var(--muted); font-size: 11px; white-space: nowrap; }
.st-row.st-lead { border-left-color: var(--lead); }
.st-row.st-builder { border-left-color: var(--builder); }
.st-row.st-artist { border-left-color: var(--artist); }
.st-row.st-reviewer { border-left-color: var(--reviewer); }
body.narrow .plate { display: none !important; }
body.narrow #links { display: none; }
body.narrow #overflow { display: none; }
body.narrow #win:not([hidden]) { display: flex; flex-direction: column; width: calc(100% - 24px); max-height: min(55vh, calc(100% - 24px)); }
body.narrow .win-head, body.narrow #winForm, body.narrow #winErr { flex: none; }
body.narrow #winBody { flex: 1 1 auto; overflow-y: auto; min-height: 0; }
body.narrow { height: auto; min-height: 100%; overflow-y: auto; scrollbar-width: none; }
body.narrow::-webkit-scrollbar { display: none; }
html.narrow { scrollbar-width: none; }
html.narrow::-webkit-scrollbar { display: none; }
body.narrow #stagewrap { flex: none; min-height: 0; }
</style>
</head>
<body>
<header class="ca-top">
  <a class="ca-brand" href="/">CodeArts</a><span class="ca-sep"></span>
  <nav class="ca-tabs" aria-label="Views">
    <a class="ca-tab" href="/office" aria-current="page"><svg class="ca-ico" viewBox="0 0 18 18" aria-hidden="true"><path d="M2 2h5v5H2zM11 2h5v5h-5zM2 11h5v5H2zM11 11h5v5h-5z" fill="none" stroke="currentColor" stroke-width="1.6"/></svg>Office</a>
    <a class="ca-tab" href="/"><svg class="ca-ico" viewBox="0 0 18 18" aria-hidden="true"><path d="M9 2 16 6 9 10 2 6ZM2 10.5l7 4 7-4" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>Lanes</a>
  </nav>
  <span class="ca-top-fill"></span><span class="ca-counts" id="counts"></span>
</header>
<div class="runstrip" id="runstrip">
  <span class="ptitle" id="planTitle"></span>
  <span class="pnow" id="nowLine" hidden></span>
  <span class="chip" id="leadChip" hidden></span>
  <span id="statusBadge"></span>
  <span class="topfill"></span>
  <select id="planSel" hidden aria-label="plan"></select>
  <button id="motionBtn" type="button" aria-pressed="true">Motion</button>
</div>
<main id="stagewrap">
  <div id="stage">
    <img id="room" src="/assets/workshop.png" alt="" aria-hidden="true">
    <svg id="links" aria-hidden="true"></svg>
    <div id="sprites"></div>
    <div id="fx" aria-hidden="true"><div id="lamp"></div></div>
    <div id="plates">
      <button type="button" class="plate" id="plate-lead" style="display: none" aria-expanded="false" aria-controls="win"><b class="p-name"></b><span class="p-sub"></span></button>
      <button type="button" class="plate" id="plate-builder" style="display: none" aria-expanded="false" aria-controls="win"><b class="p-name"></b><span class="p-sub"></span></button>
      <button type="button" class="plate" id="plate-artist" style="display: none" aria-expanded="false" aria-controls="win"><b class="p-name"></b><span class="p-sub"></span></button>
      <button type="button" class="plate" id="plate-reviewer" style="display: none" aria-expanded="false" aria-controls="win"><b class="p-name"></b><span class="p-sub"></span></button>
    </div>
    <div id="overflow" hidden>
      <div class="ov-title" id="ovTitle"></div>
    </div>
    <div id="win" role="dialog" aria-labelledby="winTitle" hidden>
      <div class="win-head">
        <b id="winTitle"></b>
        <span id="winBadge"></span>
        <button id="winX" type="button" aria-label="Close">&#x2715;</button>
      </div>
      <div id="winBody">
        <div id="winMeta"></div>
        <div id="winCont" hidden></div>
        <div id="winGoal" hidden></div>
        <div id="winNow" hidden></div>
        <ul id="winSteps"></ul>
        <a id="winLink" hidden>Open in Lanes</a>
      </div>
      <div id="winTail" aria-hidden="true"></div>
      <form id="winForm" hidden>
        <input id="winInput" placeholder="Steer this lane" aria-label="Steer this lane">
        <button id="winSend" type="submit">Send</button>
      </form>
      <div id="winErr" hidden></div>
    </div>
  </div>
</main>
<div id="stlist" hidden></div>
<script src="/assets/workshop.js"></script>
<script>
"use strict";
(() => {
const $ = (id) => document.getElementById(id);
const q = new URLSearchParams(location.search);
const demoBig = q.get("demo") === "big";
const demoDone = q.get("demo") === "done" || (demoBig && q.get("done") === "1");
const mode = q.has("demo") ? "demo" : "live";
let STAGE_W = 1280, STAGE_H = 720;
let SCENE = {
  stage: [1280, 720],
  stations: { lead: { foot: [292, 356] }, builder: { foot: [626, 354] }, artist: { foot: [759, 601] }, reviewer: { foot: [1036, 350] } },
  fixture: {
    events: [
      { atMs: 1300, type: "assignment", from: "lead", to: "builder" },
      { atMs: 2000, type: "status", lane: "builder", status: "Running" },
      { atMs: 3300, type: "press", lane: "builder" },
      { atMs: 5250, type: "stepComplete", lane: "builder", step: "Data layer", progress: [3, 4] },
      { atMs: 7200, type: "handoff", from: "lead", to: "artist" },
      { atMs: 7900, type: "status", lane: "artist", status: "Running" },
      { atMs: 9500, type: "press", lane: "artist" },
      { atMs: 11500, type: "status", lane: "artist", status: "Done" },
      { atMs: 13400, type: "escape" },
    ],
  },
};
async function loadScene() {
  try {
    const r = await fetch("/assets/scene.json");
    if (!r.ok) return;
    const j = await r.json();
    if (j && Array.isArray(j.stageSize) && j.stageSize.length === 2 && j.stations && ["lead", "builder", "artist", "reviewer"].every((s) => j.stations[s] && Array.isArray(j.stations[s].foot))) {
      SCENE = { stage: j.stageSize, stations: j.stations, fixture: j.fixture || { events: [] } };
    }
  } catch (e) {}
}

let plansArr = [], lanesArr = [], planSel = null, plansSig = "";
let model = null, fetchErr = "";
const detailCache = new Map();

const DEMO_T0 = Date.now();
const DEMO_BASE = {
  "office-scene": { phase: "build", model: "maas/glm-5.3", dur: 46, tokens: { input: 12100, output: 21400, reasoning: 4800 },
    texts: ["Routes in ca.mjs", "Page shell with the goal box", "Data layer with demo mode", "Scene, cards and completion"],
    init: { dn: 2, cur: 3, health: "waiting", running: false, result: "", verdict: "" } },
  "office-sprites": { phase: "build", model: "maas/glm-5.3", dur: 32, tokens: { input: 3900, output: 7100, reasoning: 1400 },
    texts: ["Sprite contract check", "Draw the five roles", "Polish the animations"],
    runs: 2, continues: [{ id: "office-v2", task: "office-v2", reason: "paused for the atlas redraw", commits: "6/8", progress: { done: 6, total: 8 }, elapsed: "1h10m" }],
    init: { dn: 0, cur: 1, health: "waiting", running: false, result: "", verdict: "" } },
  "office-review": { phase: "review", model: "maas/glm-5.3", dur: 8, tokens: { input: 1700, output: 3200, reasoning: 700 },
    texts: ["Read the diffs", "Run the checks", "Review the sprites", "Write the verdict"],
    init: { dn: 1, cur: 2, health: "running", running: true, result: "", verdict: "" } },
};
const DEMO_BIG_BASE = {
  "office-scene": { phase: "build", model: "maas/glm-5.3", dur: 46, tokens: { input: 12100, output: 21400, reasoning: 4800 },
    texts: ["Routes in ca.mjs", "Page shell with the goal box", "Data layer with demo mode", "Scene, cards and completion", "Links and packet animation", "Resize re-bakes geometry", "Keyboard focus and Escape", "Screenshots for the checks"],
    init: { dn: 3, cur: 4, health: "running", running: true, result: "", verdict: "" } },
  "office-sprites": { phase: "review", model: "maas/glm-5.3", dur: 32, tokens: { input: 3900, output: 7100, reasoning: 1400 },
    texts: ["Sprite contract check", "Draw the five roles", "Isometric desks and chairs", "Floating panels and badges", "Working and idle poses", "Hue variants per role", "Reduced motion fallbacks", "Polish the animations"],
    init: { dn: 8, cur: 0, health: "running", running: true, result: "", verdict: "" } },
  "cli-dx": { phase: "build", model: "maas/qwen3-coder", dur: 41, tokens: { input: 8600, output: 12300, reasoning: 2600 },
    texts: ["Split ca.mjs commands", "Harness-neutral arg parsing", "Help text for every command", "Exit codes and stderr", "Shell completion stubs", "Version and doctor output", "Man page snippet", "CLI contract check"],
    init: { dn: 8, cur: 0, health: "done", running: false, result: "done", verdict: "ready" } },
  "mcp": { phase: "build", model: "maas/glm-5.3", dur: 37, tokens: { input: 6400, output: 9800, reasoning: 1900 },
    texts: ["MCP server skeleton", "Tool schemas", "stdio transport", "Auth from the user env", "List and read tools", "Error shapes", "Logging without secrets", "MCP check green"],
    init: { dn: 8, cur: 0, health: "done", running: false, result: "done", verdict: "ready" } },
  "setup": { phase: "fix", model: "maas/qwen3-max", dur: 29, tokens: { input: 5200, output: 8100, reasoning: 1200 },
    texts: ["Detect installed harnesses", "Per-harness setup notes", "Doctor rows", "Copyable onboard command", "First-lane quick start", "Trust the worktree folder", "Windows path quirks", "Re-run the setup check"],
    init: { dn: 7, cur: 8, health: "running", running: true, result: "", verdict: "" } },
  "office-motion": { phase: "build", model: "maas/glm-5.3", dur: 34, tokens: { input: 7300, output: 10600, reasoning: 2200 },
    texts: ["Motion brief", "Intro tilt", "Hover lift", "Working bob", "Packet trails", "Done burst", "Reduced motion fades", "Motion check green"],
    init: { dn: 8, cur: 0, health: "needs review", running: false, result: "needs review", verdict: "needs fixes" } },
  "office-review": { phase: "review", model: "maas/glm-5.3", dur: 14, tokens: { input: 2600, output: 4100, reasoning: 900 },
    texts: ["Read the diffs", "Run the checks", "Review the sprites", "Write the verdict"],
    init: { dn: 4, cur: 0, health: "needs review", running: false, result: "needs review", verdict: "needs fixes" } },
  "onboard": { phase: "build", model: "maas/glm-5.3", dur: 25, tokens: { input: 4300, output: 6900, reasoning: 1100 },
    texts: ["Welcome panel copy", "Doctor rows per harness", "Onboard command snippet", "First-lane list", "Links to the docs", "Dismiss and remember", "Onboard check", "Screenshots for the README"],
    init: { dn: 0, cur: 0, health: "planned", running: false, result: "", verdict: "" } },
};
const DEMO_SET = demoBig ? DEMO_BIG_BASE : DEMO_BASE;
const demoState = {};
for (const [id, b] of Object.entries(DEMO_SET)) {
  demoState[id] = demoDone
    ? { dn: b.texts.length, cur: 0, health: "done", running: false, result: "done", verdict: demoBig ? "ready" : "ok" }
    : { ...b.init };
}
const demoHooks = { press: () => {}, escape: () => {} };
const DEMO_STATION_LANE = { builder: "office-scene", artist: "office-sprites", reviewer: "office-review" };

function demoApply(ev) {
  const key = ev.lane || ev.to || "";
  const id = DEMO_STATION_LANE[key] || key;
  const st = demoState[id];
  if (ev.type === "assignment" || ev.type === "handoff") {
    if (st && !st.result) { st.health = "running"; st.running = true; }
  } else if (ev.type === "status") {
    if (!st) return;
    if (String(ev.status || "").toLowerCase() === "done") {
      st.dn = (DEMO_SET[id] && DEMO_SET[id].texts.length) || st.dn;
      st.cur = 0; st.health = "done"; st.running = false;
      st.result = "done"; st.verdict = demoBig ? "ready" : "ok";
    } else {
      st.health = String(ev.status || "running").toLowerCase();
      st.running = st.health === "running";
    }
  } else if (ev.type === "stepComplete") {
    if (st && !st.result) {
      const total = (DEMO_SET[id] && DEMO_SET[id].texts.length) || 0;
      st.dn = st.dn + 1;
      st.cur = total && st.dn < total ? st.dn + 1 : 0;
    }
  } else if (ev.type === "press") {
    demoHooks.press(id);
    return;
  } else if (ev.type === "escape") {
    demoHooks.escape();
    return;
  }
  render();
}

const DEMO_LEAD = 1000;
function scheduleDemoEvents() {
  if (mode !== "demo" || demoBig || demoDone || q.get("still") === "1") return;
  for (const ev of (SCENE.fixture && SCENE.fixture.events) || []) {
    setTimeout(() => { if (mode === "demo") demoApply(ev); }, (ev.atMs || 0) + DEMO_LEAD);
  }
}

function demoModel() {
  const mkSteps = (texts, dn, cur) => texts.map((tx, i) => ({ text: tx, state: i < dn ? "done" : cur === i + 1 ? "current" : "pending" }));
  const mk = (id) => {
    const b = DEMO_SET[id], st = demoState[id];
    const started = DEMO_T0 - (b.dur + 6) * 60000;
    return {
      id, task: id, health: st.health, phase: b.phase, running: st.running,
      result: st.result, verdict: st.verdict,
      commits: st.dn + "/" + b.texts.length,
      runs: b.runs || 0, continues: b.continues || [],
      models: { build: b.model }, tokens: b.tokens,
      progress: { done: st.dn, total: b.texts.length, current: st.cur ? { n: st.cur, text: b.texts[st.cur - 1] } : null },
      steps: mkSteps(b.texts, st.dn, st.cur),
      startedAt: started, finishedAt: st.result === "done" ? started + b.dur * 60000 : null,
    };
  };
  const at = (m) => new Date(DEMO_T0 - m * 60000).toISOString();
  if (demoBig) {
    const lanes = Object.keys(DEMO_BIG_BASE).map(mk);
    const byId = Object.fromEntries(lanes.map((l) => [l.id, l]));
    return {
      plan: {
        id: "demo-big", title: "CLI and Office view", goal: "Ship the harness-neutral CLI and Office view",
        lead: "Claude Opus 5.5", status: demoDone ? "done" : "running",
        now: demoDone ? "All eight lanes finished; every check is green." : "Wave 1 is still building; the CLI lane waits for review.",
        next: [{ text: "Merge the sprites worktree into main", done: true }, { text: "Review the CLI help output", done: false }, { text: "Run every check on main", done: false }],
        decisions: [
          { at: at(58), text: "The CLI lane lands first so the Office view can build on the new arg parsing." },
          { at: at(44), text: "The motion fix lane stays planned until the review names the fixes." },
          { at: at(21), text: "Onboarding ships last; it needs the final CLI wording." },
        ],
      },
      lanes,

  document.documentElement.classList.toggle("narrow", narrow);
  const w = wrap.clientWidth || 1;
  let h;

  pick.x = Math.min(Math.max(pick.x, I), Math.max(I, sw - I - w));

  win.style.left = pick.x + "px";
  win.style.top = pick.y + "px";
  const T = 10;
  tail.className = "t-" + (pick.side === "right" ? "left" : pick.side === "left" ? "right" : pick.side === "below" ? "up" : "down");
  if (pick.side === "right" || pick.side === "left") {
    tail.style.left = (pick.side === "right" ? -T / 2 - 1 : w - T / 2 - 1) + "px";
    tail.style.top = Math.min(Math.max(a.cy - pick.y - T / 2, 6), Math.max(6, h - T - 6)) + "px";
  } else {
    tail.style.top = (pick.side === "below" ? -T / 2 - 1 : h - T / 2 - 1) + "px";
    tail.style.left = Math.min(Math.max(a.cx - pick.x - T / 2, 6), Math.max(6, w - T - 6)) + "px";
  }
}
function openWin(id, anchor, kb) {
  clearTimeout(winCloseTimer);
  const win = $("win");
  const wasOpen = !win.hidden;
  setTriggerAria(winAnchor, false);
  winFor = id;
  winAnchor = anchor || null;
  setTriggerAria(winAnchor, true);
  renderWinContent(false);
  win.hidden = false;
  positionWin();
  win.classList.remove("win-in", "win-out");
  if (!wasOpen && !winInstant()) { void win.offsetWidth; win.classList.add("win-in"); }
  if (kb) $("winX").focus();
  if (mode !== "demo" && id !== "lead") fetchDetail(id).then((d) => { if (winFor === id && !$("win").hidden && d && d.steps) renderChecklist(d.steps); });
}
function closeWin(toFocus) {
  const win = $("win");
  if (win.hidden || !winFor) return;
  const anchor = winAnchor;
  setTriggerAria(anchor, false);
  winFor = null;
  winAnchor = null;
  if (winInstant()) { win.hidden = true; win.classList.remove("win-in", "win-out"); }
  else {
    win.classList.remove("win-in");
    win.classList.add("win-out");
    winCloseTimer = setTimeout(() => { win.hidden = true; win.classList.remove("win-out"); }, 100);
  }
  if (toFocus && anchor && anchor.isConnected) anchor.focus();
}
function focusFallback() {
  if (narrow) {
    const row = stRows.get("lead");
    if (row) { row.focus(); return; }
  }
  const box = $("overflow");
  const first = box.hidden ? null : box.querySelector(".ov-row");
  if (first) first.focus();
  else $("plate-lead").focus();
}
function updateWin() {
  const win = $("win");
  if (win.hidden || !winFor || !model) return;
  if (winFor === "lead") { renderWinContent(true); return; }
  const l = model.lanes.find((x) => x.id === winFor);
  if (!l) { closeWin(false); focusFallback(); return; }
  renderWinContent(true);
  if (mode !== "demo") fetchDetail(winFor).then((d) => { if (winFor && !$("win").hidden && d && d.steps) renderChecklist(d.steps); });
}
winHooks.open = (id, anchor, kb) => {
  if (winFor === id && !$("win").hidden) { closeWin(false); return; }
  if (narrow) {
    const row = stRows.get(id);
    if (row) anchor = row;
  }
  openWin(id, anchor, kb);
};
winHooks.close = () => closeWin(false);
demoHooks.press = (id) => {
  let anchor = null;
  for (const stKey of WORKER_STATIONS) if (stationLane[stKey] === id) anchor = $("plate-" + stKey);
  if (!anchor) anchor = ovBtns.get(id) || null;
  winHooks.open(id, anchor, false);
};
demoHooks.escape = () => winHooks.close();
$("winX").addEventListener("click", () => closeWin(true));
document.addEventListener("keydown", (ev) => {
  if (ev.key === "Escape" && !$("win").hidden) { ev.preventDefault(); closeWin(true); }
});
document.addEventListener("pointerdown", (ev) => {
  if ($("win").hidden) return;
  const t = ev.target;
  if ($("win").contains(t) || (winAnchor && winAnchor.contains(t))) return;
  if (t.closest && t.closest(".plate, .ov-row, .hit")) return;
  closeWin(false);
});
$("winInput").addEventListener("input", () => { if (winFor && winFor !== "lead") drafts.set(winFor, $("winInput").value); });
$("winForm").addEventListener("submit", async (ev) => {
  ev.preventDefault();
  if (sendInFlight || !winFor || winFor === "lead") return;
  const id = winFor;
  const l = model.lanes.find((x) => x.id === id);
  if (!l || !l.running) return;
  const sent = $("winInput").value.trim();
  if (!sent) return;
  sendInFlight = true;
  syncComposer(l);
  let ok = mode === "demo";
  if (!ok) {
    try {
      const r = await fetch("/api/lane/" + encodeURIComponent(id) + "/steer", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ text: sent }) });
      ok = r.ok;
    } catch (e) { ok = false; }
  }
  sendInFlight = false;
  if (ok) {
    const cur = drafts.get(id) || "";
    if (cur === sent || cur.startsWith(sent)) drafts.set(id, cur.slice(sent.length));
    errs.delete(id);
  } else {
    errs.set(id, "steer failed, try again");
  }
  if (winFor === id) {
    $("winInput").value = drafts.get(id) || "";
    $("winErr").hidden = !errs.get(id);
    $("winErr").textContent = errs.get(id) || "";
    syncComposer(model.lanes.find((x) => x.id === id));
  }
});

const effects = [];
function recordEffect(type, laneId) { effects.push({ type, laneId, at: Date.now() }); if (effects.length > 60) effects.splice(0, effects.length - 60); }
let snap = null;
function diffCues() {
  const cues = [];
  const lanes = model.lanes;
  const fresh = !snap || snap.planId !== model.plan.id || (snap.err && !fetchErr);
  if (!fresh) {
    for (const l of lanes) {
      const p = snap.lanes.get(l.id);
      if (!p) continue;
      const done = (l.progress && l.progress.done) || 0;
      const result = l.result || "";
      if (!p.running && l.running && p.key === "idle") cues.push({ type: "receive", id: l.id });
      if (done > p.done) cues.push({ type: "step", id: l.id });
      if (result === "done" && p.result !== "done") cues.push({ type: "complete", id: l.id });
    }
  }
  snap = { planId: model.plan.id, err: !!fetchErr, lanes: new Map(lanes.map((l) => [l.id, { running: !!l.running, done: (l.progress && l.progress.done) || 0, result: l.result || "", key: CAUI.status(l.health).key }])) };
  return cues;
}
function firePacket(stKey) {
  const lead = SCENE.stations.lead.foot, f = SCENE.stations[stKey].foot;
  const x0 = ox + lead[0] * k, y0 = oy + (lead[1] + 34) * k;
  const x1 = ox + f[0] * k, y1 = oy + (f[1] + 34) * k;
  const dot = document.createElement("div");
  dot.className = "packet";
  $("fx").appendChild(dot);
  const d1 = Math.abs(x1 - x0), d2 = Math.abs(y1 - y0);
  const total = d1 + d2 || 1;
  const anim = dot.animate([
    { transform: "translate(" + x0 + "px," + y0 + "px)" },
    { transform: "translate(" + x1 + "px," + y0 + "px)", offset: d1 / total },
    { transform: "translate(" + x1 + "px," + y1 + "px)" },
  ], { duration: 600, easing: "linear" });
  anim.onfinish = () => dot.remove();
}
function fireCheck(stKey) {
  const plate = $("plate-" + stKey);
  const pr = plate.getBoundingClientRect();
  if (!pr.width) return;
  const sr = $("stage").getBoundingClientRect();
  const el = document.createElement("div");
  el.className = "checkmark";
  el.innerHTML = '<svg viewBox="0 0 16 16" width="16" height="16"><path d="M3 9l3.5 3.5L13 5" fill="none" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  el.style.left = (pr.right - sr.left + 6) + "px";
  el.style.top = (pr.top - sr.top + pr.height / 2 - 8) + "px";
  $("fx").appendChild(el);
  const p = el.querySelector("path");
  const len = p.getTotalLength();
  p.style.strokeDasharray = len;
  p.style.strokeDashoffset = len;
  p.animate([{ strokeDashoffset: len }, { strokeDashoffset: 0 }], { duration: 300, easing: "ease-out", fill: "forwards" });
  setTimeout(() => el.remove(), 1000);
}
function fireCues(cues) {
  const on = PixelSprites.motion();
  for (const c of cues) {
    const stKey = laneStation.get(c.id);
    if (!stKey || !on) continue;
    if (c.type === "receive") {
      recordEffect("receive", c.id);
      if (sprites.lead) sprites.lead.play("receive");
      if (!narrow) firePacket(stKey);
      const sp = sprites[stKey];
      if (sp) setTimeout(() => { if (laneStation.get(c.id) === stKey) sp.play("receive"); }, 600);
    } else if (c.type === "step") {
      recordEffect("step", c.id);
      if (!narrow) fireCheck(stKey);
    } else if (c.type === "complete") {
      recordEffect("complete", c.id);
      const sp = sprites[stKey];
      if (sp) sp.play("complete");
    }
  }
}
function syncMotionUi() { document.body.classList.toggle("no-motion", !PixelSprites.motion()); }
PixelSprites.onMotion(syncMotionUi);
syncMotionUi();

window.__office = {
  state() {
    const r = $("stage").getBoundingClientRect();
    const win = $("win");
    const wr = win.getBoundingClientRect();
    const stations = STATION_KEYS.map((key) => {
      const f = SCENE.stations[key].foot;
      const plate = $("plate-" + key).getBoundingClientRect();
      const sp = sprites[key];
      const id = key === "lead" ? "lead" : stationLane[key];
      const l = id && id !== "lead" && model ? model.lanes.find((x) => x.id === id) : null;
      const st = key === "lead" ? (model ? CAUI.status(planStatus(model.plan, model.lanes)) : { key: "idle" }) : l ? CAUI.status(l.health) : { key: "idle" };
      return {
        station: key, role: key, laneId: id || null,
        name: key === "lead" ? ((model && model.plan.lead) || "Lead") : (l ? laneName(l) : ""),
        status: st.key,
        clip: sp ? sp.clip : "",
        frame: sp && sp.el && sp.el.dataset.frame !== undefined ? Number(sp.el.dataset.frame) : null,
        foot: { x: r.x + ox + f[0] * k, y: r.y + oy + f[1] * k },
        plate: { x: plate.x, y: plate.y, w: plate.width, h: plate.height },
        done: l && l.progress ? (l.progress.done || 0) : 0,
        total: l && l.progress ? (l.progress.total || 0) : 0,
      };
    });
    return {
      mode,
      plan: (model && model.plan && model.plan.title) || "",
      goal: (model && model.plan && model.plan.goal) || "",
      stage: { x: r.x, y: r.y, w: r.width, h: r.height, k },
      stations,
      overflow: model ? model.lanes.filter((l) => !laneStation.has(l.id)).map((l) => l.id) : [],
      window: { open: !win.hidden && !!winFor, laneId: winFor, x: wr.x, y: wr.y, w: wr.width, h: wr.height, focusInside: win.contains(document.activeElement) },
      effects: effects.slice(),
      motion: PixelSprites.motion(),
      lanes: (model && model.lanes || []).map((l) => ({ id: l.id, health: String(l.health || ""), running: !!l.running, result: l.result || "", done: (l.progress && l.progress.done) || 0, total: (l.progress && l.progress.total) || 0 })),
    };
  },
  press(id) {
    if (!model) return false;
    if (id === "lead") { winHooks.open("lead", narrow ? (stRows.get("lead") || null) : $("plate-lead"), false); return true; }

    if (!anchor) anchor = ovBtns.get(id) || stRows.get(id) || null;

  },
  demoAdvance,
  demoFail,
