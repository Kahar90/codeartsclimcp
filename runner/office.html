<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CodeArts Office</title>
<link rel="stylesheet" href="/assets/workshop.css">
<style>
html, body { height: 100%; }
* { box-sizing: border-box; }
body { margin: 0; display: flex; flex-direction: column; overflow: hidden; }
.runstrip { flex: none; height: 24px; padding: 0 20px; display: flex; align-items: center; gap: 12px; font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; background: var(--bg); border-bottom: 1px solid var(--border); }
.runstrip .ptitle { font-weight: 700; color: var(--fg); font-size: 12.5px; overflow: hidden; text-overflow: ellipsis; }
.runstrip .pnow { overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.runstrip .topfill { flex: 1; }
.chip { font-size: 11px; padding: 1px 8px; border-radius: 999px; background: var(--panel-2); border: 1px solid var(--border-2); color: var(--muted); white-space: nowrap; }
#planSel { height: 20px; background: var(--panel); color: var(--fg); border: 1px solid var(--border-2); border-radius: 6px; font: 11px var(--font); max-width: 200px; }
#motionBtn { flex: none; height: 20px; padding: 0 9px; border-radius: 6px; border: 1px solid var(--border-2); background: var(--panel); color: var(--muted); font: 600 11px var(--font); cursor: pointer; }
#motionBtn[aria-pressed="true"] { color: var(--fg); border-color: var(--sel); }
#motionBtn:focus-visible { outline: 2px solid var(--sel); outline-offset: 1px; }
#stagewrap { flex: 1; min-height: 0; background: var(--stage); display: flex; align-items: center; justify-content: center; }
#stage { position: relative; overflow: hidden; background: url("/assets/workshop.png") 0 0 / 100% 100% no-repeat; image-rendering: pixelated; }
#links { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
#links path { fill: none; stroke: var(--sel); stroke-opacity: 0.75; }
#sprites { position: absolute; inset: 0; pointer-events: none; }
#plates { position: absolute; inset: 0; pointer-events: none; }
.plate { position: absolute; transform: translate(-50%, -50%); pointer-events: auto; display: flex; flex-direction: column; align-items: center; gap: 1px; padding: 4px 10px; background: var(--panel-2); border: 2px solid var(--border-2); border-radius: 8px; font: 11px/1.3 var(--font); color: var(--fg); cursor: pointer; text-align: center; white-space: nowrap; }
.plate .p-name { font-weight: 700; }
.plate .p-sub { color: var(--muted); font-size: 10px; }
#plate-lead { border-color: var(--lead); }
#plate-builder { border-color: var(--builder); }
#plate-artist { border-color: var(--artist); }
#plate-reviewer { border-color: var(--reviewer); }
#overflow { position: absolute; right: 10px; bottom: 10px; z-index: 6; display: flex; flex-direction: column; gap: 4px; max-width: 250px; padding: 8px; background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius-sm); }
#overflow[hidden] { display: none; }
.ov-title { padding: 0 2px 3px; color: var(--muted); font-size: 11px; font-weight: 600; }
.ov-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 4px 8px; background: var(--panel-2); border: 1px solid var(--border-2); border-radius: 6px; font: 11px/1.3 var(--font); color: var(--fg); cursor: pointer; text-align: left; white-space: nowrap; }
.ov-row .ov-st { color: var(--muted); font-size: 10px; }
body.narrow { height: auto; min-height: 100%; overflow-y: auto; }
body.narrow #stagewrap { flex: none; }
</style>
</head>
<body>
<header class="ca-top">
  <a class="ca-brand" href="/">CodeArts</a><span class="ca-sep"></span>
  <nav class="ca-tabs" aria-label="Views">
    <a class="ca-tab" href="/office" aria-current="page"><svg class="ca-ico" viewBox="0 0 18 18" aria-hidden="true"><path d="M2 2h5v5H2zM11 2h5v5h-5zM2 11h5v5H2zM11 11h5v5h-5z" fill="none" stroke="currentColor" stroke-width="1.6"/></svg>Office</a>
    <a class="ca-tab" href="/"><svg class="ca-ico" viewBox="0 0 18 18" aria-hidden="true"><path d="M9 2 16 6 9 10 2 6ZM2 10.5l7 4 7-4" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>Lanes</a>
  </nav>
  <span class="ca-top-fill"></span><span class="ca-counts" id="counts"></span>
</header>
<div class="runstrip" id="runstrip">
  <span class="ptitle" id="planTitle"></span>
  <span class="pnow" id="nowLine" hidden></span>
  <span class="chip" id="leadChip" hidden></span>
  <span id="statusBadge"></span>
  <span class="topfill"></span>
  <select id="planSel" hidden aria-label="plan"></select>
  <button id="motionBtn" type="button" aria-pressed="true">Motion</button>
</div>
<main id="stagewrap">
  <div id="stage">
    <svg id="links" aria-hidden="true"></svg>
    <div id="sprites"></div>
    <div id="plates">
      <button type="button" class="plate" id="plate-lead" style="display: none"><b class="p-name"></b><span class="p-sub"></span></button>
      <button type="button" class="plate" id="plate-builder" style="display: none"><b class="p-name"></b><span class="p-sub"></span></button>
      <button type="button" class="plate" id="plate-artist" style="display: none"><b class="p-name"></b><span class="p-sub"></span></button>
      <button type="button" class="plate" id="plate-reviewer" style="display: none"><b class="p-name"></b><span class="p-sub"></span></button>
    </div>
    <div id="overflow" hidden>
      <div class="ov-title" id="ovTitle"></div>
    </div>
  </div>
</main>
<script src="/assets/workshop.js"></script>
<script>
"use strict";
(() => {
const $ = (id) => document.getElementById(id);
const q = new URLSearchParams(location.search);
const demoBig = q.get("demo") === "big";
const demoDone = q.get("demo") === "done" || (demoBig && q.get("done") === "1");
const mode = q.has("demo") ? "demo" : "live";
let STAGE_W = 1280, STAGE_H = 720;
let SCENE = {
  stage: [1280, 720],
  stations: { lead: { foot: [292, 356] }, builder: { foot: [626, 354] }, artist: { foot: [759, 601] }, reviewer: { foot: [1036, 350] } },
  fixture: {
    events: [
      { atMs: 1300, type: "assignment", from: "lead", to: "builder" },
      { atMs: 2000, type: "status", lane: "builder", status: "Running" },
      { atMs: 3300, type: "press", lane: "builder" },
      { atMs: 5250, type: "stepComplete", lane: "builder", step: "Data layer", progress: [3, 4] },
      { atMs: 7200, type: "handoff", from: "lead", to: "artist" },
      { atMs: 7900, type: "status", lane: "artist", status: "Running" },
      { atMs: 9500, type: "press", lane: "artist" },
      { atMs: 11500, type: "status", lane: "artist", status: "Done" },
      { atMs: 13400, type: "escape" },
    ],
  },
};
async function loadScene() {
  try {
    const r = await fetch("/assets/scene.json");
    if (!r.ok) return;
    const j = await r.json();
    if (j && Array.isArray(j.stageSize) && j.stageSize.length === 2 && j.stations && ["lead", "builder", "artist", "reviewer"].every((s) => j.stations[s] && Array.isArray(j.stations[s].foot))) {
      SCENE = { stage: j.stageSize, stations: j.stations, fixture: j.fixture || { events: [] } };
    }
  } catch (e) {}
}

let plansArr = [], lanesArr = [], planSel = null, plansSig = "";
let model = null, fetchErr = "", k = 1;
const detailCache = new Map();

const DEMO_T0 = Date.now();
const DEMO_BASE = {
  "office-scene": { phase: "build", model: "maas/glm-5.3", dur: 46, tokens: { input: 12100, output: 21400, reasoning: 4800 },
    texts: ["Routes in ca.mjs", "Page shell with the goal box", "Data layer with demo mode", "Scene, cards and completion"],
    init: { dn: 2, cur: 3, health: "waiting", running: false, result: "", verdict: "" } },
  "office-sprites": { phase: "build", model: "maas/glm-5.3", dur: 32, tokens: { input: 3900, output: 7100, reasoning: 1400 },
    texts: ["Sprite contract check", "Draw the five roles", "Polish the animations"],
    init: { dn: 0, cur: 1, health: "waiting", running: false, result: "", verdict: "" } },
  "office-review": { phase: "review", model: "maas/glm-5.3", dur: 8, tokens: { input: 1700, output: 3200, reasoning: 700 },
    texts: ["Read the diffs", "Run the checks", "Review the sprites", "Write the verdict"],
    init: { dn: 1, cur: 2, health: "running", running: true, result: "", verdict: "" } },
};
const DEMO_BIG_BASE = {
  "office-scene": { phase: "build", model: "maas/glm-5.3", dur: 46, tokens: { input: 12100, output: 21400, reasoning: 4800 },
    texts: ["Routes in ca.mjs", "Page shell with the goal box", "Data layer with demo mode", "Scene, cards and completion", "Links and packet animation", "Resize re-bakes geometry", "Keyboard focus and Escape", "Screenshots for the checks"],
    init: { dn: 3, cur: 4, health: "running", running: true, result: "", verdict: "" } },
  "office-sprites": { phase: "review", model: "maas/glm-5.3", dur: 32, tokens: { input: 3900, output: 7100, reasoning: 1400 },
    texts: ["Sprite contract check", "Draw the five roles", "Isometric desks and chairs", "Floating panels and badges", "Working and idle poses", "Hue variants per role", "Reduced motion fallbacks", "Polish the animations"],
    init: { dn: 8, cur: 0, health: "running", running: true, result: "", verdict: "" } },
  "cli-dx": { phase: "build", model: "maas/qwen3-coder", dur: 41, tokens: { input: 8600, output: 12300, reasoning: 2600 },
    texts: ["Split ca.mjs commands", "Harness-neutral arg parsing", "Help text for every command", "Exit codes and stderr", "Shell completion stubs", "Version and doctor output", "Man page snippet", "CLI contract check"],
    init: { dn: 8, cur: 0, health: "done", running: false, result: "done", verdict: "ready" } },
  "mcp": { phase: "build", model: "maas/glm-5.3", dur: 37, tokens: { input: 6400, output: 9800, reasoning: 1900 },
    texts: ["MCP server skeleton", "Tool schemas", "stdio transport", "Auth from the user env", "List and read tools", "Error shapes", "Logging without secrets", "MCP check green"],
    init: { dn: 8, cur: 0, health: "done", running: false, result: "done", verdict: "ready" } },
  "setup": { phase: "fix", model: "maas/qwen3-max", dur: 29, tokens: { input: 5200, output: 8100, reasoning: 1200 },
    texts: ["Detect installed harnesses", "Per-harness setup notes", "Doctor rows", "Copyable onboard command", "First-lane quick start", "Trust the worktree folder", "Windows path quirks", "Re-run the setup check"],
    init: { dn: 7, cur: 8, health: "running", running: true, result: "", verdict: "" } },
  "office-motion": { phase: "build", model: "maas/glm-5.3", dur: 34, tokens: { input: 7300, output: 10600, reasoning: 2200 },
    texts: ["Motion brief", "Intro tilt", "Hover lift", "Working bob", "Packet trails", "Done burst", "Reduced motion fades", "Motion check green"],
    init: { dn: 8, cur: 0, health: "needs review", running: false, result: "needs review", verdict: "needs fixes" } },
  "office-review": { phase: "review", model: "maas/glm-5.3", dur: 14, tokens: { input: 2600, output: 4100, reasoning: 900 },
    texts: ["Read the diffs", "Run the checks", "Review the sprites", "Write the verdict"],
    init: { dn: 4, cur: 0, health: "needs review", running: false, result: "needs review", verdict: "needs fixes" } },
  "onboard": { phase: "build", model: "maas/glm-5.3", dur: 25, tokens: { input: 4300, output: 6900, reasoning: 1100 },
    texts: ["Welcome panel copy", "Doctor rows per harness", "Onboard command snippet", "First-lane list", "Links to the docs", "Dismiss and remember", "Onboard check", "Screenshots for the README"],
    init: { dn: 0, cur: 0, health: "planned", running: false, result: "", verdict: "" } },
};
const DEMO_SET = demoBig ? DEMO_BIG_BASE : DEMO_BASE;
const demoState = {};
for (const [id, b] of Object.entries(DEMO_SET)) {
  demoState[id] = demoDone
    ? { dn: b.texts.length, cur: 0, health: "done", running: false, result: "done", verdict: demoBig ? "ready" : "ok" }
    : { ...b.init };
}
const demoHooks = { press: () => {}, escape: () => {} };
const DEMO_STATION_LANE = { builder: "office-scene", artist: "office-sprites", reviewer: "office-review" };

function demoApply(ev) {
  const key = ev.lane || ev.to || "";
  const id = DEMO_STATION_LANE[key] || key;
  const st = demoState[id];
  if (ev.type === "assignment" || ev.type === "handoff") {
    if (st && !st.result) { st.health = "running"; st.running = true; }
  } else if (ev.type === "status") {
    if (!st) return;
    if (String(ev.status || "").toLowerCase() === "done") {
      st.dn = (DEMO_SET[id] && DEMO_SET[id].texts.length) || st.dn;
      st.cur = 0; st.health = "done"; st.running = false;
      st.result = "done"; st.verdict = demoBig ? "ready" : "ok";
    } else {
      st.health = String(ev.status || "running").toLowerCase();
      st.running = st.health === "running";
    }
  } else if (ev.type === "stepComplete") {
    if (st && !st.result) {
      const total = (DEMO_SET[id] && DEMO_SET[id].texts.length) || 0;
      st.dn = st.dn + 1;
      st.cur = total && st.dn < total ? st.dn + 1 : 0;
    }
  } else if (ev.type === "press") {
    demoHooks.press(id);
    return;
  } else if (ev.type === "escape") {
    demoHooks.escape();
    return;
  }
  render();
}

const DEMO_LEAD = 1000;
function scheduleDemoEvents() {
  if (mode !== "demo" || demoBig || demoDone || q.get("still") === "1") return;
  for (const ev of (SCENE.fixture && SCENE.fixture.events) || []) {
    setTimeout(() => { if (mode === "demo") demoApply(ev); }, (ev.atMs || 0) + DEMO_LEAD);
  }
}

function demoModel() {
  const mkSteps = (texts, dn, cur) => texts.map((tx, i) => ({ text: tx, state: i < dn ? "done" : cur === i + 1 ? "current" : "pending" }));
  const mk = (id) => {
    const b = DEMO_SET[id], st = demoState[id];
    const started = DEMO_T0 - (b.dur + 6) * 60000;
    return {
      id, task: id, health: st.health, phase: b.phase, running: st.running,
      result: st.result, verdict: st.verdict,
      commits: st.dn + "/" + b.texts.length,
      models: { build: b.model }, tokens: b.tokens,
      progress: { done: st.dn, total: b.texts.length, current: st.cur ? { n: st.cur, text: b.texts[st.cur - 1] } : null },
      steps: mkSteps(b.texts, st.dn, st.cur),
      startedAt: started, finishedAt: st.result === "done" ? started + b.dur * 60000 : null,
    };
  };
  const at = (m) => new Date(DEMO_T0 - m * 60000).toISOString();
  if (demoBig) {
    const lanes = Object.keys(DEMO_BIG_BASE).map(mk);
    const byId = Object.fromEntries(lanes.map((l) => [l.id, l]));
    return {
      plan: {
        id: "demo-big", title: "CLI and Office view", goal: "Ship the harness-neutral CLI and Office view",
        lead: "Claude Opus 5.5", status: demoDone ? "done" : "running",
        now: demoDone ? "All eight lanes finished; every check is green." : "Wave 1 is still building; the CLI lane waits for review.",
        next: [{ text: "Merge the sprites worktree into main", done: true }, { text: "Review the CLI help output", done: false }, { text: "Run every check on main", done: false }],
        decisions: [
          { at: at(58), text: "The CLI lane lands first so the Office view can build on the new arg parsing." },
          { at: at(44), text: "The motion fix lane stays planned until the review names the fixes." },
          { at: at(21), text: "Onboarding ships last; it needs the final CLI wording." },
        ],
      },
      lanes,
      waves: [
        { name: "Wave 1", lanes: [byId["office-scene"], byId["office-sprites"]] },
        { name: "Wave 2", lanes: [byId["office-review"], byId["cli-dx"]] },
        { name: "Wave 3", lanes: [byId["mcp"], byId["setup"], byId["office-motion"]] },
        { name: "Wave 4", lanes: [byId["onboard"]] },
      ],
    };
  }
  const scene = mk("office-scene"), sprites = mk("office-sprites"), review = mk("office-review");
  return {
    plan: {
      id: "demo", title: "Office view for codearts-build", goal: "Build the Office view for codearts-build lanes",
      lead: "Claude Opus 5.5", status: demoDone ? "done" : "running",
      now: demoDone ? "All lanes finished; reviewing the screenshots." : "Waiting for the scene and sprites lanes to finish.",
      next: [{ text: "Merge the sprites worktree into main", done: true }, { text: "Run both checks on main and look at the screenshots", done: false }, { text: "Copy the office files into the live skill runner", done: false }],
      decisions: [
        { at: at(52), text: "Sprites lane works in a separate worktree so both lanes run in parallel." },
        { at: at(41), text: "The scene page polls the runner API directly; the server stays stateless." },
        { at: at(12), text: "Fallback characters keep the page working before the sprites land." },
      ],
    },
    lanes: [scene, sprites, review],
    waves: [{ name: "Wave 1", lanes: [scene, sprites] }, { name: "Wave 2", lanes: [review] }],
  };
}

function liveModel() {
  const plan = (planSel && plansArr.find((p) => p.id === planSel)) || plansArr[0] || null;
  if (plan) return { plan, lanes: plan.waves.flatMap((w) => w.lanes || []), waves: plan.waves };
  const recent = lanesArr.filter((l) => l.startedAt && Date.now() - l.startedAt < 86400e3);
  return {
    plan: { id: "", title: "Recent lanes", goal: "Recent lanes", lead: "Claude", status: "", now: "", next: [], decisions: [] },
    lanes: recent, waves: [{ name: "Recent lanes", lanes: recent }],
  };
}

function sizeStage() {
  const wrap = $("stagewrap"), stage = $("stage");
  const w = wrap.clientWidth || 1, h = wrap.clientHeight || 1;
  const sw = Math.max(1, Math.min(w, h * STAGE_W / STAGE_H));
  stage.style.width = sw + "px";
  stage.style.height = (sw * STAGE_H / STAGE_W) + "px";
  k = sw / STAGE_W;
}

function planStatus(p, lanes) {
  if (p.status) return p.status;
  if (lanes.some((l) => l.running)) return "running";
  if (lanes.length && lanes.every((l) => l.result === "done" || l.result === "needs review")) return "done";
  return "planned";
}

function renderTop() {
  const p = model.plan;
  $("planTitle").textContent = p.title || p.goal || "(no plan)";
  const now = fetchErr ? fetchErr + " (retrying every 2 s)" : (p.now || "");
  $("nowLine").hidden = !now;
  $("nowLine").textContent = now ? "Now: " + now : "";
  $("leadChip").hidden = !p.lead;
  if (p.lead) $("leadChip").textContent = p.lead;
  $("statusBadge").innerHTML = CAUI.badge(CAUI.status(planStatus(p, model.lanes)));
  const nPlans = mode === "demo" ? 1 : plansArr.length;
  const nLanes = mode === "demo" ? model.lanes.length : lanesArr.length;
  $("counts").textContent = `${nPlans} plan${nPlans === 1 ? "" : "s"} \u00b7 ${nLanes} lane${nLanes === 1 ? "" : "s"}`;
  const sel = $("planSel");
  const sig = JSON.stringify(plansArr.map((x) => x.id));
  if (mode === "live" && plansArr.length > 1) {
    sel.hidden = false;
    if (sig !== plansSig) { plansSig = sig; sel.innerHTML = plansArr.map((x) => `<option value="${CAUI.esc(x.id)}">${CAUI.esc(x.title)}</option>`).join(""); }
    sel.value = (planSel && plansArr.some((x) => x.id === planSel)) ? planSel : plansArr[0].id;
  } else { sel.hidden = true; plansSig = ""; }
}

function render() {
  model = mode === "demo" ? demoModel() : liveModel();
  renderTop();
  assignStations();
  renderStations();
  renderOverflow();
}

async function tick() {
  if (mode !== "demo") {
    try {
      const [pr, lr] = await Promise.all([fetch("/api/plans"), fetch("/api/lanes")]);
      plansArr = await pr.json();
      lanesArr = await lr.json();
      if (!planSel) planSel = (plansArr[0] && plansArr[0].id) || null;
      fetchErr = "";
    } catch (e) { fetchErr = "dashboard server not reachable"; }
  }
  render();
}

function demoAdvance(id) {
  if (mode !== "demo") return false;
  const st = demoState[id];
  if (!st || st.result === "done" || st.health === "failed" || st.health === "stopped") return false;
  const b = DEMO_SET[id];
  st.dn = Math.min(b.texts.length, st.dn + 1);
  if (st.dn >= b.texts.length) {
    st.cur = 0;
    st.health = "done";
    st.running = false;
    st.result = "done";
    st.verdict = demoBig ? "ready" : "ok";
  } else {
    st.cur = Math.min(b.texts.length, st.dn + 1);
  }
  render();
  return true;
}

function demoFail(id) {
  if (mode !== "demo") return false;
  const st = demoState[id];
  if (!st || st.result === "done" || st.health === "failed" || st.health === "stopped") return false;
  st.health = "failed";
  st.running = false;
  st.result = "failed";
  render();
  return true;
}

const WORKER_STATIONS = ["builder", "artist", "reviewer"];
const STATION_KEYS = ["lead", "builder", "artist", "reviewer"];
const CLIP_BY_KEY = { run: "work", done: "idle", bad: "blocked", warn: "idle", idle: "idle" };
const stationLane = { builder: null, artist: null, reviewer: null };
const laneStation = new Map();
const sprites = {};
const ovBtns = new Map();
const winHooks = { open: () => {}, close: () => {} };
let assignedOnce = false, prevPlanId = null, prevRunning = new Map();

function spriteScale() { return Math.max(0.25, Math.round(k * 2 * 4) / 4); }
function laneName(l) { return l.task || l.id; }
function stationSub(l) {
  const st = CAUI.status(l.health);
  const p = l.progress || {};
  return p.total ? st.label + " \u00b7 " + (p.done || 0) + "/" + p.total : st.label;
}
function holderReclaimable(id) {
  const l = model.lanes.find((x) => x.id === id);
  if (!l) return true;
  if (l.running) return false;
  if (l.result) return true;
  return CAUI.status(l.health).key === "idle";
}
function assign(id, stKey) {
  if (laneStation.has(id)) stationLane[laneStation.get(id)] = null;
  if (stationLane[stKey]) laneStation.delete(stationLane[stKey]);
  stationLane[stKey] = id;
  laneStation.set(id, stKey);
}
function assignStations() {
  const lanes = model.lanes;
  if (model.plan.id !== prevPlanId) { prevPlanId = model.plan.id; prevRunning = new Map(); }
  const alive = new Set(lanes.map((l) => l.id));
  for (const [id, st] of [...laneStation]) if (!alive.has(id)) { laneStation.delete(id); if (stationLane[st] === id) stationLane[st] = null; }
  if (!assignedOnce) {
    assignedOnce = true;
    for (const stKey of WORKER_STATIONS) {
      if (stationLane[stKey]) continue;
      const nm = SCENE.stations[stKey] && SCENE.stations[stKey].name;
      const named = nm && lanes.find((l) => l.id === nm && !laneStation.has(l.id));
      const pick = named || lanes.find((l) => l.running && !laneStation.has(l.id)) || lanes.find((l) => !laneStation.has(l.id));
      if (pick) assign(pick.id, stKey);
    }
  } else {
    for (const l of lanes) {
      if (laneStation.has(l.id) || !l.running || prevRunning.get(l.id)) continue;
      const victim = WORKER_STATIONS.find((stKey) => !stationLane[stKey] || holderReclaimable(stationLane[stKey]));
      if (victim) assign(l.id, victim);
    }
    for (const stKey of WORKER_STATIONS) {
      if (stationLane[stKey]) continue;
      const pick = lanes.find((l) => !laneStation.has(l.id) && l.running) || lanes.find((l) => !laneStation.has(l.id));
      if (pick) assign(pick.id, stKey);
    }
  }
  prevRunning = new Map(lanes.map((l) => [l.id, !!l.running]));
}
function setStation(key, opts) {
  const plate = $("plate-" + key);
  const sp = sprites[key];
  if (!opts) {
    plate.style.display = "none";
    if (sp) sp.el.style.display = "none";
    return;
  }
  plate.style.display = "flex";
  if (sp) sp.el.style.display = "";
  plate.querySelector(".p-name").textContent = opts.name;
  plate.querySelector(".p-sub").textContent = opts.sub;
  plate.dataset.lane = opts.laneId;
  if (sp && opts.clip) sp.setClip(opts.clip);
}
function renderStations() {
  if (!model) return;
  const p = model.plan;
  const planKey = CAUI.status(planStatus(p, model.lanes)).key;
  setStation("lead", { name: p.lead || "Lead", sub: "Orchestrator", laneId: "lead", clip: CLIP_BY_KEY[planKey] || "idle" });
  for (const stKey of WORKER_STATIONS) {
    const id = stationLane[stKey];
    const l = id && model.lanes.find((x) => x.id === id);
    if (!l) { setStation(stKey, null); continue; }
    setStation(stKey, { name: laneName(l), sub: stationSub(l), laneId: l.id, clip: CLIP_BY_KEY[CAUI.status(l.health).key] || "idle" });
  }
}
function renderLinks() {
  const lead = SCENE.stations.lead.foot;
  let d = "";
  for (const stKey of WORKER_STATIONS) {
    if (!stationLane[stKey]) continue;
    const f = SCENE.stations[stKey].foot;
    d += "M" + lead[0] * k + "," + (lead[1] + 34) * k + "H" + f[0] * k + "V" + (f[1] + 34) * k;
  }
  $("links").innerHTML = d ? '<path d="' + d + '" stroke-width="' + Math.max(1, 1.5 * k).toFixed(2) + '"></path>' : "";
}
function layoutStations() {
  const a = PixelSprites.anchor();
  const sc = spriteScale();
  for (const key of STATION_KEYS) {
    const f = SCENE.stations[key].foot;
    const sp = sprites[key];
    if (sp) {
      if (sp.scale !== sc) sp.setScale(sc);
      sp.el.style.left = f[0] * k - a[0] * sc + "px";
      sp.el.style.top = f[1] * k - a[1] * sc + "px";
    }
    const plate = $("plate-" + key);
    plate.style.left = f[0] * k + "px";
    plate.style.top = (f[1] + 34) * k + "px";
  }
  renderLinks();
}
function renderOverflow() {
  if (!model) return;
  const rest = model.lanes.filter((l) => !laneStation.has(l.id));
  const box = $("overflow");
  for (const [id, b] of [...ovBtns]) {
    if (!rest.some((l) => l.id === id)) { b.remove(); ovBtns.delete(id); }
  }
  if (!rest.length) { box.hidden = true; return; }
  box.hidden = false;
  $("ovTitle").textContent = "Other lanes (" + rest.length + ")";
  for (const l of rest) {
    let b = ovBtns.get(l.id);
    if (!b) {
      b = document.createElement("button");
      b.type = "button";
      b.className = "ov-row";
      b.dataset.lane = l.id;
      b.innerHTML = '<span class="ov-name"></span><span class="ov-st"></span>';
      b.addEventListener("click", () => winHooks.open(l.id, b));
      ovBtns.set(l.id, b);
    }
    b.querySelector(".ov-name").textContent = laneName(l);
    b.querySelector(".ov-st").textContent = CAUI.status(l.health).label;
  }
  const want = rest.map((l) => l.id).join(",");
  const have = [...box.querySelectorAll(".ov-row")].map((b) => b.dataset.lane).join(",");
  if (want !== have) for (const l of rest) box.appendChild(ovBtns.get(l.id));
}
async function initSprites() {
  try { await PixelSprites.load(); } catch (e) {}
  for (const key of STATION_KEYS) {
    const sp = PixelSprites.create(key, { scale: spriteScale(), seed: key, clip: "idle" });
    sprites[key] = sp;
    $("sprites").appendChild(sp.el);
  }
  layoutStations();
  renderStations();
}
for (const key of STATION_KEYS) {
  $("plate-" + key).addEventListener("click", () => {
    const id = key === "lead" ? "lead" : stationLane[key];
    if (id) winHooks.open(id, $("plate-" + key));
  });
}

window.__office = {
  state() {
    const r = $("stage").getBoundingClientRect();
    return {
      mode,
      plan: (model && model.plan && model.plan.title) || "",
      goal: (model && model.plan && model.plan.goal) || "",
      stage: { x: r.x, y: r.y, w: r.width, h: r.height, k },
      lanes: (model && model.lanes || []).map((l) => ({ id: l.id, health: String(l.health || ""), running: !!l.running, result: l.result || "", done: (l.progress && l.progress.done) || 0, total: (l.progress && l.progress.total) || 0 })),
    };
  },
  demoAdvance,
  demoFail,
};

const motionBtn = $("motionBtn");
function syncMotionBtn() { motionBtn.setAttribute("aria-pressed", PixelSprites.motionPref() ? "true" : "false"); }
motionBtn.addEventListener("click", () => { PixelSprites.setMotion(!PixelSprites.motionPref()); syncMotionBtn(); });
PixelSprites.onMotion(syncMotionBtn);
syncMotionBtn();

$("planSel").addEventListener("change", () => { planSel = $("planSel").value; render(); });
new ResizeObserver(() => { sizeStage(); layoutStations(); }).observe($("stagewrap"));
(async () => {
  await loadScene();
  STAGE_W = SCENE.stage[0]; STAGE_H = SCENE.stage[1];
  sizeStage();
  scheduleDemoEvents();
  if (mode === "demo") render();
  setInterval(tick, 2000);
  if (mode !== "demo") tick();
  initSprites();
})();
})();
</script>
</body>
