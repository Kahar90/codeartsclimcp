<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CodeArts Office</title>
<link rel="stylesheet" href="/assets/workshop.css">
<style>
html, body { height: 100%; }
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { margin: 0; display: flex; flex-direction: column; overflow: hidden; }
.runstrip { flex: none; height: 38px; padding: 0 20px; display: flex; align-items: center; gap: 14px; font-size: 14px; color: var(--muted); white-space: nowrap; overflow: hidden; background: var(--bg); border-bottom: 1px solid var(--border); }
body.narrow .runstrip { height: auto; min-height: 38px; flex-wrap: wrap; align-content: center; white-space: normal; overflow: visible; padding: 7px 12px; row-gap: 5px; }
body.narrow .runstrip .ptitle { flex: 1 1 100%; white-space: normal; overflow: visible; text-overflow: clip; }
body.narrow .runstrip .pnow { flex: 1 1 100%; white-space: normal; overflow: visible; text-overflow: clip; }
.runstrip .ptitle { font-weight: 700; color: var(--fg); font-size: 15px; overflow: hidden; text-overflow: ellipsis; }
.runstrip .pnow { overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.runstrip .topfill { flex: 1; }
.chip { font-size: 13px; padding: 2px 10px; border-radius: 999px; background: var(--panel-2); border: 1px solid var(--border-2); color: var(--muted); white-space: nowrap; }
.needs-pill { display: inline-flex; align-items: center; gap: 6px; height: 26px; padding: 0 11px; border-radius: 999px; background: rgba(255, 156, 156, 0.16); border: 1.5px solid var(--bad); color: var(--bad); font-weight: 650; font-size: 13px; text-decoration: none; white-space: nowrap; }
.needs-pill:hover { background: rgba(255, 156, 156, 0.28) }
.needs-pill b { font-weight: 800 }
body.narrow .ca-counts { display: none }
.np-mark { display: none }
body.narrow .np-word { display: none } body.narrow .np-mark { display: inline; font-weight: 800 } body.narrow .needs-pill { padding: 0 9px } /* phone: the Needs you pill matters more than the counts */
#planSel { display: none !important; } /* keeps the value, the change event and the test hook; #planPick is what people see */
#planPick { position: relative; flex: 0 1 auto; min-width: 120px; max-width: 320px; }
#planPick[hidden] { display: none; }
#planBtn { display: flex; align-items: center; gap: 8px; height: 28px; max-width: 100%; padding: 0 9px 0 11px; border-radius: 999px; border: 1px solid var(--border-2); background: var(--panel-2); color: var(--fg); font: 600 13px var(--font); cursor: pointer; transition: border-color .15s, background .15s; }
#planBtn:hover, #planBtn[aria-expanded="true"] { border-color: var(--sel); background: var(--raise); }
#planBtn .pp-cap { color: var(--faint); font-size: 11px; letter-spacing: .07em; text-transform: uppercase; }
#planBtn .pp-label { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
#planBtn .pp-chev { flex: none; width: 10px; height: 10px; color: var(--muted); transition: transform .15s; }
#planBtn[aria-expanded="true"] .pp-chev { transform: rotate(180deg); }
.ca-menu, .ca-card { position: fixed; z-index: 40; background: var(--panel); border: 1px solid var(--border-2); border-radius: var(--radius); box-shadow: 0 14px 36px rgba(0, 0, 0, .55); color: var(--fg); }
.ca-menu[hidden], .ca-card[hidden] { display: none; }
#planMenu { min-width: 250px; max-width: min(440px, calc(100vw - 24px)); max-height: min(60vh, 440px); overflow-y: auto; margin: 0; padding: 6px; list-style: none; outline: none; }
.pm-head { padding: 7px 10px 4px; color: var(--faint); font-size: 11px; font-weight: 700; letter-spacing: .07em; text-transform: uppercase; }
.pm-sep { height: 1px; margin: 5px 4px; background: var(--border); }
#planMenu [role="option"] { display: flex; align-items: center; gap: 10px; padding: 7px 10px; border-radius: var(--radius-sm); color: var(--muted); font-size: 13.5px; cursor: pointer; white-space: nowrap; }
#planMenu [role="option"] .pm-t { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
#planMenu [role="option"].active { background: var(--raise); color: var(--fg); }
#planMenu [role="option"][aria-selected="true"] { background: var(--sel-bg); color: var(--sel-ink); font-weight: 650; }
.pm-dot { flex: none; width: 8px; height: 8px; border-radius: 50%; background: var(--border-2); }
.pm-dot.run { background: var(--run); box-shadow: 0 0 0 3px rgba(131, 242, 207, .18); }
.pm-dot.closed { background: transparent; border: 1.5px solid var(--faint); width: 6px; height: 6px; }
.pm-tag { flex: none; font-size: 11px; color: var(--faint); }
.pm-tag.run { color: var(--run); }
.pm-check { flex: none; width: 12px; height: 12px; color: var(--sel); visibility: hidden; }
[aria-selected="true"] > .pm-check { visibility: visible; }
/* delete control: a trash button on every plan in the menu and in the lane window */
.pm-del { flex: none; width: 24px; height: 24px; display: inline-flex; align-items: center; justify-content: center; padding: 0; border-radius: 6px; border: 1px solid transparent; background: transparent; color: var(--faint); cursor: pointer; }
.pm-del:hover { border-color: var(--bad); color: var(--bad); background: var(--raise); }
.pm-del svg { width: 13px; height: 13px; }
/* hover cards (tokens, plan outcome): styled replacements for native title tooltips */
#statusBadge, #tokenChip { cursor: default; }
#tokenChip:hover, #tokenChip:focus-visible { border-color: var(--sel); color: var(--fg); }
#hoverCard { width: 300px; max-width: calc(100vw - 24px); max-height: calc(100vh - 24px); overflow-y: auto; padding: 14px 16px 12px; pointer-events: none; font-size: 13px; }
.hc-kicker { color: var(--faint); font-size: 11px; font-weight: 700; letter-spacing: .07em; text-transform: uppercase; }
.hc-big { font: 700 24px/1.15 var(--font-display); margin: 2px 0 10px; }
.hc-big small { font: 600 13px var(--font); color: var(--muted); margin-left: 6px; }
.hc-sec { margin-top: 10px; padding-top: 9px; border-top: 1px solid var(--border); }
.hc-row { display: flex; align-items: center; gap: 8px; padding: 3px 0; color: var(--muted); }
.hc-row .hc-l { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.hc-row .hc-v { flex: none; color: var(--fg); font-weight: 650; font-variant-numeric: tabular-nums; }
.hc-row .hc-v.dim { color: var(--faint); font-weight: 500; }
.hc-sw { flex: none; width: 8px; height: 8px; border-radius: 2px; }
.hc-tag { flex: none; font-size: 10.5px; padding: 0 6px; border-radius: 999px; border: 1px solid var(--border-2); color: var(--faint); }
.hc-tag.lead { color: var(--lead); border-color: rgba(220, 165, 255, .45); }
.hc-bar { display: flex; height: 6px; border-radius: 3px; overflow: hidden; background: var(--panel-2); margin-bottom: 4px; }
.hc-bar span { height: 100%; }
.hc-note { margin-top: 8px; color: var(--faint); font-size: 12px; }
#stagewrap { flex: 1; min-height: 420px; background: var(--stage); display: flex; align-items: center; justify-content: center; }
/* On desktop the room is scaled to cover the whole stage (a content-aware cover fit), so no dark band
   shows; any leftover area on stages too wide for the room is backed by #roomfill, a blurred and dimmed
   copy of the room, not a flat dark band. Narrow keeps the room at its own aspect. */
#stage { position: relative; overflow: hidden; background: radial-gradient(140% 130% at 50% 42%, #2a2233 0%, #1d1727 55%, #120e19 100%); }
#room { position: absolute; left: 0; top: 0; image-rendering: pixelated; pointer-events: none; }
#sprites { position: absolute; inset: 0; pointer-events: none; z-index: 1; } /* own stacking context: depth-sorted sprite z values never rise above plates */
#sprites .px-sprite { position: absolute; }
.desk { position: absolute; background-repeat: no-repeat; image-rendering: pixelated; pointer-events: none; }
#plates { position: absolute; inset: 0; pointer-events: none; z-index: 2; }
.needs-pill[hidden] { display: none !important; }
.plate { position: absolute; transform: translate(-50%, -50%); pointer-events: auto; display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 6px 13px; background: var(--panel-2); border: 2px solid var(--border-2); border-radius: 9px; font: 14px/1.3 var(--font); box-shadow: 0 3px 10px rgba(0, 0, 0, 0.4); color: var(--fg); cursor: pointer; text-align: center; white-space: nowrap; }
.plate .p-name { font-weight: 700; max-width: 220px; overflow: hidden; text-overflow: ellipsis; }
.plate .p-sub { color: var(--muted); font-size: 12.5px; }
.p-badge { position: absolute; right: -8px; top: -8px; width: 18px; height: 18px; border-radius: 50%; background: var(--amber); color: #3a2a05; font: 700 12px/18px var(--font); text-align: center; cursor: pointer; box-shadow: 0 1px 5px rgba(0, 0, 0, 0.55); }
.p-badge[hidden] { display: none !important; }
#plate-lead { border-color: var(--lead); }
#plate-builder { border-color: var(--builder); }
#plate-artist { border-color: var(--artist); }
#plate-reviewer { border-color: var(--reviewer); }
.plate.compact { font-size: 12px; padding: 4px 9px; gap: 1px; max-width: 170px; }
.plate.compact .p-name { font-size: 12px; max-width: 152px; overflow: hidden; text-overflow: ellipsis; }
.plate.compact .p-sub { font-size: 10.5px; max-width: 152px; overflow: hidden; text-overflow: ellipsis; }
.plate.compact .p-badge { right: -6px; top: -6px; width: 15px; height: 15px; font: 700 10px/15px var(--font); }
/* One truth: a needs-you plate is loud, a settled lane calms down, so a label never contradicts the sign. */
#plates .plate[data-tone="attn"] { border-color: var(--amber); box-shadow: 0 0 0 2px rgba(255, 181, 71, .28), 0 3px 10px rgba(0, 0, 0, .4); }
#plates .plate[data-tone="done"] { border-color: var(--run); }
#plates .plate[data-tone="idle"] { opacity: .85; }
#overflow { position: absolute; right: 10px; bottom: 10px; z-index: 6; display: flex; flex-direction: column; align-items: flex-end; gap: 6px; }
#overflow[hidden] { display: none; }
.empty-card { position: absolute; left: 50%; top: 58%; transform: translate(-50%, -50%); z-index: 7; width: min(360px, calc(100% - 32px)); display: flex; flex-direction: column; gap: 6px; padding: 16px 18px; background: rgba(35, 29, 44, .92); border: 1px solid var(--border-2); border-radius: var(--radius); box-shadow: 0 12px 32px rgba(0, 0, 0, .5); text-align: center; animation: ca-rise var(--dur-3) var(--ease-out); backdrop-filter: blur(4px); }
.empty-card[hidden] { display: none !important; }
.empty-card b { font: 700 16px var(--font-display); }
.empty-card span { color: var(--muted); font-size: 13.5px; }
.empty-card a { margin-top: 4px; font-weight: 600; }
body.narrow .empty-card { top: 50%; padding: 12px 14px; }
.ov-pill { display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 14px; border-radius: 999px; background: var(--panel); border: 1px solid var(--border-2); color: var(--fg); font: 650 13px var(--font); cursor: pointer; box-shadow: 0 3px 10px rgba(0, 0, 0, 0.4); }
.ov-pill:hover { border-color: var(--sel); }
.ov-pill:focus-visible { outline: 2px solid var(--sel); outline-offset: 1px; }
.ov-list { display: flex; flex-direction: column; gap: 4px; max-width: 320px; padding: 10px; background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius-sm); box-shadow: 0 12px 32px rgba(0, 0, 0, 0.5); }
.ov-list[hidden] { display: none; }
.ov-row { display: flex; align-items: center; gap: 10px; padding: 6px 10px; background: var(--panel-2); border: 1px solid var(--border-2); border-radius: 6px; font: 13px/1.3 var(--font); color: var(--fg); cursor: pointer; text-align: left; white-space: nowrap; }
.ov-row .ov-name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
.ov-row .ov-st { color: var(--muted); font-size: 12px; }
.ov-row .ov-flag { color: var(--amber); font-weight: 800; }
.ov-row .ov-flag[hidden] { display: none; }
.hit { position: absolute; pointer-events: auto; cursor: pointer; }
#win { position: absolute; left: 0; top: 0; width: 440px; max-width: calc(100% - 24px); z-index: 10; background: var(--panel); border: 1px solid var(--border-2); border-radius: var(--radius); box-shadow: 0 12px 32px rgba(0, 0, 0, 0.55); display: flex; flex-direction: column; }
#win[hidden] { display: none; }
#winGrab { display: none; }
#winScrim { position: absolute; inset: 0; z-index: 8; background: rgba(10, 6, 16, .5); opacity: 0; transition: opacity .2s ease; }
#winScrim[hidden] { display: none !important; }
#winScrim.show { opacity: 1; }
#winTail { position: absolute; width: 14px; height: 14px; background: var(--panel); transform: rotate(45deg); }
#winTail.t-left { border-left: 1px solid var(--border-2); border-bottom: 1px solid var(--border-2); }
#winTail.t-right { border-top: 1px solid var(--border-2); border-right: 1px solid var(--border-2); }
#winTail.t-up { border-left: 1px solid var(--border-2); border-top: 1px solid var(--border-2); }
#winTail.t-down { border-bottom: 1px solid var(--border-2); border-right: 1px solid var(--border-2); }
body.narrow #winTail { display: none; }
#win [hidden] { display: none !important; }
.win-head { display: flex; align-items: center; gap: 10px; padding: 14px 18px 10px; flex: none; }
#winTitle { flex: 1 1 auto; min-width: 0; font-weight: 700; font-size: 18px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
#winBadge { flex: none; }
#winX { margin-left: auto; flex: none; width: 32px; height: 32px; border-radius: 6px; border: 1px solid var(--border-2); background: var(--panel-2); color: var(--muted); font: 600 15px var(--font); cursor: pointer; padding: 0; }
#winX:hover { border-radius: 50%; background: var(--raise); color: var(--fg); }
#winBody { padding: 0 18px 14px; display: flex; flex-direction: column; gap: 12px; font-size: 15px; line-height: 1.5; flex: 1 1 auto; min-height: 0; overflow-y: auto; }
#winMeta { color: var(--muted); font-size: 14px; }
#winTokens { display: flex; flex-direction: column; gap: 5px; }
.tk-top { display: flex; align-items: baseline; gap: 8px; }
.tk-name { color: var(--muted); font-size: 13.5px; }
#tkTotal { font-size: 15px; }
.tk-bar { display: flex; height: 8px; border-radius: 4px; overflow: hidden; background: var(--panel-2); }
.tk-seg { display: block; height: 100%; }
.tk-seg.b { background: var(--builder); }
.tk-seg.r { background: var(--reviewer); }
.tk-seg.o { background: var(--faint); }
.tk-legend { display: flex; flex-wrap: wrap; gap: 3px 12px; font-size: 11.5px; color: var(--muted); }
.tk-legend span { display: inline-flex; align-items: center; gap: 5px; white-space: nowrap; }
.tk-key { display: inline-block; width: 8px; height: 8px; border-radius: 2px; flex: none; }
.tk-key.b { background: var(--builder); }
.tk-key.r { background: var(--reviewer); }
.tk-key.o { background: var(--faint); }
#winCont { color: var(--muted); font-size: 13.5px; }
#winGoal { color: var(--fg); }
#winNow { color: var(--fg); opacity: 0.82; padding: 8px 10px; background: var(--panel-2); border-left: 3px solid var(--sel); border-radius: 6px; }
#winSteps { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 7px; }
#winSteps li { display: flex; gap: 10px; align-items: baseline; min-width: 0; }
#winSteps .st-text { min-width: 0; overflow-wrap: anywhere; }
#winSteps .mark { flex: none; width: 16px; text-align: center; font-size: 14px; font-weight: 700; }
#winSteps .st-done { color: var(--muted); }
#winSteps .st-done .mark { color: var(--run); }
#winSteps .st-current { font-weight: 700; }
#winSteps .st-current .mark { color: var(--sel); }
/* Bug C: the running lane's current step shows a CSS-only spinning ring where its dot sat, so the row
   looks alive; a paused/failed/stopped lane keeps the static dot, and reduced motion freezes the ring. */
#winSteps .st-spin { display: inline-block; width: 10px; height: 10px; box-sizing: border-box; border-radius: 50%; border: 2px solid var(--sel); border-top-color: transparent; vertical-align: middle; animation: spin 0.9s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
body.no-motion #winSteps .st-spin { animation: none; }
@media (prefers-reduced-motion: reduce) { #winSteps .st-spin { animation: none; } }
#winSteps .st-pending .mark { color: var(--faint); }
#winLink { font-size: 14.5px; }
#winForm { display: flex; gap: 8px; padding: 0 18px 16px; flex: none; }
/* Bug B: the steer row sat tight against the quick-reply chips. When the chips are shown, give the
   composer a 12 px gap and a 1 px top border separator (only there, so a chip-less lane shows neither). */
#winChips:not([hidden]) + #winForm { margin-top: 12px; border-top: 1px solid var(--border); }
#winInput { flex: 1; min-width: 0; height: 36px; padding: 0 12px; border-radius: 6px; border: 1px solid var(--border-2); background: var(--code-bg); color: var(--fg); font: 14.5px var(--font); }
#winSend { flex: none; height: 36px; padding: 0 16px; border-radius: 6px; border: 1px solid var(--border-2); background: var(--panel-2); color: var(--fg); font: 600 14.5px var(--font); cursor: pointer; }
#winSend:disabled, #winInput:disabled { opacity: 0.55; cursor: default; }
#winErr { padding: 0 18px 14px; color: var(--bad); font-size: 13.5px; flex: none; }
#winCtl { display: flex; flex-direction: column; gap: 7px; padding: 0 18px 12px; flex: none; }
.ctl-row { display: flex; flex-wrap: wrap; gap: 6px; }
.ctl-btn { height: 30px; padding: 0 12px; border-radius: 6px; border: 1px solid var(--border-2); background: var(--panel-2); color: var(--fg); font: 600 13px var(--font); cursor: pointer; }
.ctl-btn:hover { border-color: var(--sel); }
.ctl-btn.primary { background: var(--sel); border-color: var(--sel); color: #201331; }
.ctl-btn.danger { color: var(--bad); border-color: var(--bad); }
.ctl-btn.danger:hover { background: rgba(255, 156, 156, .14); }
.ctl-why { color: var(--amber); font-size: 12.5px; }
#winNote { display: flex; flex-direction: column; gap: 7px; }
#noteText { resize: vertical; min-height: 46px; padding: 7px 10px; border-radius: 6px; border: 1px solid var(--border-2); background: var(--code-bg); color: var(--fg); font: 13.5px/1.4 var(--font); }
.note-btns { display: flex; gap: 6px; }
#winChips { display: flex; flex-wrap: wrap; gap: 6px; padding: 0 18px; flex: none; }
.qchip { height: 24px; padding: 0 11px; border-radius: 999px; border: 1px solid var(--border-2); background: var(--panel-2); color: var(--muted); font: 600 12px var(--font); cursor: pointer; }
.qchip:hover { color: var(--fg); border-color: var(--sel); }
#toast { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); z-index: 60; max-width: min(420px, calc(100vw - 32px)); padding: 9px 16px; border-radius: 8px; background: var(--raise); border: 1px solid var(--sel); color: var(--fg); font: 600 13.5px var(--font); box-shadow: 0 6px 24px rgba(0, 0, 0, 0.5); }
#toast.bad { border-color: var(--bad); color: var(--bad); }
#toast[hidden] { display: none !important; }
@keyframes win-in { from { opacity: 0; transform: translate(var(--win-dx, 0px), var(--win-dy, 0px)) scale(.96); } to { opacity: 1; transform: none; } }
@keyframes win-out { from { opacity: 1; transform: none; } to { opacity: 0; transform: translate(var(--win-dx, 0px), var(--win-dy, 0px)) scale(.96); } }
#win.win-in { animation: win-in 180ms ease-out; }
#win.win-out { animation: win-out 120ms ease-in forwards; }
@keyframes menu-in { from { opacity: 0; transform: translateY(-4px) scale(.98); } to { opacity: 1; transform: none; } }
@keyframes row-in { from { opacity: 0; transform: translateY(-3px); } to { opacity: 1; transform: none; } }
@keyframes card-in { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
@keyframes toast-in { from { opacity: 0; transform: translate(-50%, 8px); } to { opacity: 1; transform: translateX(-50%); } }
#planMenu.menu-in, .ov-list.menu-in { animation: menu-in 160ms ease-out; }
#planMenu.menu-in [role="option"], .ov-list.menu-in .ov-row { animation: row-in 160ms ease-out both; animation-delay: calc(var(--i, 0) * 15ms); }
#hoverCard.card-in { animation: card-in 160ms ease-out 120ms both; }
#toast.toast-in { animation: toast-in 180ms ease-out; }
body.no-motion #planMenu.menu-in, body.no-motion .ov-list.menu-in, body.no-motion #planMenu.menu-in [role="option"], body.no-motion .ov-list.menu-in .ov-row, body.no-motion #hoverCard.card-in, body.no-motion #toast.toast-in { animation: none; }
@keyframes sheet-up { from { transform: translateY(100%); } to { transform: none; } }
@keyframes sheet-down { from { transform: none; } to { transform: translateY(100%); opacity: 0; } }
body.narrow #win.win-in { animation: sheet-up 260ms cubic-bezier(.2, .8, .2, 1); }
body.narrow #win.win-out { animation: sheet-down 220ms ease-in forwards; }
#fx { position: absolute; inset: 0; pointer-events: none; }
.packet { position: absolute; width: 8px; height: 8px; margin: -4px 0 0 -4px; border-radius: 50%; background: var(--sel-ink); box-shadow: 0 0 8px var(--sel); }
.checkmark { position: absolute; width: 16px; height: 16px; }
.checkmark path { stroke: var(--run); }
#lamp { position: absolute; transform: translate(-50%, -50%); border-radius: 50%; background: radial-gradient(ellipse at center, rgba(255, 220, 150, 0.2), rgba(255, 220, 150, 0.07) 45%, transparent 70%); animation: lamp 4s ease-in-out infinite; }
@keyframes lamp { 0%, 100% { opacity: 0.55; } 50% { opacity: 1; } }
body.no-motion #lamp { display: none; }
#stlist { display: flex; flex-direction: column; gap: 6px; padding: 12px 14px 20px; background: var(--bg); }
#stlist[hidden] { display: none; }
.st-row { display: flex; align-items: center; gap: 10px; width: 100%; padding: 8px 10px; background: var(--panel); border: 1px solid var(--border); border-left: 3px solid var(--border-2); border-radius: 8px; font: 15px/1.35 var(--font); color: var(--fg); cursor: pointer; text-align: left; }
.st-row .st-name { font-weight: 700; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.st-row .st-sub { color: var(--muted); font-size: 13px; white-space: nowrap; }
.st-row.st-lead { border-left-color: var(--lead); }
.st-row.st-builder { border-left-color: var(--builder); }

let k = 1, ox = 0, oy = 0, narrow = false;

function sizeStage() {

  // letterboxed room would leave large empty bands above and below it.

  document.body.classList.toggle("narrow", narrow);
  document.documentElement.classList.toggle("narrow", narrow);

  if (narrow) {
    // Narrow: the whole room at its own aspect; the station list sits right below it.
    h = Math.round((w * STAGE_H) / STAGE_W);
    wrap.style.height = h + "px";
  } else {
    wrap.style.height = "";

  // shows, but never so far that a station (its sprite, desk or plate) leaves the stage. The cover ratio

  // floored at the fit ratio. Narrow keeps its own aspect and centring.
  let iw, ih;
  if (narrow) {
    k = w / STAGE_W;

    oy = (h - ih) / 2;
  } else {
    const kFit = Math.min(w / STAGE_W, h / STAGE_H);
    const kCover = Math.max(w / STAGE_W, h / STAGE_H);

    // foot, the plate 34 units below it. Clamped to the room.

    for (const key of Object.keys(SCENE.stations)) { const f = SCENE.stations[key] && SCENE.stations[key].foot; if (f) { minFootX = Math.min(minFootX, f[0]); maxFootX = Math.max(maxFootX, f[0]); minFootY = Math.min(minFootY, f[1]); maxFootY = Math.max(maxFootY, f[1]); } }

    oy = (h - ih) / 2;

    // the room so the content box keeps its 10 px margin. Where the room is smaller, keep it centred.
    if (iw > w) {

}

        station: hd.key, role: sp ? sp.role : hd.role, kind: laneKind(l), laneId: id, name: laneName(l),
        status: st.key,
        clip: sp ? sp.clip : "",
        frame: sp && sp.el && sp.el.dataset.frame !== undefined ? Number(sp.el.dataset.frame) : null,
        foot: { x: r.x + ox + f[0] * k, y: r.y + oy + f[1] * k },
        plate: { x: plate.x, y: plate.y, w: plate.width, h: plate.height },
        done: l.progress ? (l.progress.done || 0) : 0,
        total: l.progress ? (l.progress.total || 0) : 0,
        tokens: CAUI.tokenTotal(l.tokens),
        suggest: l.suggest || "",
        prop: hotProp[hd.key] || hd.prop,
        deskImage: desk ? desk.style.backgroundImage.replace(/^url\(["']?/, "").replace(/["']?\)$/, "") : "",
        desk: !!desk && desk.style.display !== "none",
      };
    }).filter(Boolean);
    const allStations = stations.concat(hotStations);
    const winLane = winFor && winFor !== "lead" && model ? model.lanes.find((x) => x.id === winFor) : null;
    const winSrc = winFor === "lead" ? (model && model.plan) : winLane;
    const winTk = winSrc
      ? (() => { const parts = CAUI.tokenSplit(winSrc.tokensBy); return { total: CAUI.tokenTotal(winSrc.tokens), build: parts[0].total, review: parts[1].total, other: parts[2].total }; })()
      : null;
    return {
      mode,
      plan: (model && model.plan && model.plan.title) || "",
      goal: (model && model.plan && model.plan.goal) || "",
      lead: leadInfo,
      stage: { x: r.x, y: r.y, w: r.width, h: r.height, k },
      stations: allStations,
      overflow: (() => { const ids = model ? model.lanes.filter((l) => !laneStation.has(l.id) && !laneHot.has(l.id)).map((l) => l.id) : []; return { count: ids.length, ids, open: ovOpen }; })(),
      window: { open: !win.hidden && !!winFor, laneId: winFor, kind: winFor === "lead" ? null : (winLane ? laneKind(winLane) : null), x: wr.x, y: wr.y, w: wr.width, h: wr.height, focusInside: win.contains(document.activeElement), tokens: winTk, actions: [...$("winBtns").children].map((b) => b.dataset.action), suggest: (winLane && winLane.suggest) || "", noteOpen: !$("winNote").hidden },
      win: { open: !win.hidden, sheet: narrow, rect: { x: wr.x, y: wr.y, w: wr.width, h: wr.height }, maxHeight: win.style.maxHeight || getComputedStyle(win).maxHeight },
      effects: effects.slice(),
      motion: PixelSprites.motion(),
      lanes: (model && model.lanes || []).map((l) => ({ id: l.id, health: String(l.health || ""), running: !!l.running, result: l.result || "", done: (l.progress && l.progress.done) || 0, total: (l.progress && l.progress.total) || 0, steps: (l.status && l.status.steps) || "", attention: l.status ? !!l.status.attention : null })),
      planTokens: CAUI.tokenTotal(model && model.plan.tokens),
      controls: demoControls.slice(),
      quickSteers: $("winChips").hidden ? 0 : $("winChips").childElementCount,
    };
  },
  press(id) {
    if (!model) return false;
    if (id === "lead") { winHooks.open("lead", narrow ? (stRows.get("lead") || null) : $("plate-lead"), false); return true; }
    if (!model.lanes.some((l) => l.id === id)) return false;
    let anchor = null;
    for (const stKey of WORKER_STATIONS) if (stationLane[stKey] === id) anchor = $("plate-" + stKey);
    for (const hd of SCENE.hotdesks) if (hotSeat[hd.key] === id) anchor = $("plate-" + hd.key);
    if (!anchor) anchor = ovBtns.get(id) || stRows.get(id) || null;
    winHooks.open(id, anchor, false);
    return true;
  },
  demoAdvance,
  demoFail,
  // The glance as the page shows it, for the check harness: sign state, word, detail, tab title, favicon.
  glance() {
    const sign = $("glanceSign");
    const link = document.querySelector('link[rel~="icon"]');
    const w = sign && sign.querySelector(".gs-word");
    const d = sign && sign.querySelector(".gs-detail");
    return {
      state: sign && !sign.hidden ? sign.dataset.state : null,
      word: (w && w.textContent) || "",
      detail: (d && d.textContent) || "",
      title: document.title,
      favicon: (link && link.getAttribute("href")) || "",
      glanceOn: glanceOn,
    };
  },
  // The geometry the fit checks read: the stage, the room, the sign board and every station sprite and
  // label rect, all in viewport coordinates so a check can test them against the stage.
  layout() {
    const r = $("stage").getBoundingClientRect();
    const box = (el) => {
      if (!el || el.hidden || el.style.display === "none") return null;
      const b = el.getBoundingClientRect();
      if (b.width <= 0 && b.height <= 0) return null;
      return { x: b.x, y: b.y, w: b.width, h: b.height };
    };
    const stations = [];
    for (const key of STATION_KEYS.concat(SCENE.hotdesks.map((h) => h.key))) {
      const sp = sprites[key] || hotSprites[key];
      const plateEl = $("plate-" + key);
      const sprite = box(sp && sp.el);
      const label = box(plateEl);
      if (!sprite && !label) continue;
      const laneId = key === "lead" ? "lead" : (stationLane[key] || hotSeat[key] || null);
      const l = laneId && laneId !== "lead" && model ? model.lanes.find((x) => x.id === laneId) : null;
      const st = l ? CAUI.laneStatus(l) : null;
      stations.push({
        station: key, laneId: laneId || null, clip: sp ? sp.clip : "",
        steps: (st && st.steps) || "",
        sub: plateEl ? ((plateEl.querySelector(".p-sub") || {}).textContent || "") : "",
        sprite, label,
      });
    }
    const signEl = $("glanceSign");
    const sign = signEl && !signEl.hidden ? (box(signEl.querySelector(".gs-board")) || box(signEl)) : null;
    return { stage: { x: r.x, y: r.y, w: r.width, h: r.height }, room: box($("room")), sign, stations };
  },
  // ids deleted through the Delete controls, for the check harness
  removed: () => [...demoRemoved],
  // DOM writes per poll-rebuilt region: the hover check asserts these stop growing while nothing changed
  renders: () => ({ ...renders }),
};

$("planBtn").addEventListener("click", () => ($("planMenu").hidden ? openPlanMenu() : closePlanMenu(true)));
$("planBtn").addEventListener("keydown", (e) => { if (e.key === "ArrowDown" || e.key === "ArrowUp") { e.preventDefault(); openPlanMenu(); } });
$("planMenu").addEventListener("click", (e) => { const del = e.target.closest("[data-pm-del]"); if (del) { e.preventDefault(); deletePlan(del.dataset.pmDel); return; } const li = e.target.closest("[role=option]"); if (li) pickPlan(Number(li.dataset.i)); });
$("planMenu").addEventListener("mousemove", (e) => {
  const li = e.target.closest("[role=option]"); if (!li || Number(li.dataset.i) === planMenuActive) return;
  planMenuActive = Number(li.dataset.i);
  $("planMenu").querySelectorAll("[role=option]").forEach((x) => x.classList.toggle("active", x === li));
  $("planMenu").setAttribute("aria-activedescendant", li.id);
});
$("planMenu").addEventListener("keydown", (e) => {
  const n = $("planSel").options.length;
  // A focused Delete button owns Enter/Space: skip the pick so its own click fires (delete, not pickPlan).
  if ((e.key === "Enter" || e.key === " ") && e.target.closest && e.target.closest("[data-pm-del]")) return;
  if (e.key === "Escape") { e.preventDefault(); closePlanMenu(true); return; }
  if (e.key === "Tab") { closePlanMenu(); return; }
  if (e.key === "Enter" || e.key === " ") { e.preventDefault(); pickPlan(planMenuActive); return; }
  const step = { ArrowDown: 1, ArrowUp: -1 }[e.key];
  if (step) planMenuActive = (planMenuActive + step + n) % n;
  else if (e.key === "Home") planMenuActive = 0;
  else if (e.key === "End") planMenuActive = n - 1;
  else return;
  e.preventDefault(); renderPlanMenu();
  const a = $("planMenu").querySelector(".active"); if (a) a.scrollIntoView({ block: "nearest" });
});
document.addEventListener("pointerdown", (e) => { if (!e.target.closest("#planMenu, #planBtn")) closePlanMenu(); });
window.addEventListener("resize", () => { closePlanMenu(); hideHoverCard(); schedulePositionWin(); });
const onScroll = () => { schedulePositionWin(); hideHoverCard(); };
window.addEventListener("scroll", onScroll, { passive: true });
document.addEventListener("scroll", onScroll, { passive: true, capture: true });
for (const id of ["tokenChip", "statusBadge"]) {
  $(id).addEventListener("mouseenter", () => showHoverCard(id));
  $(id).addEventListener("mouseleave", hideHoverCard);
  $(id).addEventListener("focus", () => showHoverCard(id));
  $(id).addEventListener("blur", hideHoverCard);
}

$("planSel").addEventListener("change", () => { planSel = $("planSel").value; planUserPicked = true; render(); });
// Step 4: the glance toggle in the top bar, the "g" shortcut and the cross-tab "ca.glance" listener.
$("glanceToggle").addEventListener("click", () => setGlanceOn(!glanceOn));
document.addEventListener("keydown", (e) => {
  if (e.key !== "g" && e.key !== "G") return;
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const t = e.target;
  if (t && (t.tagName === "INPUT" || t.tagName === "TEXTAREA" || t.tagName === "SELECT" || t.isContentEditable)) return;
  e.preventDefault();
  setGlanceOn(!glanceOn);
});
window.addEventListener("storage", (e) => {
  if (e.key !== GLANCE_KEY) return;
  const on = e.newValue !== "off";
  if (on !== glanceOn) { glanceOn = on; renderGlance(); }
});
new ResizeObserver(() => { sizeStage(); layoutStations(); renderNarrowList(); }).observe($("stagewrap"));
new ResizeObserver(() => { if (!$("win").hidden) schedulePositionWin(); }).observe($("win"));
(async () => {
  await loadScene();
  STAGE_W = SCENE.stage[0]; STAGE_H = SCENE.stage[1];
  sizeStage();
  scheduleDemoEvents();
  if (mode === "demo") render();
  setInterval(tick, 2000);
  if (mode !== "demo") tick();
  initSprites();
})();
})();
</script>
</body>
